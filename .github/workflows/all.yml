# GitHub Actions workflow file for building and releasing a Fyne app for all platforms (Windows, Linux, macOS, Android)
# Includes installation of dependencies like MinGW-w64 cross-compiler, Mesa OpenGL, GLFW, Android NDK, etc.
# Manual trigger only
name: Fyne package All Platforms and Release

# Define triggers for the workflow
on:
  # Manual trigger from GitHub interface with configurable inputs
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        default: '1.0.0'
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - snapshot

# Define environment variables used across jobs
env:
  # Name of your application (used for naming output files and directories)
  APP_NAME: crocgui # This name comes from FyneApp.toml

# Define the jobs for the workflow
jobs:
  # Job to build the application for Windows target
  build-windows:
    uses: ./.github/workflows/build-platform.yml # Call the reusable workflow
    with:
      platform_name: "Windows"
      runs_on: "ubuntu-latest" # Specify the runner
      go_version: '1.21'
      croc_ref: 'main'
      app_name: ${{ env.APP_NAME }} # <-- Передаём APP_NAME как input
      build_script: |
        cd $GITHUB_WORKSPACE/workspace/crocgui
        echo "Building for Windows amd64 using MinGW-w64..."
        export CGO_ENABLED=1
        export GOOS=windows
        export GOARCH=amd64
        export CC=x86_64-w64-mingw32-gcc
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64
        fyne package --os windows --release -- --ldflags="-s -w"
        if [ ! -f "${{ inputs.app_name }}.exe" ]; then
            echo "ERROR: fyne package did not create ${{ inputs.app_name }}.exe"
            ls -la .
            exit 1
        fi
        echo "Contents of current directory after build:"
        ls -la .
      artifact_name: windows-amd64-build
      artifact_path: ${{ github.workspace }}/workspace/crocgui/${{ inputs.app_name }}.exe # <-- Используем input.app_name

  # Job to build the application for Linux target
  build-linux:
    uses: ./.github/workflows/build-platform.yml # Call the reusable workflow
    with:
      platform_name: "Linux"
      runs_on: "ubuntu-latest" # Specify the runner
      go_version: '1.21'
      croc_ref: 'main'
      app_name: ${{ env.APP_NAME }} # <-- Передаём APP_NAME как input
      build_script: |
        cd $GITHUB_WORKSPACE/workspace/crocgui
        echo "Building for Linux amd64..."
        export CGO_ENABLED=1
        export GOOS=linux
        export GOARCH=amd64
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxss-dev libxxf86vm-dev
        fyne package --os linux --release -- --ldflags="-s -w"
        if [ ! -f "${{ inputs.app_name }}.tar.xz" ]; then
            echo "ERROR: fyne package did not create ${{ inputs.app_name }}.tar.xz"
            ls -la .
            exit 1
        fi
        echo "Contents of current directory after build:"
        ls -la .
      artifact_name: linux-amd64-build
      artifact_path: ${{ github.workspace }}/workspace/crocgui/${{ inputs.app_name }}.tar.xz # <-- Используем input.app_name

  # Job to build the application for macOS target
  build-macos:
    uses: ./.github/workflows/build-platform.yml # Call the reusable workflow
    with:
      platform_name: "macOS"
      runs_on: "macos-latest" # Specify the runner
      go_version: '1.21'
      croc_ref: 'main'
      app_name: ${{ env.APP_NAME }} # <-- Передаём APP_NAME как input
      build_script: |
        cd $GITHUB_WORKSPACE/workspace/crocgui
        echo "Building for macOS amd64 and arm64..."
        export CGO_ENABLED=1
        export GOOS=darwin
        # Build for amd64
        export GOARCH=amd64
        fyne package --os darwin --release --name "${{ inputs.app_name }}-amd64" -- --ldflags="-s -w"
        if [ ! -d "${{ inputs.app_name }}-amd64.app" ]; then
            echo "ERROR: fyne package did not create ${{ inputs.app_name }}-amd64.app for amd64"
            ls -la .
            exit 1
        fi
        # Build for arm64
        export GOARCH=arm64
        fyne package --os darwin --release --name "${{ inputs.app_name }}-arm64" -- --ldflags="-s -w"
        if [ ! -d "${{ inputs.app_name }}-arm64.app" ]; then
            echo "ERROR: fyne package did not create ${{ inputs.app_name }}-arm64.app for arm64"
            ls -la .
            exit 1
        fi
        # Check architecture
        AMD64_EXECUTABLE_PATH="${{ inputs.app_name }}-amd64.app/Contents/MacOS/${{ inputs.app_name }}"
        ARM64_EXECUTABLE_PATH="${{ inputs.app_name }}-arm64.app/Contents/MacOS/${{ inputs.app_name }}"
        if [ -f "$AMD64_EXECUTABLE_PATH" ]; then
            echo "Architecture of $AMD64_EXECUTABLE_PATH:"
            file "$AMD64_EXECUTABLE_PATH"
        else
            echo "ERROR: Executable not found at $AMD64_EXECUTABLE_PATH"
            exit 1
        fi
        if [ -f "$ARM64_EXECUTABLE_PATH" ]; then
            echo "Architecture of $ARM64_EXECUTABLE_PATH:"
            file "$ARM64_EXECUTABLE_PATH"
        else
            echo "ERROR: Executable not found at $ARM64_EXECUTABLE_PATH"
            exit 1
        fi
        echo "Contents of current directory after build:"
        ls -la .
      artifact_name: macos-builds
      artifact_path: |
        ${{ github.workspace }}/workspace/crocgui/${{ inputs.app_name }}-amd64.app
        ${{ github.workspace }}/workspace/crocgui/${{ inputs.app_name }}-arm64.app

  # Job to build the application for Android target
  build-android:
    uses: ./.github/workflows/build-platform.yml # Call the reusable workflow
    with:
      platform_name: "Android"
      runs_on: "ubuntu-latest" # Specify the runner
      go_version: '1.21'
      croc_ref: 'main'
      app_name: ${{ env.APP_NAME }} # <-- Передаём APP_NAME как input
      build_script: |
        cd $GITHUB_WORKSPACE/workspace/crocgui
        echo "Building for Android targets: android/arm, android/arm64, android/386, android/amd64"
        # Check ANDROID_HOME
        echo "ANDROID_HOME is set to: $ANDROID_HOME"
        if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not set."
            exit 1
        fi
        # Install NDK
        NDK_VERSION="27.3.13750724"
        echo "Installing NDK version: $NDK_VERSION"
        if command -v sdkmanager &> /dev/null; then
            sdkmanager --install "ndk;$NDK_VERSION"
            NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
            if [ -d "$NDK_PATH" ]; then
                export ANDROID_NDK_HOME=$NDK_PATH
                echo "ANDROID_NDK_HOME set to: $ANDROID_NDK_HOME"
            else
                echo "ERROR: NDK directory $NDK_PATH does not exist after installation."
                exit 1
            fi
        else
            echo "ERROR: sdkmanager is not available in PATH."
            exit 1
        fi
        # Build for each target
        TARGETS=("android/arm" "android/arm64" "android/386" "android/amd64")
        for target in "${TARGETS[@]}"; do
          echo "Building for target: $target"
          GOOS=${target%/*}
          GOARCH=${target#*/}
          export CGO_ENABLED=1
          export GOOS=$GOOS
          export GOARCH=$GOARCH
          fyne package -os $target --release -- --ldflags="-s -w"
          APK_NAME="${{ inputs.app_name }}.apk"
          if [ -f "$APK_NAME" ]; then
              mv "$APK_NAME" "${{ inputs.app_name }}-${GOARCH}.apk"
              echo "Renamed APK to: ${{ inputs.app_name }}-${GOARCH}.apk"
          else
              echo "ERROR: fyne package did not create ${{ inputs.app_name }}.apk for $target"
              exit 1
          fi
        done
        ls -la *.apk
      artifact_name: android-apks
      artifact_path: ${{ github.workspace }}/workspace/crocgui/${{ inputs.app_name }}-*.apk # <-- Используем input.app_name

  # Job to create a GitHub Release and upload artifacts
  create-release:
    # This job waits for all build jobs to finish
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: macos-latest # Consistent with main build runner, needed for hdiutil
    # Only run this job if workflow was triggered manually with build_type 'release' or 'snapshot'
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'snapshot') }}
    
    steps:
      # Step 1: Download all artifacts from previous jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Step 2: Prepare the release assets (optional: add build info)
      - name: Prepare release assets
        run: |
          echo "Preparing release assets..."
          mkdir -p release-assets
          for artifact_dir in artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              echo "Copying contents from $artifact_dir to release-assets/"
              cp -r "$artifact_dir"* release-assets/
            fi
          done
          # Find and create .dmg images for all .app bundles in release-assets
          find release-assets -type d -name "*.app" -print0 | while IFS= read -r -d '' app_bundle; do
            parent_dir=$(dirname "$app_bundle")
            app_name=$(basename "$app_bundle")
            dmg_name="${app_name%.app}.dmg"
            dmg_path="$parent_dir/$dmg_name"
            echo "Creating DMG for $app_bundle at $dmg_path"
            hdiutil create -srcfolder "$app_bundle" -volname "$app_name" -ov -format UDZO "$dmg_path"
            if [ $? -eq 0 ]; then
              echo "Successfully created DMG: $dmg_name"
            else
              echo "Error: Failed to create DMG for $app_bundle"
              exit 1
            fi
          done
          # Create a build information file
          echo "Build Information" > release-assets/BUILD_INFO.txt
          echo "=================" >> release-assets/BUILD_INFO.txt
          echo "Project: crocgui (from FyneApp.toml)" >> release-assets/BUILD_INFO.txt
          echo "Version: ${{ github.event.inputs.release_version || 'manual_run' }}" >> release-assets/BUILD_INFO.txt
          echo "Build Type: ${{ github.event.inputs.build_type || 'manual' }}" >> release-assets/BUILD_INFO.txt
          # Use bash command substitution to execute 'date -u' and capture its output
          BUILD_DATE=$(date -u)
          echo "Build Date: $BUILD_DATE" >> release-assets/BUILD_INFO.txt
          echo "GitHub Run: https://github.com/  $GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> release-assets/BUILD_INFO.txt
          echo "" >> release-assets/BUILD_INFO.txt
          # List the generated files
          echo "Generated files:" >> release-assets/BUILD_INFO.txt
          echo "----------------" >> release-assets/BUILD_INFO.txt
          ls -la release-assets/ >> release-assets/BUILD_INFO.txt
          # Print the file content for verification
          cat release-assets/BUILD_INFO.txt
          # Export the BUILD_DATE to the environment so it's available in the next step
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      # Step 3: Create the GitHub Release and upload assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version && format('v{0}', github.event.inputs.release_version) }}
          name: Release ${{ github.event.inputs.release_version && format('v{0}', github.event.inputs.release_version) }}
          draft: false
          prerelease: $