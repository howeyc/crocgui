# GitHub Actions workflow file for building and releasing a Fyne app for all platforms (Windows, Linux, macOS, Android)
# Includes installation of dependencies like MinGW-w64 cross-compiler, Mesa OpenGL, GLFW, Android NDK, etc.
# Manual trigger only
name: Fyne package All and Release

# Define triggers for the workflow
on:
  # Manual trigger from GitHub interface with configurable inputs
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.2.3) - leave empty to auto-detect from FyneApp.toml'
        required: false
        default: ''
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - snapshot

# Define the jobs for the workflow
jobs:
  # Job to build the application for Windows target
  build-windows:
    #if: false
    runs-on: ubuntu-latest # Runs on Ubuntu to use MinGW cross-compiler
    steps:
      # Step 1: Checkout the main repository (your Fyne app) directly into workspace/crocgui
      - name: Checkout main repository (crocgui)
        uses: actions/checkout@v4
        with:
          path: workspace/crocgui # Checkout directly into the desired workspace subdirectory

      # Step 2: Checkout the croc dependency repository directly into workspace/croc
      - name: Checkout croc dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/croc
          ref: main
          path: workspace/croc # Checkout directly into the desired workspace subdirectory

      # Step 3: Checkout the peerdiscovery dependency repository directly into workspace/peerdiscovery
      - name: Checkout peerdiscovery dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/peerdiscovery
          ref: main
          path: workspace/peerdiscovery # Checkout directly into the desired workspace subdirectory

      # Step 5: Install Go
      - name: Set up Go
        uses: actions/setup-go@v5 # Use the latest version of the Go setup action
        with:
          go-version: '1.24' # Specify your Go version
          # Cache dependencies based on go.sum file in the main-repo path (now in workspace/crocgui)
          cache-dependency-path: ${{ github.workspace }}/workspace/crocgui/go.sum

      # Step 6: Install MinGW-w64 cross-compiler
      - name: Install MinGW-w64 cross-compiler
        run: |
          # Update package list and install MinGW-w64 GCC for x86_64
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      # Step 7: Install Fyne CLI
      - name: Install Fyne CLI
        run: |
          # Install the Fyne CLI tool
          go install fyne.io/tools/cmd/fyne@latest

      # Step 8: Build the application using fyne package for Windows
      - name: Build with fyne for Windows
        run: |
          # Change directory to the project root inside the workspace
          cd $GITHUB_WORKSPACE/workspace/crocgui
          
          echo "Building for Windows amd64 using MinGW-w64..."
          
          # Set environment variables for cross-compilation
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64
          # Set the C compiler to the MinGW-w64 cross-compiler
          export CC=x86_64-w64-mingw32-gcc
          
          # Use fyne package to build the Windows executable and package it
          # The -tags opengl flag is passed via --
          fyne package --os windows --release
          
          # Verify the .exe file was created
          if [ ! -f "crocgui.exe" ]; then
              echo "ERROR: fyne package did not create crocgui.exe"
              ls -la .
              exit 1
          fi
          
          # List the output directory to confirm build success
          echo "Contents of current directory after build:"
          ls -la .

      # Step 9: Upload the built .exe as an artifact
      - name: Upload Windows artifact
        # Upload even if the build step failed, to help with debugging
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-build
          # Path to the built .exe file
          path: ${{ github.workspace }}/workspace/crocgui/crocgui.exe
          retention-days: 7 # Keep artifacts for 7 days
          if-no-files-found: error # Fail if the .exe is not found

  # Job to build the application for Linux target
  build-linux:
    #if: false
    runs-on: ubuntu-latest # Runs on Ubuntu to build natively for Linux
    steps:
      # Step 1: Checkout the main repository (your Fyne app) directly into workspace/crocgui
      - name: Checkout main repository (crocgui)
        uses: actions/checkout@v4
        with:
          path: workspace/crocgui # Checkout directly into the desired workspace subdirectory

      # Step 2: Checkout the croc dependency repository directly into workspace/croc
      - name: Checkout croc dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/croc
          ref: main
          path: workspace/croc # Checkout directly into the desired workspace subdirectory

      # Step 3: Checkout the peerdiscovery dependency repository directly into workspace/peerdiscovery
      - name: Checkout peerdiscovery dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/peerdiscovery
          ref: main
          path: workspace/peerdiscovery # Checkout directly into the desired workspace subdirectory

      # Step 5: Install Go
      - name: Set up Go
        uses: actions/setup-go@v5 # Use the latest version of the Go setup action
        with:
          go-version: '1.24' # Specify your Go version
          # Cache dependencies based on go.sum file in the main-repo path (now in workspace/crocgui)
          cache-dependency-path: ${{ github.workspace }}/workspace/crocgui/go.sum

      # Step 6: Install Linux dependencies required by Fyne (OpenGL, EGL, GLES, X11)
      - name: Install Linux dependencies (libgl1-mesa-dev xorg-dev libxkbcommon-dev)
        run: |
          # Update package list and install Mesa libraries required by Fyne for OpenGL support
          # and X11 libraries required by GLFW
          sudo apt-get update
          #sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxss-dev libxxf86vm-dev
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev

      # Step 7: Install Fyne CLI
      - name: Install Fyne CLI
        run: |
          # Install the Fyne CLI tool
          go install fyne.io/tools/cmd/fyne@latest

      # Step 8: Build the application using fyne package for Linux
      - name: Build with fyne for Linux
        run: |
          # Change directory to the project root inside the workspace
          cd $GITHUB_WORKSPACE/workspace/crocgui
          
          echo "Building for Linux amd64..."
          
          # Set environment variables for native compilation (CGO is enabled by default)
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          
          # Use fyne package to build the Linux executable and package it
          fyne package --os linux --release
          
          # Verify the .tar.xz archive file was created
          if [ ! -f "crocgui.tar.xz" ]; then
              echo "ERROR: fyne package did not create crocgui.tar.xz"
              ls -la .
              exit 1
          fi
          
          # List the output directory to confirm build success
          echo "Contents of current directory after build:"
          ls -la .

      # Step 9: Upload the built Linux app as an artifact
      - name: Upload Linux artifact
        # Upload even if the build step failed, to help with debugging
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-build
          # Path to the built Linux .tar.xz archive
          path: ${{ github.workspace }}/workspace/crocgui/crocgui.tar.xz
          retention-days: 7 # Keep artifacts for 7 days
          if-no-files-found: error # Fail if the .tar.xz is not found

  # Job to build the application for macOS x86_64 (Intel) target
  build-macos-amd64:
    #if: false
    runs-on: macos-latest # Runs on a macOS runner
    steps:
      # Step 1: Checkout the main repository (your Fyne app) directly into workspace/crocgui
      - name: Checkout main repository (crocgui)
        uses: actions/checkout@v4
        with:
          path: workspace/crocgui # Checkout directly into the desired workspace subdirectory

      # Step 2: Checkout the croc dependency repository directly into workspace/croc
      - name: Checkout croc dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/croc
          ref: main
          path: workspace/croc # Checkout directly into the desired workspace subdirectory

      # Step 3: Checkout the peerdiscovery dependency repository directly into workspace/peerdiscovery
      - name: Checkout peerdiscovery dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/peerdiscovery
          ref: main
          path: workspace/peerdiscovery # Checkout directly into the desired workspace subdirectory

      # Step 5: Install Go
      - name: Set up Go
        uses: actions/setup-go@v5 # Use the latest version of the Go setup action
        with:
          go-version: '1.24' # Specify your Go version
          # Cache dependencies based on go.sum file in the main-repo path (now in workspace/crocgui)
          cache-dependency-path: ${{ github.workspace }}/workspace/crocgui/go.sum

      # Step 6: Install Fyne CLI
      - name: Install Fyne CLI
        run: |
          # Install the Fyne CLI tool
          go install fyne.io/tools/cmd/fyne@latest

      # Step 7: Build the application for macOS amd64 (Intel)
      - name: Build for macOS amd64 (Intel)
        run: |
          # Change directory to the project root inside the workspace
          cd $GITHUB_WORKSPACE/workspace/crocgui
          
          echo "Building for macOS amd64 (Intel)..."
          
          # Set environment variables for cross-compilation
          export CGO_ENABLED=1
          export GOOS=darwin
          export GOARCH=amd64
          
          # Use fyne package to create the .app bundle for amd64
          fyne package --os darwin --release
          APP_NAME="crocgui.app"
          
          # Verify the .app bundle was created
          if [ ! -d "$APP_NAME" ]; then
              echo "ERROR: fyne package did not create $APP_NAME for amd64"
              ls -la .
              exit 1
          fi
          
          # Create DMG file using hdiutil (macOS utility)
          echo "Creating DMG for $APP_NAME"
          DMG_NAME="crocgui-amd64.dmg"
          hdiutil create -srcfolder "$APP_NAME" -volname "crocgui-amd64" -ov -format UDZO "$DMG_NAME"
          
          # List the output directory to confirm DMG creation
          echo "Contents of current directory after DMG creation:"
          ls -la *.dmg

      # Step 8: Upload the built .dmg file as an artifact
      - name: Upload macOS amd64 artifact
        # Upload even if the build step failed, to help with debugging
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-amd64-build
          # Path to the built .dmg file
          path: ${{ github.workspace }}/workspace/crocgui/crocgui-amd64.dmg
          retention-days: 7 # Keep artifacts for 7 days
          if-no-files-found: error # Fail if the .dmg file is not found

  # Job to build the application for macOS arm64 (Apple Silicon) target
  build-macos-arm64:
    #if: false
    runs-on: macos-latest # Runs on a macOS runner
    steps:
      # Step 1: Checkout the main repository (your Fyne app) directly into workspace/crocgui
      - name: Checkout main repository (crocgui)
        uses: actions/checkout@v4
        with:
          path: workspace/crocgui # Checkout directly into the desired workspace subdirectory

      # Step 2: Checkout the croc dependency repository directly into workspace/croc
      - name: Checkout croc dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/croc
          ref: main
          path: workspace/croc # Checkout directly into the desired workspace subdirectory

      # Step 3: Checkout the peerdiscovery dependency repository directly into workspace/peerdiscovery
      - name: Checkout peerdiscovery dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/peerdiscovery
          ref: main
          path: workspace/peerdiscovery # Checkout directly into the desired workspace subdirectory

      # Step 5: Install Go
      - name: Set up Go
        uses: actions/setup-go@v5 # Use the latest version of the Go setup action
        with:
          go-version: '1.24' # Specify your Go version
          # Cache dependencies based on go.sum file in the main-repo path (now in workspace/crocgui)
          cache-dependency-path: ${{ github.workspace }}/workspace/crocgui/go.sum

      # Step 6: Install Fyne CLI
      - name: Install Fyne CLI
        run: |
          # Install the Fyne CLI tool
          go install fyne.io/tools/cmd/fyne@latest

      # Step 7: Build the application for macOS arm64 (Apple Silicon)
      - name: Build for macOS arm64 (Apple Silicon)
        run: |
          # Change directory to the project root inside the workspace
          cd $GITHUB_WORKSPACE/workspace/crocgui
          
          echo "Building for macOS arm64 (Apple Silicon)..."
          
          # Set environment variables for cross-compilation
          export CGO_ENABLED=1
          export GOOS=darwin
          export GOARCH=arm64
          
          # Use fyne package to create the .app bundle for arm64
          fyne package --os darwin --release
          APP_NAME="crocgui.app"
          
          # Verify the .app bundle was created
          if [ ! -d "$APP_NAME" ]; then
              echo "ERROR: fyne package did not create $APP_NAME for arm64"
              ls -la .
              exit 1
          fi
          
          # Create DMG file using hdiutil (macOS utility)
          echo "Creating DMG for $APP_NAME"
          DMG_NAME="crocgui-arm64.dmg"
          hdiutil create -srcfolder "$APP_NAME" -volname "crocgui-arm64" -ov -format UDZO "$DMG_NAME"
          
          # List the output directory to confirm DMG creation
          echo "Contents of current directory after DMG creation:"
          ls -la *.dmg

      # Step 8: Upload the built .dmg file as an artifact
      - name: Upload macOS arm64 artifact
        # Upload even if the build step failed, to help with debugging
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          # Path to the built .dmg file
          path: ${{ github.workspace }}/workspace/crocgui/crocgui-arm64.dmg
          retention-days: 7 # Keep artifacts for 7 days
          if-no-files-found: error # Fail if the .dmg file is not found

  # Job to build the application for Android target
  build-android:
    #if: false
    runs-on: ubuntu-latest # Runs on Ubuntu to use fyne package with Android NDK
    steps:
      # Step 1: Checkout the main repository (your Fyne app) directly into workspace/crocgui
      - name: Checkout main repository (crocgui)
        uses: actions/checkout@v4
        with:
          path: workspace/crocgui # Checkout directly into the desired workspace subdirectory

      # Step 2: Checkout the croc dependency repository directly into workspace/croc
      - name: Checkout croc dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/croc
          ref: main
          path: workspace/croc # Checkout directly into the desired workspace subdirectory

      # Step 3: Checkout the peerdiscovery dependency repository directly into workspace/peerdiscovery
      - name: Checkout peerdiscovery dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/peerdiscovery
          ref: main
          path: workspace/peerdiscovery # Checkout directly into the desired workspace subdirectory

      # Step 4: Verify FyneApp.toml and AndroidManifest.xml (no need for separate setup step)
      - name: Verify FyneApp.toml and AndroidManifest.xml
        run: |
          # Print the structure for debugging, check for FyneApp.toml and AndroidManifest.xml
          echo "Workspace structure (crocgui):"
          ls -la $GITHUB_WORKSPACE/workspace/crocgui/
          if [ -f "$GITHUB_WORKSPACE/workspace/crocgui/FyneApp.toml" ]; then
            echo "FyneApp.toml found:"
            cat $GITHUB_WORKSPACE/workspace/crocgui/FyneApp.toml
          else
            echo "ERROR: FyneApp.toml not found in $GITHUB_WORKSPACE/workspace/crocgui/"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/workspace/crocgui/AndroidManifest.xml" ]; then
            echo "AndroidManifest.xml found."
          else
            echo "ERROR: AndroidManifest.xml not found in $GITHUB_WORKSPACE/workspace/crocgui/"
            exit 1
          fi

      # Step 5: Install Go
      - name: Set up Go
        uses: actions/setup-go@v5 # Use the latest version of the Go setup action
        with:
          go-version: '1.24' # Specify your Go version
          # Cache dependencies based on go.sum file in the main-repo path (now in workspace/crocgui)
          cache-dependency-path: ${{ github.workspace }}/workspace/crocgui/go.sum

      # Step 7: Install Fyne CLI
      - name: Install Fyne CLI
        run: |
          # Install the Fyne CLI tool
          go install fyne.io/tools/cmd/fyne@latest

      # Step 8: Build the application using fyne package for Android targets
      # We will loop through the targets to build each one
      - name: Build with fyne package for Android targets
        run: |
          # Change directory to the project root inside the workspace
          cd $GITHUB_WORKSPACE/workspace/crocgui
          
          # Read version and build number from FyneApp.toml
          echo "Reading version and build number from FyneApp.toml..."
          VERSION_NAME=$(grep -E '^\s*Version\s*=' FyneApp.toml | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
          BUILD_NUMBER=$(grep -E '^\s*Build\s*=' FyneApp.toml | sed -E 's/^\s*Build\s*=\s*([0-9]+).*/\1/')
          
          if [ -z "$VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
              echo "ERROR: Could not extract Version or Build number from FyneApp.toml."
              cat FyneApp.toml
              exit 1
          fi
          
          echo "Extracted Version Name: $VERSION_NAME"
          echo "Extracted Build Number: $BUILD_NUMBER"
          
          # Update AndroidManifest.xml with the extracted values
          echo "Updating AndroidManifest.xml with versionName=$VERSION_NAME and versionCode=$BUILD_NUMBER"
          # Use sed to replace the values in the manifest
          sed -i.bak "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VERSION_NAME\"/g" AndroidManifest.xml
          sed -i.bak "s/android:versionCode=\"[0-9]*\"/android:versionCode=\"$BUILD_NUMBER\"/g" AndroidManifest.xml
          
          # Verify the update (optional, for debugging)
          echo "Updated AndroidManifest.xml:"
          grep -E 'android:versionName|android:versionCode' AndroidManifest.xml
          
          echo "Building for Android targets: android/arm, android/arm64, android/386, android/amd64"
          
          # Define the targets as a bash array
          TARGETS=("android/arm" "android/arm64" "android/386" "android/amd64")
          
          # Loop through each target
          for target in "${TARGETS[@]}"; do
            echo "Building for target: $target"
            
            # Extract OS and ARCH from target (format: os/arch)
            GOOS=${target%/*}
            GOARCH=${target#*/} # This gets the part after the last '/'
            
            # Set environment variables for cross-compilation
            export CGO_ENABLED=1
            export GOOS=$GOOS
            export GOARCH=$GOARCH
            # ANDROID_NDK_HOME should already be set from the previous step
            
            echo "Environment: GOOS=$GOOS, GOARCH=$GOARCH, ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            
            # Use fyne package to build the Android APK for the target
            # The command from your Makefile: fyne package -os android/<arch> --release
            fyne package -os $target --release
            APK_NAME="crocgui.apk"
            if [ -f "$APK_NAME" ]; then
                mv "$APK_NAME" "crocgui-${GOARCH}.apk"
                echo "Renamed APK to: crocgui-${GOARCH}.apk"
            else
                echo "ERROR: fyne package did not create crocgui.apk for $target"
                exit 1
            fi
          done
          
          # List the output directory to confirm all APKs were built
          echo "Contents of current directory after all builds:"
          ls -la *.apk

      # Step 9: Upload the built APK files as artifacts
      - name: Upload Android artifacts
        # Upload even if the build step failed, to help with debugging
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          # Path to the built APK files generated by fyne package
          # Paths are now relative to the $GITHUB_WORKSPACE after checkout
          path: |
            ${{ github.workspace }}/workspace/crocgui/crocgui-*.apk
          retention-days: 7 # Keep artifacts for 7 days
          if-no-files-found: error # Fail if no .apk files are found

  # Job to create a GitHub Release and upload artifacts
  create-release:
    #if: false
    # This job waits for all build jobs to finish
    needs: [build-windows, build-linux, build-macos-amd64, build-macos-arm64, build-android]
    runs-on: ubuntu-latest
    steps:
      # Step 0: Checkout the repository to access FyneApp.toml
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo-checkout # Checkout into a subdirectory to avoid conflicts if needed

      # Step 1: Determine the release version from input or FyneApp.toml (from checkout)
      - name: Determine Release Version
        id: get_version
        run: |
          # Get the version from the workflow input
          INPUT_VERSION="${{ github.event.inputs.release_version }}"
          
          # If input version is empty, try to read it from the checked-out FyneApp.toml
          if [ -z "$INPUT_VERSION" ]; then
              echo "Input version is empty, attempting to auto-detect from checked-out FyneApp.toml"
              # FyneApp.toml is now in the repo-checkout directory after checkout
              FYNEAPP_TOML_PATH="$GITHUB_WORKSPACE/repo-checkout/FyneApp.toml"
              if [ -f "$FYNEAPP_TOML_PATH" ]; then
                  # Use grep and sed to extract the Version line
                  # This regex looks for Version = "..." and captures the version string
                  # It assumes the format is exactly Version = "version_string"
                  AUTO_VERSION=$(grep -E '^\s*Version\s*=' "$FYNEAPP_TOML_PATH" | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
                  if [ -n "$AUTO_VERSION" ]; then
                      echo "Auto-detected version: $AUTO_VERSION"
                      RELEASE_VERSION="$AUTO_VERSION"
                  else
                      echo "ERROR: Could not extract version from FyneApp.toml (format might be incorrect)."
                      echo "Contents of checked-out FyneApp.toml:"
                      cat "$FYNEAPP_TOML_PATH"
                      exit 1
                  fi
              else
                  echo "ERROR: FyneApp.toml not found at $FYNEAPP_TOML_PATH"
                  ls -la "$GITHUB_WORKSPACE/repo-checkout/"
                  exit 1
              fi
          else
              echo "Using provided input version: $INPUT_VERSION"
              RELEASE_VERSION="$INPUT_VERSION"
          fi
          
          # Set the determined version as an output for later use
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Determined release version for this run: $RELEASE_VERSION"

      # Step 2: Download all artifacts from previous jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Step 3: Prepare the release assets (optional: add build info)
      - name: Prepare release assets
        run: |
          echo "Preparing release assets..."
          mkdir -p release-assets
          for artifact_dir in artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              echo "Copying contents from $artifact_dir to release-assets/"
              cp -r "$artifact_dir"* release-assets/
            fi
          done
          
          # Copy the FyneApp.toml from the checked-out repository to release assets
          cp -f "$GITHUB_WORKSPACE/repo-checkout/FyneApp.toml" release-assets/
          
          # Create a build information file
          echo "Build Information" > release-assets/BUILD_INFO.txt
          echo "=================" >> release-assets/BUILD_INFO.txt
          echo "Project: crocgui (from FyneApp.toml)" >> release-assets/BUILD_INFO.txt
          # Use the version determined in the previous step
          echo "Version: ${{ steps.get_version.outputs.release_version || 'manual_run' }}" >> release-assets/BUILD_INFO.txt
          echo "Build Type: ${{ github.event.inputs.build_type || 'manual' }}" >> release-assets/BUILD_INFO.txt
          # Use bash command substitution to execute 'date -u' and capture its output
          BUILD_DATE=$(date -u)
          echo "Build Date: $BUILD_DATE" >> release-assets/BUILD_INFO.txt
          echo "GitHub Run: https://github.com/  $GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> release-assets/BUILD_INFO.txt
          echo "" >> release-assets/BUILD_INFO.txt
          # List the generated files
          echo "Generated files:" >> release-assets/BUILD_INFO.txt
          echo "----------------" >> release-assets/BUILD_INFO.txt
          ls -la release-assets/ >> release-assets/BUILD_INFO.txt
          # Print the file content for verification
          cat release-assets/BUILD_INFO.txt
          # Export the BUILD_DATE to the environment so it's available in the next step
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      # Step 4: Create the GitHub Release and upload assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # Use the latest version of the release action
        with:
          # Use the input version for the release (or the one determined from FyneApp.toml)
          tag_name: ${{ steps.get_version.outputs.release_version && format('v{0}', steps.get_version.outputs.release_version) }}
          # Name the release
          name: Release ${{ steps.get_version.outputs.release_version && format('v{0}', steps.get_version.outputs.release_version) }}
          draft: false # Make it a public release
          prerelease: ${{ github.event.inputs.build_type == 'snapshot' }} # Mark as pre-release if type is 'snapshot'
          # Upload all files from the prepared release-assets directory (now includes .dmg files, .tar.xz, .exe, .apk)
          files: release-assets/*
          # Body text for the release description
          body: |
            ## crocgui ${{ steps.get_version.outputs.release_version && format('v{0}', steps.get_version.outputs.release_version) }}
            
            Release built via GitHub Actions for multiple platforms.
            App Version read from `FyneApp.toml`.
            
            ### Included Platforms:
            - Windows (Intel - x86_64)
            - Linux (Intel - x86_64)
            - macOS (Intel/Apple Silicon - x86_64/ARM64)
            - Android (x86_64, ARM64, x86, ARM)
            
            ### Included Files:
            - FyneApp.toml (contains version information used for this release)
            
            ### Notes:
            - Windows: Executable file (`crocgui.exe`) is provided.
