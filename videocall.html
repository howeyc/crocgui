<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .videos {
            flex: 1;
            display: flex;
            position: relative;
            padding: 8px;
            gap: 8px;
            min-height: 0;
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transition: transform 0.2s ease;
        }
        .video-container video.fit-1to1 {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: none;
            transform: none;
        }
        .video-container video.fit-half {
            max-width: none;
            max-height: none;
            object-fit: contain;
        }
        .video-container video.fit-2x {
            transform: scale(2);
        }
        /* Обёртка: метка разрешения + панель кнопок */
        .controls-area {
            position: absolute;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 15;
            transition: right 0.3s ease, left 0.3s ease;
        }
        .controls-area.pos-right { right: 2px; left: auto; }
        .controls-area.pos-left { left: 2px; right: auto; }
        /* Панель кнопок — 3 ряда, скрыта по умолчанию */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .controls-row {
            display: flex;
            gap: 4px;
            align-items: center;
            width: 100%;
        }
        /* ====== ГЛАВНОЕ ПРАВИЛО: все кнопки в ряду занимают одинаковую ширину ====== */
        .controls-row .ctrl-btn {
            flex: 1;
            min-width: 0;
            width: auto !important;  /* переопределяем фиксированную ширину */
        }
        .pip-container {
            position: absolute;
            width: 240px;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: visible;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 20;
            min-width: 120px;
            transition: top 0.3s ease, left 0.3s ease, right 0.3s ease, width 0.3s ease, height 0.3s ease;
        }
        .pip-container.pip-tl { top: 18px; left: 2px; bottom: auto; right: auto; }
        .pip-container.pip-tr { top: 18px; right: 2px; bottom: auto; left: auto; }
        .pip-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        #remoteResLabel {
            position: absolute;
            top: 1px;
            right: 2px;
            z-index: 16;
        }
        #remoteResLabel.pos-left {
            right: auto;
            left: 2px;
        }
        #pipResLabel {
            position: absolute;
            top: 1px;
            left: 2px;
            z-index: 16;
        }
        #pipResLabel.pos-right {
            left: auto;
            right: 2px;
        }
        #latencyLabel {
            position: absolute;
            top: 1px;
            left: 0;
            right: 0;
            width: fit-content;
            margin: 0 auto;
            z-index: 16;
            pointer-events: auto;
            cursor: pointer;
        }
        /* Показ кнопок через классы (десктоп + мобильные) */
        body.show-main-controls .controls-panel { opacity: 1; }
        .res-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.80em;
            font-family: monospace;
            pointer-events: none;
            white-space: nowrap;
            background: rgba(100,100,100,0.8);
            border-radius: 8px;
            padding: 1px 6px;
        }
        /* Скрытие курсора на десктопе */
        body.hide-cursor, body.hide-cursor * { cursor: none !important; }
        /* Кнопка записи собеседника (в первом ряду controls-panel) */
        .ctrl-btn.peer-rec {
            background: #555;
        }
        .ctrl-btn.peer-rec:hover { background: #666; }
        .ctrl-btn.peer-rec.pending { background: #4ecca3; }
        .ctrl-btn.peer-rec.recording { background: #4ecca3; }
        .ctrl-btn {
            height: 36px;
            width: 36px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 1.0em;
            font-family: monospace;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
            background: #4ecca3;
            overflow: hidden;
        }
        .ctrl-btn.emoji { font-size: 1.2em; }
        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.off { background: #555; }
        .ctrl-btn.screen-share {
            position: absolute;
            top: 50%;
            right: 2px;
            transform: translateY(-50%);
            z-index: 25;
            background: #555;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .ctrl-btn.screen-share:hover { background: #666; }
        .ctrl-btn.screen-share.active { background: #4ecca3; }
        body.show-pip-controls .ctrl-btn.screen-share { opacity: 1; }
        .ctrl-btn.rec {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 25;
            background: #555;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .ctrl-btn.rec:hover { background: #666; }
        .ctrl-btn.rec.pending { background: #4ecca3; }
        .ctrl-btn.rec.recording { background: #4ecca3; }
        body.show-pip-controls .ctrl-btn.rec { opacity: 1; }
        .ctrl-btn.screen { padding: 0 6px; }
        .ctrl-btn.speaker { padding: 0 4px; }
        .ctrl-btn.mic {
            position: absolute;
            bottom: 2px;
            left: 2px;
            z-index: 25;
            background: #4ecca3;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .ctrl-btn.mic.off { background: #555; }
        body.show-pip-controls .ctrl-btn.mic { opacity: 1; }
        .ctrl-btn.aspect169 {
            position: absolute;
            top: 2px;
            right: 2px;
            left: auto;
            transform: none;
            z-index: 25;
            background: #555;
            opacity: 0;
            transition: opacity 0.3s;
            width: auto;
            padding: 0 4px;
            white-space: nowrap;
            font-size: 0.75em;
        }
        .ctrl-btn.aspect169.active { background: #4ecca3; }
        body.show-pip-controls .ctrl-btn.aspect169 { opacity: 1; }
        .ctrl-btn.screen-audio {
            position: absolute;
            top: 50%;
            left: 2px;
            transform: translateY(-50%);
            z-index: 25;
            background: #4ecca3;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .ctrl-btn.screen-audio.off { background: #555; }
        body.show-pip-controls .ctrl-btn.screen-audio { opacity: 1; }
        .ctrl-btn.cam {
            position: absolute;
            bottom: 2px;
            right: 2px;
            z-index: 25;
            background: #4ecca3;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .ctrl-btn.cam.off { background: #555; }
        body.show-pip-controls .ctrl-btn.cam { opacity: 1; }
        .ctrl-btn.hangup { background: #555; }
        .ctrl-btn.hangup:hover { background: #666; }
        .ctrl-btn.fullscreen { background: #4ecca3; }
        .ctrl-btn.fullscreen.off { background: #555; }
        .ctrl-btn.fit {
            width: auto;
            padding: 0 4px;
            white-space: nowrap;
        }
        .ctrl-btn.fit.active { background: #4ecca3; }
        .ctrl-btn.fit:not(.active) { background: #555; }
        .ctrl-btn.fit.mirrored { transform: scaleX(-1); }
        .ctrl-btn.fit.mirrored:hover { transform: scaleX(-1) scale(1.05); }
        .ctrl-btn.fit.mirrored:active { transform: scaleX(-1) scale(0.95); }
        .ctrl-btn.codec {
            width: auto;
            padding: 0 6px;
            white-space: nowrap;
        }
        .ctrl-btn.mpx { background: #555; }
        .ctrl-btn.mpx.active { background: #4ecca3; }
        .error-banner {
            background: #e94560;
            color: white;
            padding: 12px;
            text-align: center;
            display: none;
        }
        .error-banner.show { display: block; }
        /* Отладочный ряд */
        .debug-row { display: none; }
        body.show-debug .debug-row { display: flex; }
        /* Вспышка при скриншоте */
        .screenshot-flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.15s ease-out;
        }
        .screenshot-flash.active {
            opacity: 0.6;
            transition: none;
        }
        .debug-row #bustDownBtn,
        .debug-row #bustUpBtn,
        .debug-row #slomoDownBtn,
        .debug-row #slomoUpBtn { background: #555; }
    </style>
</head>
<body>
    <div class="error-banner" id="errorBanner"></div>
    <div class="videos">
        <div class="video-container main-video">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="screenshot-flash" id="screenshotFlash"></div>
            <div class="res-label" id="latencyLabel"></div>
            <div class="res-label" id="remoteResLabel"></div>
            <div class="res-label" id="pipResLabel"></div>
            <!-- Панель кнопок -->
            <div class="controls-area pos-right" id="controlsArea">
                <div class="controls-panel" id="controlsPanel">
                <!-- Ряд 1: 🔴 /2 1 ×2 ╒i╤ ☐ ❌ -->
                <div class="controls-row">
                    <button type="button" class="ctrl-btn peer-rec emoji" id="peerRecBtn" title="Record Peer">⏺</button>
                    <button type="button" class="ctrl-btn fit" id="fitHalfBtn" title="Half Size">/2</button>
                    <button type="button" class="ctrl-btn fit" id="fit1to1Btn" title="1:1">1</button>
                    <button type="button" class="ctrl-btn fit" id="fit2xBtn" title="Double Size">×2</button>
                    <button type="button" class="ctrl-btn fit active" id="fitContainBtn" title="Fit Tab">Fit</button>
                    <button type="button" class="ctrl-btn fullscreen off emoji" id="fullscreenBtn" title="Fullscreen">☐</button>
                    <button type="button" class="ctrl-btn hangup emoji" id="hangupBtn" title="Hangup">❌</button>
                </div>
                <!-- Ряд 2: 💻 VP8 H264 + мегапиксельный множитель для запроса пиру -->
                <div class="controls-row">
                    <button type="button" class="ctrl-btn screen emoji" id="remoteScreenBtn" title="Remote Video">💻</button>
                    <button type="button" class="ctrl-btn codec" id="vp8Btn" title="VP8">VP8</button>
                    <button type="button" class="ctrl-btn codec" id="h264Btn" title="H.264">AVC</button>
                    <button type="button" class="ctrl-btn codec mpx" id="mpx06Btn" title="0.6 megapixels">.6</button>
                    <button type="button" class="ctrl-btn codec mpx" id="mpx04Btn" title="0.4 megapixels">.4</button>
                    <button type="button" class="ctrl-btn codec mpx active" id="mpx02Btn" title="0.2 megapixels">.2</button>
                    <button type="button" class="ctrl-btn codec mpx" id="mpx006Btn" title="0.06 megapixels">.06</button>
                </div>
                <!-- Ряд 3: 🔈 Opus AAC EC NS AGC -->
                <div class="controls-row">
                    <button type="button" class="ctrl-btn speaker emoji" id="remoteMuteBtn" title="Remote Audio">🔈</button>
                    <button type="button" class="ctrl-btn codec" id="opusBtn" title="Opus">Opus</button>
                    <button type="button" class="ctrl-btn codec" id="aacBtn" title="AAC">AAC</button>
                    <button type="button" class="ctrl-btn codec" id="ecBtn" title="Echo Cancellation">EC</button>
                    <button type="button" class="ctrl-btn codec" id="nsBtn" title="Noise Suppression">NS</button>
                    <button type="button" class="ctrl-btn codec" id="agcBtn" title="Auto Gain Control">AGC</button>
                </div>
                <!-- Ряд 4: Отладка SS A[ BUST SLOMO -->
                <div class="controls-row debug-row" id="debugRow">
                    <button type="button" class="ctrl-btn codec emoji" id="ssBtn" title="Stall Seek">▶️</button>
                    <button type="button" class="ctrl-btn codec" id="adaptiveBtn" title="Adaptive BUST">[A]</button>
                    <button type="button" class="ctrl-btn codec emoji" id="bustDownBtn" title="BUST -0.1">🔽</button>
                    <button type="button" class="ctrl-btn codec emoji" id="bustUpBtn" title="BUST +0.1">🔼</button>
                    <span class="res-label" id="debugValLabel">[.0~.0]</span>
                    <button type="button" class="ctrl-btn codec emoji" id="slomoDownBtn" title="SLOMO -0.1">🔽</button>
                    <button type="button" class="ctrl-btn codec emoji" id="slomoUpBtn" title="SLOMO +0.1">🔼</button>
                </div>
                </div>
            </div>
            <div class="pip-container pip-tl" id="pipContainer">
                <button type="button" class="ctrl-btn rec emoji" id="recBtn" title="Record">⏺</button>
                <button type="button" class="ctrl-btn aspect169" id="aspect169Btn" title="16:9">16:9</button>
                <button type="button" class="ctrl-btn screen-share emoji" id="screenBtn" title="Screen Share">📤</button>
                <button type="button" class="ctrl-btn screen-audio emoji" id="screenAudioBtn" title="Screen Audio">🎙️</button>
                <video id="localVideo" autoplay muted playsinline></video>
                <button type="button" class="ctrl-btn mic emoji" id="micBtn" title="Mic">🎤</button>
                <button type="button" class="ctrl-btn cam emoji" id="camBtn" title="Cam">📷</button>
            </div>
        </div>
    </div>

    <script>
        // ============= Конфигурация =============
        var CHUNK_INTERVAL_MS = 100;
        var TARGET_FPS = 10;
        function getKeyFrameInterval() {
            if (S.mpx >= 0.7 && cameraNativeMaxFPS > 19) {
                return 2;
            }
            return 1;
        }

        // ============= Элементы UI =============
        var localVideo = document.getElementById('localVideo');
        var remoteVideo = document.getElementById('remoteVideo');
        var latencyLabel = document.getElementById('latencyLabel');
        var currentBehind = 0;
        var errorBanner = document.getElementById('errorBanner');
        var micBtn = document.getElementById('micBtn');
        var camBtn = document.getElementById('camBtn');
        var screenBtn = document.getElementById('screenBtn');
        var aspect169Btn = document.getElementById('aspect169Btn');
        var screenAudioBtn = document.getElementById('screenAudioBtn');
        var isScreenSharing = false;
        var screenAudioOnly = false;  // true = шарим только аудио экрана (Cam OFF)
        var screenToggling = false;
        var displayVideoTrackRef = null; // ссылка на видео-трек дисплея (для stop при audio-only)
        var displayAudioTrack = null;
        var audioCtx = null;           // AudioContext для стерео-микширования Mic+Screen
        var mergedAudioTrack = null;   // результирующий стерео-трек (Mic→L, Display→R)
        var savedMicTrack = null;      // сохранённый mic track для восстановления
        var audioBeforeScreenShare = false;
        var videoBeforeScreenShare = false;
        // Скрываем кнопки шаринга экрана если API недоступно
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            screenBtn.style.display = 'none';
            screenAudioBtn.style.display = 'none';
        }
        var recBtn = document.getElementById('recBtn');
        var isRecording = false;
        var recMimeType = '';          // MIME-тип текущего рекордера (для расширения файла)
        var recStartPending = false;   // флаг: рекордер перезапускается для начала записи (нужен init-сегмент)
        // Запись видео собеседника (remote)
        var peerRecBtn = document.getElementById('peerRecBtn');
        var isPeerRecording = false;
        var hangupBtn = document.getElementById('hangupBtn');
        var remoteMuteBtn = document.getElementById('remoteMuteBtn');
        var remoteScreenBtn = document.getElementById('remoteScreenBtn');
        var fullscreenBtn = document.getElementById('fullscreenBtn');
        var fitHalfBtn = document.getElementById('fitHalfBtn');
        var fit1to1Btn = document.getElementById('fit1to1Btn');
        var fit2xBtn = document.getElementById('fit2xBtn');
        var fitContainBtn = document.getElementById('fitContainBtn');
        var vp8Btn = document.getElementById('vp8Btn');
        var h264Btn = document.getElementById('h264Btn');
        var opusBtn = document.getElementById('opusBtn');
        var aacBtn = document.getElementById('aacBtn');
        var mpx06Btn = document.getElementById('mpx06Btn');
        var mpx04Btn = document.getElementById('mpx04Btn');
        var mpx02Btn = document.getElementById('mpx02Btn');
        var mpx006Btn = document.getElementById('mpx006Btn');
        var ecBtn = document.getElementById('ecBtn');
        var nsBtn = document.getElementById('nsBtn');
        var agcBtn = document.getElementById('agcBtn');

        function getBrowserTag() {
            var ua = navigator.userAgent;
            var m = ua.match(/Chrome\/(\d+)/);
            if (m) return 'Chrome_' + m[1];
            m = ua.match(/Firefox\/(\d+)/);
            if (m) return 'Firefox_' + m[1];
            m = ua.match(/Safari\/(\d+)/);
            if (m) return 'Safari_' + m[1];
            return 'Unknown';
        }
        var _chatUserId = new URLSearchParams(window.location.search).get('chatUserId') || localStorage.getItem('chatUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatUserId', _chatUserId);
        var _diagUserId = _chatUserId; // перезаписывается в init() на peer-based ID

        // ============= Определяем десктоп =============
        var isDesktop = window.matchMedia('(hover: hover)').matches;

        // ============= Единый объект настроек =============
        var S = {
            audio: true,          // мой микрофон
            video: true,          // моя камера
            wantAudio: true,      // хочу аудио от пира
            wantVideo: true,      // хочу видео от пира
            vp8: true,
            h264: false,
            vpxProfile: 'vp8',    // 'vp8' | 'vp9' — профиль VPx
            avcProfile: 'avc',    // 'avc' | 'avc-main' | 'avc-high' | 'hevc' — профиль AVC/HEVC
            opus: true,
            aac: false,
            ec: true,
            ns: true,
            agc: true,
            mpx: 0.2,
            isRecording: false,
            isPeerRecording: false,
            isScreenSharing: false,
            pipCorner: 0,        // только локально, не отправляется пиру
            facingMode: 'user',  // 'user' = фронтальная, 'environment' = задняя
            aspect169: false,    // true = приоритет 16:9, false = приоритет 4:3
            screenAudio: false   // true = захватывать аудио при шаринге экрана
        };
        var videoDevices = [];       // список videoinput устройств (для десктопа)
        var currentDeviceIndex = -1; // индекс текущей камеры в videoDevices
        var audioDevices = [];       // список audioinput устройств
        var currentAudioDeviceIndex = -1; // индекс текущего микрофона в audioDevices
        var cameraNativeMaxW = 0;    // нативный максимум ширины камеры (из getCameraCapabilities)
        var cameraNativeMaxH = 0;    // нативный максимум высоты камеры (из getCameraCapabilities)
        var cameraNativeMaxFPS = 0;  // нативный максимум FPS камеры (из getCameraCapabilities)
        var FALLBACK_ASPECT_W = 4;  // fallback-аспект если неизвестен нативный
        var FALLBACK_ASPECT_H = 3;
        // Предопределённые разрешения для MPX кнопок (приоритет 4:3, затем 16:9)
        var MPX_GROUPS = {
            0.06: {
                '4:3':  [{w:160,h:120}, {w:176,h:144}],
                '16:9': [{w:320,h:176}]
            },
            0.2: {
                '4:3':  [{w:320,h:240}, {w:352,h:288}],
                '16:9': [{w:432,h:240}, {w:544,h:288}]
            },
            0.4: {
                '4:3':  [{w:640,h:480}, {w:720,h:480}],
                '16:9': [{w:640,h:360}, {w:752,h:416}]
            },
            0.6: {
                '4:3':  [{w:800,h:600}],
                '16:9': [{w:800,h:448}, {w:864,h:480}, {w:960,h:544}]
            }
        };

        // Вспомогательная функция: порядок аспектов в зависимости от S.aspect169
        function getAspectPriority() {
            return S.aspect169 ? ['16:9', '4:3'] : ['4:3', '16:9'];
        }

        // Первое разрешение из MPX_GROUPS[mpx] по приоритету аспекта, или null
        function getFirstResolution(mpx) {
            var group = MPX_GROUPS[mpx];
            if (!group) return null;
            var aspects = getAspectPriority();
            for (var ai = 0; ai < aspects.length; ai++) {
                var rList = group[aspects[ai]];
                if (rList && rList.length > 0) {
                    return { w: rList[0].w, h: rList[0].h };
                }
            }
            return null;
        }

        function loadSettings() {
            try {
                var s = JSON.parse(localStorage.getItem('vc2') || '{}');
                if (s.audio !== undefined) S.audio = s.audio;
                if (s.video !== undefined) S.video = s.video;
                if (s.wantAudio !== undefined) S.wantAudio = s.wantAudio;
                if (s.wantVideo !== undefined) S.wantVideo = s.wantVideo;
                if (s.vp8 !== undefined) S.vp8 = s.vp8;
                if (s.h264 !== undefined) S.h264 = s.h264;
                if (s.vpxProfile !== undefined) S.vpxProfile = s.vpxProfile;
                if (s.avcProfile !== undefined) S.avcProfile = s.avcProfile;
                if (s.opus !== undefined) S.opus = s.opus;
                if (s.aac !== undefined) S.aac = s.aac;
                if (s.ec !== undefined) S.ec = s.ec;
                if (s.ns !== undefined) S.ns = s.ns;
                if (s.agc !== undefined) S.agc = s.agc;
                if (s.mpx !== undefined) {
                    // Миграция старых значений mpx
                    if (Math.abs(s.mpx - 0.05) < 0.01) s.mpx = 0.06;
                    else if (Math.abs(s.mpx - 0.1) < 0.01) s.mpx = 0.2;
                    else if (Math.abs(s.mpx - 0.5) < 0.01) s.mpx = 0.6;
                    // Сброс нестандартных значений (напр. 0.3072 от старого toggle-to-max)
                    var validMpx = [0.06, 0.2, 0.4, 0.6, 0.7];
                    var found = false;

                var dx, dy, dw, dh;

                ctx.drawImage(remoteVideo, dx, dy, dw, dh);

                var isPortraitFrame = vw < vh;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, fw, fh);
                var va = vw / vh, fa = fw / fh;
                var dx, dy, dw, dh;
                if (va > fa) { dw = fw; dh = Math.round(fw / va); dx = 0; dy = Math.round((fh - dh) / 2); }
                else { dh = fh; dw = Math.round(fh * va); dx = Math.round((fw - dw) / 2); dy = 0; }
                if (remoteMirrored) { ctx.translate(fw, 0); ctx.scale(-1, 1); }
                ctx.drawImage(remoteVideo, dx, dy, dw, dh);
            } else if (isFs && screenshotFrameMode === 3) {
                // 16:9 или 9:16 рамка
                var isPortraitFrame = vw < vh;
                var fw, fh;
                if (isPortraitFrame) {
                    // 9:16 портрет: canvas = round(vh * 9/16) × vh
                    fh = vh;
                    fw = Math.round(vh * 9 / 16);
                } else {
                    // 16:9 ландшафт: canvas = round(vh * 16/9) × vh
                    fh = vh;
                    fw = Math.round(vh * 16 / 9);
                }
                if (fw % 2 !== 0) fw++;
                if (fh % 2 !== 0) fh++;
                canvas.width = fw;
                canvas.height = fh;
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, fw, fh);
                var va = vw / vh, fa = fw / fh;
                var dx, dy, dw, dh;
                if (va > fa) { dw = fw; dh = Math.round(fw / va); dx = 0; dy = Math.round((fh - dh) / 2); }
                else { dh = fh; dw = Math.round(fh * va); dx = Math.round((fw - dw) / 2); dy = 0; }
                if (remoteMirrored) { ctx.translate(fw, 0); ctx.scale(-1, 1); }
                ctx.drawImage(remoteVideo, dx, dy, dw, dh);
            } else {
                // Raw — нативные пиксели
                canvas.width = vw;
                canvas.height = vh;
                if (remoteMirrored) { ctx.translate(vw, 0); ctx.scale(-1, 1); }
                ctx.drawImage(remoteVideo, 0, 0, vw, vh);
            }
            canvas.toBlob(function(blob) {
                if (!blob) { diagLog('SCREENSHOT toBlob failed'); return; }
                var d = new Date();
                var ms = String(d.getMilliseconds()).padStart(3, '0');
                var fileName = d.getFullYear().toString() +
                    String(d.getMonth()+1).padStart(2,'0') +

                    .then(function(resp) {
                        if (resp.ok) {
                            diagLog('SCREENSHOT saved to WebDAV: ' + fileName + ' (' + canvas.width + 'x' + canvas.height + ')');
                            try { ws.send(JSON.stringify({ cmd: 'chatMessage', text: '📸 /' + fileName, sender: _chatUserId })); } catch(e) {}
                        } else {
                            diagLog('SCREENSHOT PUT failed: ' + resp.status + ' ' + resp.statusText);
                        }
                    })
                    .catch(function(err) {
                        diagLog('SCREENSHOT PUT error: ' + err.message);
                    });
            }, 'image/png');
            // Вспышка
            var flash = document.getElementById('screenshotFlash');

        // ============= Стерео-микширование Mic + Screen Audio =============
        // setupScreenAudio(displayStream) — начальная настройка при старте шаринга
        function setupScreenAudio(displayStream) {
            var displayAudioTracks = displayStream.getAudioTracks();
            if (displayAudioTracks.length === 0) {
                diagLog('SCREEN AUDIO: no display audio tracks available');
                return;
            }
            displayAudioTrack = displayAudioTracks[0];
            setupScreenAudioFromTracks();
        }
        // setupScreenAudioFromTracks() — пересоздание merger из существующего displayAudioTrack
        function setupScreenAudioFromTracks() {
            if (!displayAudioTrack || displayAudioTrack.readyState !== 'live') {
                diagLog('SCREEN AUDIO: no live display audio track');
                return;
            }
            var micTracks = localStream.getAudioTracks();
            if (micTracks.length > 0 && S.audio) {
                // Оба источника — стерео-микширование через Web Audio API
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    var micSource = audioCtx.createMediaStreamSource(new MediaStream([micTracks[0]]));
                    var displaySource = audioCtx.createMediaStreamSource(new MediaStream([displayAudioTrack]));
                    var merger = audioCtx.createChannelMerger(2);
                    var dest = audioCtx.createMediaStreamDestination();
                    micSource.connect(merger, 0, 0);    // Mic → channel 0 (left)
                    displaySource.connect(merger, 0, 1); // Display → channel 1 (right)
                    merger.connect(dest);
                    savedMicTrack = micTracks[0];
                    localStream.removeTrack(savedMicTrack);
                    mergedAudioTrack = dest.stream.getAudioTracks()[0];
                    localStream.addTrack(mergedAudioTrack);
                    diagLog('SCREEN AUDIO: stereo merge created (Mic→L, Display→R)');
                } catch(e) {
                    diagLog('SCREEN AUDIO: stereo merge failed: ' + e.message);
                    localStream.addTrack(displayAudioTrack);
                    audioCtx = null;
                    mergedAudioTrack = null;
                    savedMicTrack = null;
                }
            } else {
                // Только display audio — через AudioContext для гарантии стерео
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    var displaySource = audioCtx.createMediaStreamSource(new MediaStream([displayAudioTrack]));
                    var dest = audioCtx.createMediaStreamDestination();
                    displaySource.connect(dest);
                    mergedAudioTrack = dest.stream.getAudioTracks()[0];
                    localStream.addTrack(mergedAudioTrack);
                    diagLog('SCREEN AUDIO: display audio stereo (no mic)');
                } catch(e) {
                    diagLog('SCREEN AUDIO: stereo fallback failed: ' + e.message);
                    localStream.addTrack(displayAudioTrack);
                    audioCtx = null;
                    mergedAudioTrack = null;
                }
            }
        }
        // teardownScreenAudio(soft) — разбор аудио
        // soft=true: keep displayAudioTrack alive для пересоздания (при toggle Mic)
        // soft=false: full teardown (screen share ending)
        function teardownScreenAudio(soft) {
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
                audioCtx = null;
            }
            if (mergedAudioTrack) {
                try { localStream.removeTrack(mergedAudioTrack); } catch(e) {}
                mergedAudioTrack = null;
            }
            if (displayAudioTrack) {
                try { localStream.removeTrack(displayAudioTrack); } catch(e) {}
                if (!soft) {
                    try { displayAudioTrack.stop(); } catch(e) {}
                    displayAudioTrack = null;
                }
            }
            if (savedMicTrack) {
                if (savedMicTrack.readyState === 'live') {
                    localStream.addTrack(savedMicTrack);
                    diagLog('SCREEN AUDIO: mic track restored');
                }
                savedMicTrack = null;
            }
            if (!soft) diagLog('SCREEN AUDIO: teardown complete');
            else diagLog('SCREEN AUDIO: soft teardown (display audio kept)');
        }
