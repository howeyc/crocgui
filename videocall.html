<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .videos {
            flex: 1;
            display: flex;
            position: relative;
            padding: 8px;
            gap: 8px;
            min-height: 0;
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transition: transform 0.2s ease;
        }
        .video-container video.fit-1to1 {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: none;
            transform: none;
        }
        .video-container video.fit-half {
            max-width: none;
            max-height: none;
            object-fit: contain;
        }
        .video-container video.fit-2x {
            transform: scale(2);
        }
        /* Панель управления — 3 ряда, скрыта по умолчанию */
        .controls-panel {
            position: absolute;
            top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease, right 0.3s ease, left 0.3s ease;
        }
        .controls-panel.pos-right { right: 8px; left: auto; }
        .controls-panel.pos-left { left: 8px; right: auto; }
        .controls-row {
            display: flex;
            gap: 4px;
            align-items: center;
            width: 100%;
        }
        /* ====== ГЛАВНОЕ ПРАВИЛО: все кнопки в ряду занимают одинаковую ширину ====== */
        .controls-row .ctrl-btn {
            flex: 1;
            min-width: 0;
            width: auto !important;  /* переопределяем фиксированную ширину */
        }
        .pip-container {
            position: absolute;
            width: 240px;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: visible;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 20;
            transition: top 0.3s ease, left 0.3s ease, right 0.3s ease;
        }
        .pip-container.pip-tl { top: 16px; left: 12px; bottom: auto; right: auto; }
        .pip-container.pip-tr { top: 16px; right: 12px; bottom: auto; left: auto; }
        .pip-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .pip-container .pip-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            overflow: visible;
            border-radius: 0 0 8px 8px;
        }
        /* Go Sender кнопка — верхний правый угол PiP */
        .pip-container .go-sender-wrap {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 26;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body.show-pip-controls .pip-container .go-sender-wrap { opacity: 1; }
        .pip-container .go-sender-wrap .ctrl-btn.go-sender {
            background: rgba(100, 100, 100, 0.85);
        }
        .pip-container .go-sender-wrap .ctrl-btn.go-sender:hover {
            background: rgba(130, 130, 130, 0.95);
        }
        .pip-container .go-sender-wrap .ctrl-btn.go-sender.off {
            background: rgba(100, 100, 100, 0.85);
        }
        .pip-container .res-label {
            top: auto;
            left: 50%;
            transform: translateX(-50%);
        }
        #pipResLabel {
            top: 1px;
            bottom: auto;
        }
        #remoteResLabel {
            bottom: calc(100% + 2px);
        }
        .waiting-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .waiting-overlay.hidden { display: none; }
        .waiting-spinner {
            width: 48px; height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-text { color: #aaa; font-size: 1em; }
        .pip-controls {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            padding: 4px;
            background: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* Показ кнопок через классы (десктоп + мобильные) */
        body.show-main-controls .controls-panel { opacity: 1; }
        body.show-pip-controls .pip-controls { opacity: 1; }
        .res-label {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 0.65em;
            font-family: monospace;
            pointer-events: none;
            z-index: 16;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            background: rgba(100,100,100,0.8);
            border-radius: 8px;
            padding: 1px 6px;
        }
        body.show-main-controls .video-container .res-label { opacity: 1; }
        body.show-pip-controls .pip-container .res-label { opacity: 1; }
        /* Скрытие курсора на десктопе */
        body.hide-cursor, body.hide-cursor * { cursor: none !important; }
        /* Кнопки перемещения PiP (в первом ряду controls-panel) */
        .ctrl-btn.pip-move {
            background: rgba(100, 100, 100, 0.8);
            display: none;
        }
        .ctrl-btn.pip-move:hover { background: rgba(130, 130, 130, 0.9); }
        .ctrl-btn.pip-move.visible { display: flex; }
        .ctrl-btn {
            height: 28px;
            width: 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.7em;
            font-family: monospace;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
            background: #4ecca3;
        }
        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.off { background: #e94560; }
        .ctrl-btn.screen { padding: 0 6px; }
        .ctrl-btn.speaker { padding: 0 4px; }
        .ctrl-btn.mic { background: #4ecca3; }
        .ctrl-btn.mic.off { background: #e94560; }
        .ctrl-btn.cam { background: #4ecca3; }
        .ctrl-btn.cam.off { background: #e94560; }
        .ctrl-btn.go-sender { background: #4ecca3; }
        .ctrl-btn.go-sender.off { background: #e94560; }
        .ctrl-btn.hangup { background: #555; }
        .ctrl-btn.hangup:hover { background: #666; }
        .ctrl-btn.fullscreen { background: #4ecca3; }
        .ctrl-btn.fullscreen.off { background: #555; }
        .ctrl-btn.fit {
            width: auto;
            padding: 0 4px;
            white-space: nowrap;
        }
        .ctrl-btn.fit.active { background: #4ecca3; }
        .ctrl-btn.fit:not(.active) { background: #555; }
        .ctrl-btn.codec {
            width: auto;
            padding: 0 6px;
            white-space: nowrap;
        }
        .ctrl-btn.mpx { background: #555; }
        .ctrl-btn.mpx.active { background: #4ecca3; }
        .error-banner {
            background: #e94560;
            color: white;
            padding: 12px;
            text-align: center;
            display: none;
        }
        .error-banner.show { display: block; }
        @media (max-height: 500px) {
            .pip-container { width: 160px; height: 120px; }
            .ctrl-btn { height: 22px; width: 22px; font-size: 0.6em; }
        }
        @media (max-width: 600px) {
            .pip-container { width: 30%; height: auto; aspect-ratio: 4/3; min-width: 80px; }
            .ctrl-btn { height: 36px; width: 36px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="error-banner" id="errorBanner"></div>
    <div class="videos">
        <div class="video-container main-video">
            <video id="remoteVideo" autoplay playsinline></video>
            <!-- Панель из 3 рядов -->
            <div class="controls-panel pos-right" id="controlsPanel">
                <!-- Ряд 1: Fit, ⬚, ❌ -->
                <div class="controls-row">
                    <button class="ctrl-btn pip-move pip-move-left" id="pipMoveLeft" title="Move left">◀</button>
                    <button class="ctrl-btn fit" id="fitHalfBtn" title="Half Size">/2</button>
                    <button class="ctrl-btn fit" id="fit1to1Btn" title="1:1">1</button>
                    <button class="ctrl-btn fit" id="fit2xBtn" title="2x Zoom">×2</button>
                    <button class="ctrl-btn fit active" id="fitContainBtn" title="Fit">💡</button>
                    <button class="ctrl-btn fullscreen off" id="fullscreenBtn" title="Fullscreen">☐</button>
                    <button class="ctrl-btn hangup" id="hangupBtn" title="Hangup">❌</button>
                    <button class="ctrl-btn pip-move pip-move-right" id="pipMoveRight" title="Move right">▶</button>
                </div>
                <!-- Ряд 2: 💻 VP8 H264 + мегапиксельный множитель для запроса пиру -->
                <div class="controls-row">
                    <button class="ctrl-btn screen" id="remoteScreenBtn" title="Remote Video">💻</button>
                    <button class="ctrl-btn codec" id="vp8Btn" title="VP8">VP8</button>
                    <button class="ctrl-btn codec" id="h264Btn" title="H.264">AVC</button>
                    <button class="ctrl-btn codec mpx" id="mpx12Btn" title="0.5 megapixels">.5</button>
                    <button class="ctrl-btn codec mpx" id="mpx15Btn" title="0.2 megapixels">.2</button>
                    <button class="ctrl-btn codec mpx active" id="mpx110Btn" title="0.1 megapixels">.1</button>
                    <button class="ctrl-btn codec mpx" id="mpx120Btn" title="0.05 megapixels">.05</button>
                </div>
                <!-- Ряд 3: 🔈 Opus AAC EC NS AGC -->
                <div class="controls-row">
                    <button class="ctrl-btn speaker" id="remoteMuteBtn" title="Remote Audio">🔈</button>
                    <button class="ctrl-btn codec" id="opusBtn" title="Opus">Opus</button>
                    <button class="ctrl-btn codec" id="aacBtn" title="AAC">AAC</button>
                    <button class="ctrl-btn codec" id="ecBtn" title="Echo Cancellation">EC</button>
                    <button class="ctrl-btn codec" id="nsBtn" title="Noise Suppression">NS</button>
                    <button class="ctrl-btn codec" id="agcBtn" title="Auto Gain Control">AGC</button>
                </div>
            </div>
            <div class="waiting-overlay hidden" id="waitingOverlay">
                <div class="waiting-spinner"></div>
                <div class="waiting-text" id="waitingText">Waiting for peer...</div>
            </div>
            <div class="pip-container pip-tl" id="pipContainer">
                <div class="res-label" id="remoteResLabel"></div>
                <div class="res-label" id="pipResLabel"></div>
                <div class="go-sender-wrap">
                    <button class="ctrl-btn go-sender" id="goSenderBtn" title="Toggle Go/Browser sender" style="display:none">⏸️</button>
                </div>
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="pip-controls" id="pipControls">
                    <button class="ctrl-btn mic" id="micBtn" title="Mic">🎤</button>
                    <button class="ctrl-btn cam" id="camBtn" title="Cam">📷</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============= Конфигурация =============
        var CHUNK_INTERVAL_MS = 100;
        var MAX_BUFFER_SECONDS = 10;
        var WS_RECONNECT_MS = 2000;

        // ============= Элементы UI =============
        var localVideo = document.getElementById('localVideo');
        var remoteVideo = document.getElementById('remoteVideo');
        var waitingOverlay = document.getElementById('waitingOverlay');
        var waitingText = document.getElementById('waitingText');
        var errorBanner = document.getElementById('errorBanner');
        var micBtn = document.getElementById('micBtn');
        var camBtn = document.getElementById('camBtn');
        var hangupBtn = document.getElementById('hangupBtn');
        var remoteMuteBtn = document.getElementById('remoteMuteBtn');
        var remoteScreenBtn = document.getElementById('remoteScreenBtn');
        var fullscreenBtn = document.getElementById('fullscreenBtn');
        var fitHalfBtn = document.getElementById('fitHalfBtn');
        var fit1to1Btn = document.getElementById('fit1to1Btn');
        var fit2xBtn = document.getElementById('fit2xBtn');
        var fitContainBtn = document.getElementById('fitContainBtn');
        var vp8Btn = document.getElementById('vp8Btn');
        var h264Btn = document.getElementById('h264Btn');
        var opusBtn = document.getElementById('opusBtn');
        var aacBtn = document.getElementById('aacBtn');
        var mpx12Btn = document.getElementById('mpx12Btn');
        var mpx15Btn = document.getElementById('mpx15Btn');
        var mpx110Btn = document.getElementById('mpx110Btn');
        var mpx120Btn = document.getElementById('mpx120Btn');
        var ecBtn = document.getElementById('ecBtn');
        var nsBtn = document.getElementById('nsBtn');
        var agcBtn = document.getElementById('agcBtn');
        var goSenderBtn = document.getElementById('goSenderBtn');

        var _chatUserId = localStorage.getItem('chatUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatUserId', _chatUserId);

        // Сохраняем hash в sessionStorage при загрузке видеозвонка
        if (window.location.hash) {
            sessionStorage.setItem('webdav_hash', window.location.hash);
        }

        // ============= Определяем режим Go Sender (десктоп без прокси) =============
        var isDesktop = window.matchMedia('(hover: hover)').matches;
        var goSender = (window.location.hash === '#1') && isDesktop;

        // ============= Единый объект настроек =============
        var S = {
            audio: true,          // мой микрофон
            video: true,          // моя камера
            wantAudio: true,      // хочу аудио от пира
            wantVideo: true,      // хочу видео от пира
            vp8: true,
            h264: false,
            opus: true,
            aac: false,
            ec: true,
            ns: true,
            agc: true,
            mpx: 0.1,
            pipCorner: 0,        // только локально, не отправляется пиру
            goSender: goSender   // Go захватывает медиа вместо браузера
        };

        function loadSettings() {
            try {
                var s = JSON.parse(localStorage.getItem('vc2') || '{}');
                if (s.audio !== undefined) S.audio = s.audio;
                if (s.video !== undefined) S.video = s.video;
                if (s.wantAudio !== undefined) S.wantAudio = s.wantAudio;
                if (s.wantVideo !== undefined) S.wantVideo = s.wantVideo;
                if (s.vp8 !== undefined) S.vp8 = s.vp8;
                if (s.h264 !== undefined) S.h264 = s.h264;
                if (s.opus !== undefined) S.opus = s.opus;
                if (s.aac !== undefined) S.aac = s.aac;
                if (s.ec !== undefined) S.ec = s.ec;
                if (s.ns !== undefined) S.ns = s.ns;
                if (s.agc !== undefined) S.agc = s.agc;
                if (s.mpx !== undefined) S.mpx = s.mpx;
                if (s.pipCorner !== undefined) S.pipCorner = s.pipCorner;
                if (s.goSender !== undefined && goSender) S.goSender = s.goSender;
            } catch(e) {}
        }

        function saveSettings() {
            localStorage.setItem('vc2', JSON.stringify(S));
        }

        function applySettings() {
            // Sender кнопки
            micBtn.classList.toggle('off', !S.audio);
            camBtn.classList.toggle('off', !S.video);
            // Receiver кнопки
            remoteScreenBtn.classList.toggle('off', !S.wantVideo);
            remoteVideo.style.visibility = S.wantVideo ? 'visible' : 'hidden';
            remoteMuteBtn.classList.toggle('off', !S.wantAudio);
            remoteVideo.muted = !S.wantAudio;
            // Кодеки
            vp8Btn.classList.toggle('off', !S.vp8);
            h264Btn.classList.toggle('off', !S.h264);
            opusBtn.classList.toggle('off', !S.opus);
            aacBtn.classList.toggle('off', !S.aac);
            // Аудио фильтры
            ecBtn.classList.toggle('off', !S.ec);
            nsBtn.classList.toggle('off', !S.ns);
            agcBtn.classList.toggle('off', !S.agc);
            // Megapixel radio buttons
            var mpxBtns = [mpx12Btn, mpx15Btn, mpx110Btn, mpx120Btn];
            var mpxValues = [0.5, 0.2, 0.1, 0.05];
            for (var i = 0; i < mpxValues.length; i++) {
                mpxBtns[i].classList.toggle('active', Math.abs(S.mpx - mpxValues[i]) < 0.01);
            }
            // Go sender button
            goSenderBtn.style.display = goSender ? '' : 'none';
            goSenderBtn.classList.toggle('off', !S.goSender);
            goSenderBtn.textContent = S.goSender ? '\u23F8\uFE0F' : '\uD83D\uDD34';
            // Применяем аудио фильтры
            if (localStream) {
                var tracks = localStream.getAudioTracks();
                if (tracks.length > 0) {
                    try { tracks[0].applyConstraints({ advanced: [{ echoCancellation: S.ec, noiseSuppression: S.ns, autoGainControl: S.agc }] }); } catch(e) {}
                }
            }
        }

        function sendSettings() {
            if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
            var vt = localStream ? localStream.getVideoTracks()[0] : null;
            var vs = vt ? vt.getSettings() : {};
            ws.send(JSON.stringify({
                cmd: 'settings',
                audio: S.audio,
                video: S.video,
                wantAudio: S.wantAudio,
                wantVideo: S.wantVideo,
                vp8: S.vp8,
                h264: S.h264,
                opus: S.opus,
                aac: S.aac,
                ec: S.ec,
                ns: S.ns,
                agc: S.agc,
                mpx: S.mpx,
                recordCodecs: detectAllRecordCodecs(),
                playCodecs: detectSupportedCodecs(),
                width: vs.width || 0,
                height: vs.height || 0,
                frameRate: vs.frameRate || getMinFrameRate() || 0,
                goSender: S.goSender
            }));
        }

        loadSettings();

        // ============= Мегапиксельный множитель для запроса пиру =============
        var mpxBtns = [mpx12Btn, mpx15Btn, mpx110Btn, mpx120Btn];
        var mpxValues = [0.5, 0.2, 0.1, 0.05];
        function setMpx(val) {
            S.mpx = val;
            applySettings();
            saveSettings();
            sendSettings();
        }
        mpx12Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(0.5); });
        mpx15Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(0.2); });
        mpx110Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(0.1); });
        mpx120Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(0.05); });

        // Масштабирование разрешения по абсолютным мегапикселям
        function applyMpx(aspectW, aspectH, mpx) {
            var targetPixels = mpx * 1000000;
            var aspectRatio = aspectW / aspectH;
            var h = Math.round(Math.sqrt(targetPixels / aspectRatio));
            var w = Math.round(h * aspectRatio);
            if (w % 2 !== 0) w++;
            if (h % 2 !== 0) h++;
            return { w: w, h: h };
        }

        // ============= Состояние звонка =============
        var params = new URLSearchParams(window.location.search);
        var roomID = params.get('room') || '';
        var isActive = false;
        var localStream = null;
        var mediaRecorder = null;
        var isCreator = false;

        var myPeerID = 'host';
        var remotePeerID = 'guest';
        var lastReceivedIndex = -1;

        var ws = null;
        var wsConnected = false;
        var wsReconnectTimer = null;
        var peerSettings = null; // настройки пира (полученные через WS)
        var peerSettingsResolve = null; // для ожидания первых настроек пира
        var recorderStarted = false;

        var mediaSource = null;
        var sourceBuffer = null;
        var mseQueue = [];
        var mseReady = false;
        var negotiatedCodec = '';
        var recordCodec = '';    // чем мы записываем (MediaRecorder)
        var incomingCodec = '';  // какой кодек будет у входящего потока (MSE)
        var trimScheduled = false;
        var firstAppendDone = false;

        var diagSentChunks = 0;
        var diagSentBytes = 0;
        var diagRecvChunks = 0;
        var diagRecvBytes = 0;
        var diagMSEAppends = 0;
        var diagMSEErrors = 0;
        var diagLastLogTime = 0;
        var MSE_CRITICAL_THRESHOLD = 10;
        var MSE_CRITICAL_WINDOW_MS = 1000;
        var mseErrorTimestamps = [];
        var mseCriticalTriggered = false;
        var mseSetupTimer = null;
        var mseRestarting = false;
        var mseWaitingForInit = false;
        var lastHandledMpx = -1; // debounce: последний обработанный mpx пира

        // Remote video fit modes: 0=fit, 1=1:1, 2=1:2, 3=2:1
        var remoteFitMode = parseInt(localStorage.getItem('vc_fitMode')) || 0;
        var remoteFitModes = ['', 'fit-1to1', 'fit-half', 'fit-2x'];
        var remoteFitLabels = ['Fit', '1:1', '1:2', '2:1'];
        var remoteNativeW = 0;
        var remoteNativeH = 0;

        function updateFitBtnHighlight() {
            fitHalfBtn.classList.toggle('active', remoteFitMode === 2);
            fit1to1Btn.classList.toggle('active', remoteFitMode === 1);
            fit2xBtn.classList.toggle('active', remoteFitMode === 3);
            fitContainBtn.classList.toggle('active', remoteFitMode === 0);
        }

        function getMinFrameRate() {
            if (!localStream) return 0;
            var vt = localStream.getVideoTracks()[0];
            if (!vt || typeof vt.getCapabilities !== 'function') return 0;
            try {
                var caps = vt.getCapabilities();
                if (caps && caps.frameRate && typeof caps.frameRate.min === 'number') {
                    return Math.max(10, Math.round(caps.frameRate.min));
                }
            } catch(e) {}
            return 0;
        }

        function addFrameRateConstraint(constraints) {
            var fps = getMinFrameRate();
            if (fps > 0) constraints.frameRate = { ideal: fps };
            return constraints;
        }

        function updateResLabels() {
            // pipResLabel — разрешение МОЕЙ камеры (PiP окно)
            var myText = '';
            if (localStream) {
                var vt = localStream.getVideoTracks()[0];
                if (vt && vt.enabled) {
                    var s = vt.getSettings();
                    var w = s.width || 0;
                    var h = s.height || 0;
                    if (w > 0 && h > 0) {
                        myText = w + '×' + h;
                        if (typeof vt.getCapabilities === 'function') {
                            try {
                                var caps = vt.getCapabilities();
                                if (caps && caps.frameRate && typeof caps.frameRate.min === 'number') {
                                    myText += '×' + Math.max(10, Math.round(caps.frameRate.min));
                                }
                            } catch(e) {}
                        }
                    }
                }
            }
            document.getElementById('pipResLabel').textContent = myText;

        // ============= Кодеки — строим из зелёных кнопок =============
        function buildCodecListFromButtons() {
            var list = [];
            if (S.h264) {
                if (S.aac) {
                    list.push('video/mp4;codecs="avc1.42E01E,mp4a.40.2"');
                }
                if (S.opus) {
                    list.push('video/mp4;codecs="avc1.42E01E,opus"');
                }
                if (!S.aac && !S.opus) {
                    list.push('video/mp4');
                }
            }
            if (S.vp8) {
                if (S.opus) {
                    list.push('video/webm;codecs="vp8,opus"');
                } else {
                    list.push('video/webm');
                }
            }
            // Audio-only codecs
            if (S.opus) list.push('audio/webm;codecs="opus"');
            if (S.aac) list.push('audio/mp4;codecs="mp4a.40.2"');
            if (list.length === 0) list.push('video/webm');
            return list;
        }

        function isCodecSupported(mimeType) {
            if (!MediaSource.isTypeSupported(mimeType)) return false;
            if (typeof MediaRecorder === 'undefined') return true;
            if (MediaRecorder.isTypeSupported(mimeType)) return true;
            var container = mimeType.split(';')[0];
            if (container !== mimeType && MediaRecorder.isTypeSupported(container)) return true;
            return false;
        }

        function detectSupportedCodecs() {
            var candidates = buildCodecListFromButtons();
            var supported = [];
            var seen = {};
            for (var i = 0; i < candidates.length; i++) {
                var c = candidates[i];
                if (isCodecSupported(c) && !seen[c]) {
                    seen[c] = true;
                    supported.push(c);
                }
                var container = c.split(';')[0];
                if (container !== c && !seen[container] && isCodecSupported(container)) {
                    seen[container] = true;
                    supported.push(container);
                }
            }
            if (supported.length === 0) supported.push('video/webm');
            return supported;
        }

        // Все кодеки которые MediaRecorder может записывать (для отправки пиру)
        function detectAllRecordCodecs() {
            var allCandidates = [
                'video/webm;codecs="vp8,opus"',
                'video/webm;codecs="vp8"',
                'video/webm',
                'video/mp4;codecs="avc1.42E01E,opus"',
                'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
                'video/mp4',
                'audio/webm;codecs="opus"',
                'audio/webm',
                'audio/mp4;codecs="mp4a.40.2"',
                'audio/mp4'
            ];
            var supported = [];
            var seen = {};
            for (var i = 0; i < allCandidates.length; i++) {
                var c = allCandidates[i];
                if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(c) && !seen[c]) {
                    seen[c] = true;
                    supported.push(c);
                }
            }
            if (supported.length === 0) supported.push('video/webm');
            return supported;
        }

        function detectCodec() {
            var candidates = buildCodecListFromButtons();
            for (var i = 0; i < candidates.length; i++) {
                if (isCodecSupported(candidates[i])) return candidates[i];
            }
            return 'video/webm';
        }

        function codecDisplayName(codec) {
            if (!codec) return 'Unknown';
            var video = '', audio = '';
            if (codec.indexOf('avc1.42E01E') !== -1) video = 'H.264 Baseline';
            else if (codec.indexOf('avc1.4D401E') !== -1) video = 'H.264 Main';
            else if (codec.indexOf('avc1.64001F') !== -1) video = 'H.264 High';
            else if (codec.indexOf('vp8') !== -1) video = 'VP8';
            if (codec.indexOf('opus') !== -1) audio = 'Opus';
            else if (codec.indexOf('mp4a.40.2') !== -1) audio = 'AAC';
            if (!video && codec.indexOf('audio/') === 0) return audio || codec;
            if (!video && codec.indexOf('mp4') !== -1) video = 'MP4';
            if (!video && codec.indexOf('webm') !== -1) video = 'WebM';
            var name = video || codec;
            if (audio) name += ' + ' + audio;
            return name;
        }

        // ============= Инициализация =============
        async function init() {
            try {
                var savedPeerW = parseInt(localStorage.getItem('vc_peerW')) || 0;
                var savedPeerH = parseInt(localStorage.getItem('vc_peerH')) || 0;
                var W = Math.min(Math.floor(window.innerWidth * 0.8), 1280);
                var H = Math.min(Math.floor(W * 3 / 4), 720);
                if (savedPeerW > 0 && savedPeerH > 0) {
                    W = Math.min(W, savedPeerW);
                    H = Math.min(H, savedPeerH);
                    diagLog('MEM peer=' + savedPeerW + 'x' + savedPeerH + ' fit=' + remoteFitLabels[remoteFitMode]);
                }

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: addFrameRateConstraint({ width: { ideal: W }, height: { ideal: H }, facingMode: 'user' }),
                    audio: {
                        echoCancellation: S.ec,
                        noiseSuppression: S.ns,
                        autoGainControl: S.agc
                    }
                });
                localVideo.srcObject = localStream;

                // Логируем capabilities камеры
                var camCaps = getCameraCapabilities();
                if (camCaps) {
                    diagLog('CAM caps: ' + camCaps.minW + '-' + camCaps.maxW + 'x' + camCaps.minH + '-' + camCaps.maxH + ' step=' + camCaps.stepW + 'x' + camCaps.stepH);
                } else {
                    diagLog('CAM caps: NOT AVAILABLE (getCapabilities unsupported)');
                }
                var vtInit = localStream.getVideoTracks()[0];
                if (vtInit) {
                    var vsInit = vtInit.getSettings();
                    diagLog('CAM init settings: ' + vsInit.width + 'x' + vsInit.height + ' fps=' + (vsInit.frameRate || 'n/a'));
                    if (typeof vtInit.getCapabilities === 'function') {
                        try {
                            var fullCaps = vtInit.getCapabilities();
                            diagLog('CAM full capabilities: ' + JSON.stringify(fullCaps));
                        } catch(e) { diagLog('CAM getCapabilities error: ' + e.message); }
                    }
                }

                // Уточняем разрешение до максимума камеры (если capabilities доступны)
                if (camCaps && camCaps.maxW > 0 && camCaps.maxH > 0) {
                    var maxW = camCaps.maxW;
                    var maxH = camCaps.maxH;
                    // Ограничиваем savedPeer если есть
                    if (savedPeerW > 0 && savedPeerH > 0) {
                        maxW = Math.min(maxW, savedPeerW);
                        maxH = Math.min(maxH, savedPeerH);
                    }
                    // Ограничиваем разумным максимумом
                    maxW = Math.min(maxW, 1280);
                    maxH = Math.min(maxH, 720);
                    var curS = vtInit ? vtInit.getSettings() : {};
                    if (curS.width < maxW - 32 || curS.height < maxH - 32) {
                        diagLog('CAM upgrade: ' + curS.width + 'x' + curS.height + ' -> ' + maxW + 'x' + maxH);
                        try {
                            await vtInit.applyConstraints(addFrameRateConstraint({ width: { ideal: maxW }, height: { ideal: maxH } }));
                            var ns = vtInit.getSettings();
                            diagLog('CAM upgraded to: ' + ns.width + 'x' + ns.height + ' fps=' + (ns.frameRate || 'n/a'));
                        } catch(e) { diagLog('CAM upgrade failed: ' + e.message); }
                    }
                }

                var myCodecs = detectSupportedCodecs();
                diagLog('CODECS supported: ' + myCodecs.map(codecDisplayName).join(' | '));

                var createResult = await tryCreateRoom();
                isCreator = createResult.created;
                diagLog('INIT peer=' + (isCreator ? 'host' : 'guest') + ' cam=' + W + 'x' + H);

                if (isCreator) {
                    myPeerID = 'host';
                    remotePeerID = 'guest';
                    waitingOverlay.classList.remove('hidden');
                    waitingText.textContent = 'Waiting for peer to join...';
                    var joined = null;
                    while (!joined) {
                        try {
                            joined = await waitForPeer();
                        } catch(e) {}
                        if (!joined) await new Promise(function(r) { setTimeout(r, 2000); });
                    }
                    waitingOverlay.classList.add('hidden');
                } else {
                    myPeerID = 'guest';
                    remotePeerID = 'host';
                    await joinRoom();
                }
                await startCall();
            } catch (err) {
                console.error('Init error:', err);
                if (err.name === 'NotAllowedError') showError('Camera and microphone access denied.');
                else if (err.name === 'NotFoundError') showError('No camera or microphone found.');
                else showError('Error: ' + err.message);
            }
        }

        // ============= API =============
        async function tryCreateRoom() {
            try {
                var resp = await fetch('/api/call/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID })
                });
                if (!resp.ok) return { created: false };
                var data = await resp.json();
                return { created: data.status === 'created' };
            } catch (e) { return { created: false }; }
        }

        async function waitForPeer() {
            try {
                var resp = await fetch('/api/call/wait?room=' + encodeURIComponent(roomID));
                if (!resp.ok) return false;
                var data = await resp.json();
                if (data.status === 'joined') return data;
                return false;
            } catch (e) { return false; }
        }

        async function joinRoom() {
            try {
                var resp = await fetch('/api/call/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID })
                });
                if (!resp.ok) return null;
                return await resp.json();
            } catch (e) { return null; }
        }

        async function sendChunk(buffer) {
            if (S.goSender) return; // Go sender active — browser doesn't send
            diagSentChunks++;
            diagSentBytes += buffer.byteLength;
            if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
                try { ws.send(buffer); } catch (e) {}
            }
        }

        async function endCall() {
            try { await fetch('/api/call/room?room=' + encodeURIComponent(roomID), { method: 'DELETE' }); } catch (e) {}
        }

        // ============= Разрешение =============
        async function applyDesiredResolution(dw, dh) {
            if (dw <= 0 || dh <= 0) return;
            var videoTracks = localStream.getVideoTracks();
            if (videoTracks.length === 0) return;
            try {
                await videoTracks[0].applyConstraints(addFrameRateConstraint({ width: { ideal: dw }, height: { ideal: dh } }));
                var s = videoTracks[0].getSettings();
                diagLog('RES applied peer desire ' + s.width + 'x' + s.height);
                updateResLabels();
            } catch (e) { diagLog('RES desire failed: ' + e.message); }
        }

        var RES_TOLERANCE = 32;
        async function applyMinResolution(myW, myH, peerW, peerH) {
            var newW = Math.min(myW, peerW);
            var newH = Math.min(myH, peerH);
            if (myW - newW <= RES_TOLERANCE && myH - newH <= RES_TOLERANCE) return;
            if (newW < myW || newH < myH) {
                var vt = localStream.getVideoTracks();
                if (vt.length > 0) {
                    try {
                        await vt[0].applyConstraints(addFrameRateConstraint({ width: { ideal: newW }, height: { ideal: newH } }));
                        var s = vt[0].getSettings();
                        diagLog('RES applied ' + s.width + 'x' + s.height);
                    } catch (e) { diagLog('RES apply failed: ' + e.message); }
                }
            }
        }

        // ============= Camera capabilities + findBestResolution =============
        // Возвращает { minW, maxW, stepW, minH, maxH, stepH } или null
        function getCameraCapabilities() {
            var vt = localStream ? localStream.getVideoTracks()[0] : null;
            if (!vt) return null;
            // Попытка getCapabilities() (Chrome, Edge, Android WebView)
            if (typeof vt.getCapabilities === 'function') {
                try {
                    var caps = vt.getCapabilities();
                    if (caps && caps.width && caps.height &&
                        typeof caps.width.min === 'number' && typeof caps.width.max === 'number' &&
                        typeof caps.height.min === 'number' && typeof caps.height.max === 'number') {
                        return {
                            minW: caps.width.min, maxW: caps.width.max, stepW: caps.width.step || 1,
                            minH: caps.height.min, maxH: caps.height.max, stepH: caps.height.step || 1
                        };
                    }
                } catch(e) {}
            }
            return null;
        }

        // Находит максимальное нативное разрешение <= mpx мегапикселей
        // Бинарный поиск (дихотомия) по getCapabilities, fallback на applyMpx
        function findBestResolution(mpx) {
            var caps = getCameraCapabilities();
            var vt = localStream ? localStream.getVideoTracks()[0] : null;
            if (!vt) return null;

            if (caps) {
                var aspect = caps.maxW / caps.maxH;
                var maxPixels = mpx * 1000000;
                var lo = caps.minW, hi = caps.maxW;
                var bestW = caps.minW, bestH = caps.minH;

                // Проверяем функцию: w*h при данном w (с учётом аспекта и step)
                function pixelsAt(w) {
                    var h = Math.round(w / aspect / caps.stepH) * caps.stepH;
                    if (h < caps.minH) h = caps.minH;
                    if (h > caps.maxH) h = caps.maxH;
                    return { w: w, h: h, px: w * h };
                }

                // Если даже minW превышает лимит — возвращаем минимум
                var minRes = pixelsAt(caps.minW);
                if (minRes.px > maxPixels) return { w: minRes.w, h: minRes.h };

                // Бинарный поиск: f(w) монотонно возрастает → ищем max w где w*h <= maxPixels
                while (hi - lo >= caps.stepW) {
                    var mid = Math.round((lo + hi) / 2 / caps.stepW) * caps.stepW;
                    if (mid < lo) mid = lo;
                    if (mid > hi) mid = hi;
                    if (mid === lo && lo + caps.stepW <= hi) mid = lo + caps.stepW;
                    var res = pixelsAt(mid);
                    if (res.px <= maxPixels) {
                        bestW = res.w; bestH = res.h;
                        lo = mid + caps.stepW;
                    } else {
                        hi = mid - caps.stepW;
                    }
                }
                // Чётность для кодирования
                if (bestW % 2 !== 0) bestW = Math.max(caps.minW, bestW - caps.stepW);
                if (bestH % 2 !== 0) bestH = Math.max(caps.minH, bestH - caps.stepH);
                return { w: bestW, h: bestH };
            }

            // Fallback: getSettings() → applyMpx
            var s = vt.getSettings();
            var aspectW = s.width || window.innerWidth;
            var aspectH = s.height || window.innerHeight;
            var r = applyMpx(aspectW, aspectH, mpx);
            return r;
        }

        // ============= Negotiate codec на клиенте =============
        function negotiateCodecClient(myRecordCodecs, peerPlayCodecs) {
            for (var i = 0; i < myRecordCodecs.length; i++) {
                for (var j = 0; j < peerPlayCodecs.length; j++) {
                    if (myRecordCodecs[i] === peerPlayCodecs[j]) return myRecordCodecs[i];
                }
            }
            return '';
        }

        // ============= Обработка настроек пира =============
        function handlePeerSettings(msg, initial) {
            var prev = peerSettings;
            peerSettings = msg;
            if (!isActive || !localStream) return;

            // Negotiate codec если у пира есть recordCodecs/playCodecs
            if (msg.recordCodecs && msg.playCodecs) {
                var myPlayCodecs = detectSupportedCodecs();
                var myRecordCodecs = detectAllRecordCodecs();
                var newRecordCodec = negotiateCodecClient(myRecordCodecs, msg.playCodecs);
                var newIncomingCodec = negotiateCodecClient(msg.recordCodecs, myPlayCodecs);
                if (newRecordCodec) {
                    recordCodec = newRecordCodec;
                    diagLog('NEGOTIATE record=' + codecDisplayName(recordCodec));
                }
                if (newIncomingCodec) {
                    incomingCodec = newIncomingCodec;
                    diagLog('NEGOTIATE incoming=' + codecDisplayName(incomingCodec));
                }
                if (recordCodec) negotiatedCodec = recordCodec;
            }

            // Пир хочет определённое разрешение от меня (через mpx)
            if (msg.mpx > 0) {
                var best = findBestResolution(msg.mpx);
                if (best && best.w > 0 && best.h > 0) {
                    diagLog('PEER wants ' + msg.mpx + 'mpx → best=' + best.w + 'x' + best.h);
                    applyDesiredResolution(best.w, best.h);
                }
            }

            // При начальном получении настроек — не трогаем рекордер, startCall сам запустит
            if (initial) return;

            // Дальнейшие изменения — рестарт рекордера при необходимости
            var codecChanged = false;
            // Проверяем изменился ли кодек
            if (msg.recordCodecs && msg.playCodecs) {
                var myRec = detectAllRecordCodecs();
                var newRec = negotiateCodecClient(myRec, msg.playCodecs);
                if (newRec !== recordCodec) codecChanged = true;
            }

            var peerWantsMyAudio = msg.wantAudio !== false;
            var peerWantsMyVideo = msg.wantVideo !== false;
            var canSend = (S.audio && peerWantsMyAudio) || (S.video && peerWantsMyVideo);
            // Обновляем метку разрешения пира
            updateResLabels();

            // Проверяем изменилось ли разрешение (mpx) — с debounce по lastHandledMpx
            var resolutionChanged = false;
            if (Math.abs(msg.mpx - lastHandledMpx) > 0.001) {
                resolutionChanged = true;
            }

            // Проверяем изменился ли входящий кодек → рестарт MSE
            var incomingCodecChanged = false;
            if (msg.recordCodecs && msg.playCodecs) {
                var myPlay = detectSupportedCodecs();
                var newInc = negotiateCodecClient(msg.recordCodecs, myPlay);
                if (newInc && newInc !== incomingCodec) {
                    incomingCodecChanged = true;
                    diagLog('MSE restart: incoming codec changed ' + codecDisplayName(incomingCodec) + ' → ' + codecDisplayName(newInc));
                    incomingCodec = newInc;
                }
            }

            // Проверяем изменилось ли состояние видео пира (камера вкл/выкл)
            var peerVideoChanged = false;
            if (prev) {
                var prevPeerVideo = prev.video !== false;
                var curPeerVideo = msg.video !== false;
                if (prevPeerVideo !== curPeerVideo) {
                    peerVideoChanged = true;
                    diagLog('MSE restart: peer video changed ' + prevPeerVideo + ' → ' + curPeerVideo);
                    // Обновляем incomingCodec под новый формат потока
                    if (!curPeerVideo) {
                        // Камера пира выключена — будет audio-only поток
                        var audioCodecs = ['audio/webm;codecs="opus"', 'audio/mp4;codecs="mp4a.40.2"', 'audio/webm'];
                        for (var ai = 0; ai < audioCodecs.length; ai++) {
                            if (MediaSource.isTypeSupported(audioCodecs[ai])) {
                                incomingCodec = audioCodecs[ai];
                                break;
                            }
                        }
                        diagLog('MSE incoming codec set to audio-only: ' + codecDisplayName(incomingCodec));
                    } else {
                        // Камера пира включена — пересчитываем через negotiation
                        if (msg.recordCodecs) {
                            var myPlay = detectSupportedCodecs();
                            var newInc = negotiateCodecClient(msg.recordCodecs, myPlay);
                            if (newInc) incomingCodec = newInc;
                        }
                        diagLog('MSE incoming codec set to video: ' + codecDisplayName(incomingCodec));
                    }
                }
            }

            if ((incomingCodecChanged || peerVideoChanged) && (mseReady || mseRestarting)) {
                if (mseRestarting) {
                    diagLog('MSE restart: cancelling previous restart for codec/video change');
                    if (mseSetupTimer) { clearTimeout(mseSetupTimer); mseSetupTimer = null; }
                    mseRestarting = false;
                    mseWaitingForInit = false;
                }
                diagLog('MSE restart: codec=' + incomingCodecChanged + ' peerVideo=' + peerVideoChanged);
                restartMSE();
            }

            // Проверяем изменился ли состав источников/приёмников
            var compositionChanged = false;
            if (prev) {
                var prevWantA = prev.wantAudio !== false;
                var prevWantV = prev.wantVideo !== false;
                var prevCanSend = (S.audio && prevWantA) || (S.video && prevWantV);
                var prevVideoActive = S.video && prevWantV;
                var curVideoActive = S.video && peerWantsMyVideo;
                if (prevCanSend !== canSend || prevVideoActive !== curVideoActive) {
                    compositionChanged = true;
                }
            }

            // Проверяем был ли рекордер остановлен
            var wasStopped = !recorderStarted || !mediaRecorder || mediaRecorder.state === 'inactive';

            if (!canSend) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    diagLog('REC stop: peer doesnt need my streams');
                    mediaRecorder.stop();
                    recorderStarted = false;
                }
            } else if (codecChanged || resolutionChanged || compositionChanged || wasStopped) {
                if (resolutionChanged) lastHandledMpx = msg.mpx;
                diagLog('REC restart: codec=' + codecChanged + ' res=' + resolutionChanged +
                    ' comp=' + compositionChanged + ' stopped=' + wasStopped);
                restartMediaRecorder();
            }
        }

        function restartMediaRecorder() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            // Небольшая задержка чтобы stop завершился
            setTimeout(function() {
                if (isActive) setupMediaRecorder();
            }, 100);
        }

        // ============= WebSocket =============
        function connectWS() {
            if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
            if (!isActive) return;
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsURL = proto + '//' + location.host + '/api/call/ws?room=' + encodeURIComponent(roomID) + '&peer=' + encodeURIComponent(myPeerID);
            diagLog('WS connecting...');
            try { ws = new WebSocket(wsURL); ws.binaryType = 'arraybuffer'; }
            catch (e) { diagLog('WS create error: ' + e.message); return; }
            ws.onopen = function() {
                wsConnected = true;
                diagLog('WS connected');
                // Отправляем свои настройки пиру при подключении
                sendSettings();
            };
            ws.onmessage = function(event) {
                if (event.data instanceof ArrayBuffer) {
                    handleIncomingChunk(event.data);
                } else if (typeof event.data === 'string') {
                    if (event.data === 'peer_left') {
                        diagLog('PEER left via WS');
                        hangup();
                    } else {
                        // JSON settings от пира
                        try {
                            var msg = JSON.parse(event.data);
                            if (msg.cmd === 'settings') {
                                diagLog('PEER settings: a=' + msg.audio + ' v=' + msg.video + ' wa=' + msg.wantAudio + ' wv=' + msg.wantVideo);
                                var initial = !peerSettings && peerSettingsResolve;
                                handlePeerSettings(msg, initial);
                                // Резолвим ожидание первых настроек
                                if (peerSettingsResolve) {
                                    var resolve = peerSettingsResolve;
                                    peerSettingsResolve = null;
                                    resolve(peerSettings);
                                }
                            }
                        } catch(e) {}
                    }
                }
            };
            ws.onclose = function(event) {
                wsConnected = false;
                diagLog('WS closed code=' + event.code);
                if (isActive) { wsReconnectTimer = setTimeout(function() { connectWS(); }, WS_RECONNECT_MS); }
            };
            ws.onerror = function() {};
        }

        function handleIncomingChunk(data) {
            diagRecvChunks++;
            diagRecvBytes += data.byteLength;
            lastReceivedIndex++;
            if (mseCriticalTriggered) return;

            // During MSE restart: discard stale chunks until init segment arrives
            if (mseWaitingForInit) {
                if (!isInitSegment(data)) {
                    diagLog('MSE discard stale chunk (' + data.byteLength + ' bytes)');
                    return;
                }
                diagLog('MSE init segment arrived (' + data.byteLength + ' bytes) — creating MSE');
                mseWaitingForInit = false;
                if (mseSetupTimer) { clearTimeout(mseSetupTimer); mseSetupTimer = null; }
                setupMSE();
            }

            mseQueue.push(data);
            if (mseReady) processMSEQueue();
        }

        function disconnectWS() {
            if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
            if (ws) {
                ws.onclose = null; ws.onerror = null; ws.onmessage = null;
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) ws.close();
                ws = null;
            }
            wsConnected = false;
        }

        // ============= Звонок =============
        async function startCall() {
            isActive = true;
            // 1. Готовимся принять настройки пира ДО подключения WS (чтобы не пропустить)
            if (!peerSettings) {
                peerSettingsResolve = null;
                var settingsPromise = new Promise(function(resolve) { peerSettingsResolve = resolve; });
            }
            // 2. Подключаем WS
            connectWS();
            // 3. Ждём пока WS подключится (до 10 секунд)
            var waitStart = Date.now();
            while (!wsConnected && isActive && (Date.now() - waitStart < 10000)) {
                await new Promise(function(r) { setTimeout(r, 100); });
            }
            if (!wsConnected) {
                diagLog('WS connect timeout');
                showError('WebSocket connection failed');
                peerSettingsResolve = null;
                return;
            }
            // 4. Ждём настройки пира (до 5 секунд) — чтобы знать кодек и разрешение до старта
            if (!peerSettings) {
                diagLog('Waiting for peer settings...');
                var timeoutPromise = new Promise(function(resolve) { setTimeout(function() { resolve(null); }, 5000); });
                var firstSettings = await Promise.race([settingsPromise, timeoutPromise]);
                peerSettingsResolve = null;
                if (firstSettings) {
                    diagLog('Got peer settings, codec=' + codecDisplayName(recordCodec) + ' incoming=' + codecDisplayName(incomingCodec));
                } else {
                    diagLog('Peer settings timeout, using defaults');
                }
            } else {
                diagLog('Peer settings already received, codec=' + codecDisplayName(recordCodec) + ' incoming=' + codecDisplayName(incomingCodec));
            }
            if (!isActive) return;
            // 5. Создаём MSE с известным incomingCodec
            setupMSE();
            // 6. Запускаем запись с известным recordCodec и разрешением (если browser sender)
            if (!S.goSender) {
                recorderStarted = true;
                setupMediaRecorder();
            } else {
                diagLog('REC skip — Go sender active');
            }
        }

        // ============= MSE =============
        function isInitSegment(data) {
            if (!data || data.byteLength < 8) return false;
            var v = new Uint8Array(data);
            // WebM/Matroska: EBML header 0x1A 0x45 0xDF 0xA3
            if (v[0] === 0x1A && v[1] === 0x45 && v[2] === 0xDF && v[3] === 0xA3) return true;
            // MP4/ISOBMFF: ftyp box — bytes 4-7 = 'ftyp' (0x66 0x74 0x79 0x70)
            if (v[4] === 0x66 && v[5] === 0x74 && v[6] === 0x79 && v[7] === 0x70) return true;
            return false;
        }


        function setupMSE() {
            var codec = incomingCodec || negotiatedCodec || detectCodec();
            mediaSource = new MediaSource();
            remoteVideo.src = URL.createObjectURL(mediaSource);
            mediaSource.addEventListener('sourceopen', function() {
                try {
                    sourceBuffer = mediaSource.addSourceBuffer(codec);
                    sourceBuffer.mode = 'sequence';
                    sourceBuffer.addEventListener('updateend', function() { onMSEUpdateEnd(); });
                    sourceBuffer.addEventListener('error', function() {
                        diagMSEErrors++;
                        mseErrorTimestamps.push(Date.now());
                        checkMSECritical();
                    });
                    mseReady = true;
                    mseRestarting = false;
                    mseCriticalTriggered = false;
                    if (mseQueue.length > 0) processMSEQueue();
                } catch (e) { showError('MSE codec not supported: ' + codec); }
            });
        }

        function onMSEUpdateEnd() {
            if (firstAppendDone) {
                try {
                    if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                        var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                        var behind = bufEnd - remoteVideo.currentTime;
                        if (behind > 3.0) {
                            var target = bufEnd - 1.5;
                            remoteVideo.currentTime = target;
                            diagLog('PLAY catchup ct=' + target.toFixed(1) + ' behind=' + behind.toFixed(1) + 's');
                        }
                    }
                } catch(e) {}
            }
            if (!trimScheduled) {
                trimScheduled = true;
                setTimeout(function() { trimBuffer(); trimScheduled = false; }, 500);
            }
            processMSEQueue();
        }

        function processMSEQueue() {
            if (!mseReady || !sourceBuffer || sourceBuffer.updating) return;
            if (mseQueue.length === 0) return;
            var chunkData = mseQueue.shift();
            try {
                sourceBuffer.appendBuffer(new Uint8Array(chunkData));
                diagMSEAppends++;
                if (!firstAppendDone) {
                    firstAppendDone = true;
                    remoteVideo.play().catch(function(e) { diagLog('PLAY failed: ' + e.message); });
                    diagLog('PLAY starting...');
                }
            } catch (e) {
                diagMSEErrors++;
                mseErrorTimestamps.push(Date.now());
                if (e.message && e.message.indexOf('removed from the parent') !== -1) {
                    diagLog('MSE ERR sourceBuffer removed — hanging up');
                    if (!mseCriticalTriggered) {
                        mseCriticalTriggered = true;
                        mseQueue = [];
                        hangup();
                    }
                    return;
                }
                checkMSECritical();
                if (mseReady && !mseCriticalTriggered) processMSEQueue();
            }
        }

        function trimBuffer() {
            if (!sourceBuffer || sourceBuffer.updating) return;
            if (!remoteVideo.buffered || remoteVideo.buffered.length === 0) return;
            try {
                var buffered = remoteVideo.buffered;
                var bufferEnd = buffered.end(buffered.length - 1);
                var bufferStart = buffered.start(0);
                var bufferDuration = bufferEnd - bufferStart;
                if (bufferDuration > MAX_BUFFER_SECONDS) {
                    var removeEnd = bufferEnd - MAX_BUFFER_SECONDS;
                    if (removeEnd > bufferStart + 0.5) {
                        if (remoteVideo.currentTime < removeEnd) remoteVideo.currentTime = removeEnd + 0.1;
                        sourceBuffer.remove(bufferStart, removeEnd);
                    }
                }
            } catch (e) {}
        }

        function checkMSECritical() {
            if (mseCriticalTriggered) return;
            var now = Date.now();
            while (mseErrorTimestamps.length > 0 && now - mseErrorTimestamps[0] > MSE_CRITICAL_WINDOW_MS) {
                mseErrorTimestamps.shift();
            }
            if (mseErrorTimestamps.length >= MSE_CRITICAL_THRESHOLD) {
                mseCriticalTriggered = true;
                mseQueue = [];
                diagLog('MSE CRITICAL (' + mseErrorTimestamps.length + ' errors in ' + (MSE_CRITICAL_WINDOW_MS / 1000) + 's) — hanging up');
                hangup();
            }
        }

        function restartMSE() {
            if (mseRestarting) return; // уже в процессе рестарта
            mseRestarting = true;
            diagLog('MSE RESTART (planned — codec/video change)');

            // Очистка старого MSE
            mseReady = false;
            firstAppendDone = false;
            mseCriticalTriggered = false;
            mseErrorTimestamps = [];
            mseQueue = [];
            mseWaitingForInit = true;

            if (mediaSource) {
                try { mediaSource.endOfStream(); } catch(e) {}
            }
            try { URL.revokeObjectURL(remoteVideo.src); } catch(e) {}
            remoteVideo.removeAttribute('src');
            remoteVideo.load();
            sourceBuffer = null;
            mediaSource = null;

            // Страховочный таймаут: если init segment не пришёл за 3 секунды —
            // создать MSE с известным кодеком (как при начале звонка)
            mseSetupTimer = setTimeout(function() {
                mseSetupTimer = null;
                if (!isActive) { mseRestarting = false; mseWaitingForInit = false; return; }
                if (mseWaitingForInit) {
                    mseWaitingForInit = false;
                    diagLog('MSE timeout — creating MSE with known codec');
                    setupMSE();
                }
            }, 3000);
        }

        // ============= MediaRecorder =============
        function setupMediaRecorder() {
            if (!localStream) return;
            var videoTrack = localStream.getVideoTracks()[0];
            var settings = videoTrack ? videoTrack.getSettings() : {};
            var w = settings.width || 320;
            var h = settings.height || 240;

            // При выключенном видео — выбираем audio-only кодек
            var codec;
            if (!S.video && S.audio) {
                var audioCodecs = ['audio/webm;codecs="opus"', 'audio/mp4;codecs="mp4a.40.2"', 'audio/webm'];
                codec = 'audio/webm;codecs="opus"';
                for (var i = 0; i < audioCodecs.length; i++) {
                    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(audioCodecs[i])) {
                        codec = audioCodecs[i];
                        break;
                    }
                }
                diagLog('REC audio-only codec=' + codecDisplayName(codec));
            } else {
                codec = recordCodec || negotiatedCodec || detectCodec();
                diagLog('REC codec=' + codecDisplayName(codec) + ' res=' + w + 'x' + h);
            }
            updateResLabels();

            try {
                mediaRecorder = new MediaRecorder(localStream, { mimeType: codec });
            } catch (e) {
                diagLog('REC with codec failed: ' + e.message + ', trying without');
                try { mediaRecorder = new MediaRecorder(localStream, {}); }
                catch (e2) { showError('MediaRecorder not supported: ' + e2.message); return; }
            }
            mediaRecorder.ondataavailable = function(e) {
                if (e.data && e.data.size > 0 && isActive) {
                    e.data.arrayBuffer().then(function(buffer) { sendChunk(buffer); });
                }
            };
            var recErrorCount = 0;
            mediaRecorder.onerror = function(e) {
                recErrorCount++;
                diagLog('REC error #' + recErrorCount + ': ' + (e.error ? e.error.message : 'unknown'));
                if (recErrorCount >= 3 && S.video) camBtn.click();
            };
            mediaRecorder.start(CHUNK_INTERVAL_MS);
            // Отправляем пиру своё фактическое разрешение после старта рекордера
            setTimeout(function() { sendSettings(); }, 200);
        }

        // ============= Сохранение состояния =============
        function saveCallState() {
            if (remoteNativeW > 0 && remoteNativeH > 0) {
                localStorage.setItem('vc_peerW', remoteNativeW);
                localStorage.setItem('vc_peerH', remoteNativeH);
            }
            localStorage.setItem('vc_fitMode', remoteFitMode);
            saveSettings();
        }

        function hangup() {
            isActive = false;
            saveCallState();
            disconnectWS();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
            mseReady = false;
            mseQueue = [];
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch (e) {}
            }
            endCall();
            setTimeout(function() { window.close(); }, 1500);
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        window.addEventListener('beforeunload', function() {
            isActive = false;
            saveCallState();
            disconnectWS();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (localStream && !S.goSender) localStream.getTracks().forEach(function(t) { t.stop(); });
            endCall();
        });
    </script>
</body>
