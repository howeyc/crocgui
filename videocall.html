<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .videos {
            flex: 1;
            display: flex;
            position: relative;
            padding: 8px;
            gap: 8px;
            min-height: 0;
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transition: transform 0.2s ease;
        }
        .video-container video.fit-1to1 {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: none;
            transform: none;
        }
        .video-container video.fit-half {
            max-width: none;
            max-height: none;
            object-fit: contain;
        }
        .video-container video.fit-2x {
            transform: scale(2);
        }
        /* Панель управления — 3 ряда, всегда видна */
        .controls-panel {
            position: absolute;
            top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 15;
            transition: right 0.3s ease, left 0.3s ease;
        }
        .controls-panel.pos-right { right: 8px; left: auto; }
        .controls-panel.pos-left { left: 8px; right: auto; }
        .controls-row {
            display: flex;
            gap: 4px;
            align-items: center;
            width: 100%;
        }
        /* ====== ГЛАВНОЕ ПРАВИЛО: все кнопки в ряду занимают одинаковую ширину ====== */
        .controls-row .ctrl-btn {
            flex: 1;
            min-width: 0;
            width: auto !important;  /* переопределяем фиксированную ширину */
        }
        .pip-container {
            position: absolute;
            width: 240px;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 20;
            cursor: pointer;
            transition: top 0.3s ease, left 0.3s ease, right 0.3s ease;
        }
        .pip-container.pip-tl { top: 12px; left: 12px; bottom: auto; right: auto; }
        .pip-container.pip-tr { top: 12px; right: 12px; bottom: auto; left: auto; }
        .pip-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .waiting-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .waiting-overlay.hidden { display: none; }
        .waiting-spinner {
            width: 48px; height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-text { color: #aaa; font-size: 1em; }
        .pip-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            padding: 4px;
            background: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.3s;
        }
        @media (hover: hover) {
            .pip-container:hover .pip-controls,
            .pip-controls.has-off { opacity: 1; }
        }
        @media (hover: none), (max-width: 600px) {
            .pip-controls { opacity: 1; }
        }
        .ctrl-btn {
            height: 28px;
            width: 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.7em;
            font-family: monospace;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
            background: #4ecca3;
        }
        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.off { background: #e94560; }
        .ctrl-btn.mic { background: #4ecca3; }
        .ctrl-btn.mic.off { background: #e94560; }
        .ctrl-btn.cam { background: #4ecca3; }
        .ctrl-btn.cam.off { background: #e94560; }
        .ctrl-btn.hangup { background: #555; }
        .ctrl-btn.hangup:hover { background: #666; }
        .ctrl-btn.fullscreen { background: #4ecca3; }
        .ctrl-btn.fullscreen.off { background: #555; }
        .ctrl-btn.fit {
            width: auto;
            padding: 0 8px;
            white-space: nowrap;
        }
        .ctrl-btn.codec {
            width: auto;
            padding: 0 6px;
            white-space: nowrap;
        }
        .ctrl-btn.mpx { background: #555; }
        .ctrl-btn.mpx.active { background: #4ecca3; }
        .error-banner {
            background: #e94560;
            color: white;
            padding: 12px;
            text-align: center;
            display: none;
        }
        .error-banner.show { display: block; }
        @media (max-height: 500px) {
            .pip-container { width: 160px; height: 120px; }
            .ctrl-btn { height: 22px; width: 22px; font-size: 0.6em; }
        }
        @media (max-width: 600px) {
            .pip-container { width: 30%; height: auto; aspect-ratio: 4/3; min-width: 80px; }
            .ctrl-btn { height: 36px; width: 36px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="error-banner" id="errorBanner"></div>
    <div class="videos">
        <div class="video-container main-video">
            <video id="remoteVideo" autoplay playsinline></video>
            <!-- Панель из 3 рядов -->
            <div class="controls-panel pos-right" id="controlsPanel">
                <!-- Ряд 1: Fit, ⬚, ❌ -->
                <div class="controls-row">
                    <button class="ctrl-btn fit" id="fitBtn" title="Fit Mode">Fit</button>
                    <button class="ctrl-btn fullscreen off" id="fullscreenBtn" title="Fullscreen">⬚</button>
                    <button class="ctrl-btn hangup" id="hangupBtn" title="Hangup">❌</button>
                </div>
                <!-- Ряд 2: 💻 VP8 H264 + мегапиксельный множитель для запроса пиру -->
                <div class="controls-row">
                    <button class="ctrl-btn screen" id="remoteScreenBtn" title="Remote Video">💻</button>
                    <button class="ctrl-btn codec" id="vp8Btn" title="VP8">VP8</button>
                    <button class="ctrl-btn codec" id="h264Btn" title="H.264">H264</button>
                    <button class="ctrl-btn codec mpx" id="mpx1Btn" title="1 megapixels">1</button>
                    <button class="ctrl-btn codec mpx" id="mpx13Btn" title="1/3 megapixels">¹⁄₃</button>
                    <button class="ctrl-btn codec mpx" id="mpx15Btn" title="1/5 megapixels">¹⁄₅</button>
                    <button class="ctrl-btn codec mpx active" id="mpx110Btn" title="1/10 megapixels">¹⁄₁₀</button>
                </div>
                <!-- Ряд 3: 🔈 Opus AAC EC NS AGC -->
                <div class="controls-row">
                    <button class="ctrl-btn speaker" id="remoteMuteBtn" title="Remote Audio">🔈</button>
                    <button class="ctrl-btn codec" id="opusBtn" title="Opus">Opus</button>
                    <button class="ctrl-btn codec" id="aacBtn" title="AAC">AAC</button>
                    <button class="ctrl-btn codec" id="ecBtn" title="Echo Cancellation">EC</button>
                    <button class="ctrl-btn codec" id="nsBtn" title="Noise Suppression">NS</button>
                    <button class="ctrl-btn codec" id="agcBtn" title="Auto Gain Control">AGC</button>
                </div>
            </div>
            <div class="waiting-overlay hidden" id="waitingOverlay">
                <div class="waiting-spinner"></div>
                <div class="waiting-text" id="waitingText">Waiting for peer...</div>
            </div>
            <div class="pip-container pip-tl" id="pipContainer">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="pip-controls" id="pipControls">
                    <button class="ctrl-btn mic" id="micBtn" title="Mic">🎤</button>
                    <button class="ctrl-btn cam" id="camBtn" title="Cam">📷</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============= Конфигурация =============
        var CHUNK_INTERVAL_MS = 100;
        var MAX_BUFFER_SECONDS = 10;
        var ALIVE_CHECK_MS = 3000;
        var WS_RECONNECT_MS = 2000;

        // ============= Элементы UI =============
        var localVideo = document.getElementById('localVideo');
        var remoteVideo = document.getElementById('remoteVideo');
        var waitingOverlay = document.getElementById('waitingOverlay');
        var waitingText = document.getElementById('waitingText');
        var errorBanner = document.getElementById('errorBanner');
        var micBtn = document.getElementById('micBtn');
        var camBtn = document.getElementById('camBtn');
        var hangupBtn = document.getElementById('hangupBtn');
        var remoteMuteBtn = document.getElementById('remoteMuteBtn');
        var remoteScreenBtn = document.getElementById('remoteScreenBtn');
        var fullscreenBtn = document.getElementById('fullscreenBtn');
        var fitBtn = document.getElementById('fitBtn');
        var vp8Btn = document.getElementById('vp8Btn');
        var h264Btn = document.getElementById('h264Btn');
        var opusBtn = document.getElementById('opusBtn');
        var aacBtn = document.getElementById('aacBtn');
        var mpx110Btn = document.getElementById('mpx110Btn');
        var mpx1Btn = document.getElementById('mpx1Btn');
        var mpx13Btn = document.getElementById('mpx13Btn');
        var mpx15Btn = document.getElementById('mpx15Btn');
        var ecBtn = document.getElementById('ecBtn');
        var nsBtn = document.getElementById('nsBtn');
        var agcBtn = document.getElementById('agcBtn');

        var _chatUserId = localStorage.getItem('chatUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatUserId', _chatUserId);

        // ============= Сохраняемое состояние кнопок =============
        function loadButtonStates() {
            try {
                var s = JSON.parse(localStorage.getItem('vc_btnStates') || '{}');
                return {
                    remoteVideoOn: s.remoteVideoOn !== undefined ? s.remoteVideoOn : true,
                    remoteAudioOn: s.remoteAudioOn !== undefined ? s.remoteAudioOn : true,
                    vp8Enabled: s.vp8Enabled !== undefined ? s.vp8Enabled : true,
                    h264Enabled: s.h264Enabled !== undefined ? s.h264Enabled : false,
                    opusEnabled: s.opusEnabled !== undefined ? s.opusEnabled : true,
                    aacEnabled: s.aacEnabled !== undefined ? s.aacEnabled : false,
                    ecEnabled: s.ecEnabled !== undefined ? s.ecEnabled : true,
                    nsEnabled: s.nsEnabled !== undefined ? s.nsEnabled : true,
                    agcEnabled: s.agcEnabled !== undefined ? s.agcEnabled : true,
                    mpx: s.mpx !== undefined ? s.mpx : 0.1, // 0.1, 1, 1/3, 0.2
                    pipCorner: s.pipCorner || 0
                };
            } catch(e) {
                return {
                    remoteVideoOn: true, remoteAudioOn: true,
                    vp8Enabled: true, h264Enabled: false,
                    opusEnabled: true, aacEnabled: false,
                    ecEnabled: true, nsEnabled: true, agcEnabled: true,
                    mpx: 0.1, pipCorner: 0
                };
            }
        }
        var btnStates = loadButtonStates();
        var audioEnabled = true;
        var videoEnabled = true;

        // Применяем состояния к кнопкам
        function applyButtonStates() {
            remoteScreenBtn.classList.toggle('off', !btnStates.remoteVideoOn);
            remoteVideo.style.visibility = btnStates.remoteVideoOn ? 'visible' : 'hidden';
            remoteMuteBtn.classList.toggle('off', !btnStates.remoteAudioOn);
            remoteVideo.muted = !btnStates.remoteAudioOn;
            vp8Btn.classList.toggle('off', !btnStates.vp8Enabled);
            h264Btn.classList.toggle('off', !btnStates.h264Enabled);
            opusBtn.classList.toggle('off', !btnStates.opusEnabled);
            aacBtn.classList.toggle('off', !btnStates.aacEnabled);
            ecBtn.classList.toggle('off', !btnStates.ecEnabled);
            nsBtn.classList.toggle('off', !btnStates.nsEnabled);
            agcBtn.classList.toggle('off', !btnStates.agcEnabled);
            // Megapixel radio buttons
            var mpxBtns = [mpx110Btn, mpx1Btn, mpx13Btn, mpx15Btn];
            var mpxValues = [0.1, 1, 1/3, 0.2];
            for (var i = 0; i < mpxValues.length; i++) {
                mpxBtns[i].classList.toggle('active', Math.abs(btnStates.mpx - mpxValues[i]) < 0.01);
            }
        }

        // ============= Мегапиксельный множитель для запроса пиру =============
        var mpxBtns = [mpx110Btn, mpx1Btn, mpx13Btn, mpx15Btn];
        var mpxValues = [0.1, 1, 1/3, 0.2];
        function setMpx(val) {
            btnStates.mpx = val;
            for (var i = 0; i < mpxValues.length; i++) {
                mpxBtns[i].classList.toggle('active', Math.abs(val - mpxValues[i]) < 0.01);
            }
            updateFitBtnLabel();
            saveCallState();
        }
        mpx110Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(0.1); });
        mpx1Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(1); });
        mpx13Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(1/3); });
        mpx15Btn.addEventListener('click', function(e) { e.stopPropagation(); setMpx(0.2); });

        // Масштабирование разрешения по абсолютным мегапикселям
        // mpx=0.1 → 0.1MP, mpx=1 → 1MP (~720p), mpx=1/3 → 0.33MP, mpx=1/5 → 0.2MP
        function applyMpx(aspectW, aspectH, mpx) {
            var targetPixels = mpx * 1000000;
            var aspectRatio = aspectW / aspectH;
            var h = Math.round(Math.sqrt(targetPixels / aspectRatio));
            var w = Math.round(h * aspectRatio);
            // Чётные размеры для кодеков
            if (w % 2 !== 0) w++;
            if (h % 2 !== 0) h++;
            return { w: w, h: h };
        }

        // ============= Состояние звонка =============
        var params = new URLSearchParams(window.location.search);
        var roomID = params.get('room') || '';
        var isActive = false;
        var localStream = null;
        var mediaRecorder = null;
        var aliveInterval = null;
        var isCreator = false;

        var myPeerID = 'host';
        var remotePeerID = 'guest';
        var lastReceivedIndex = -1;

        var ws = null;
        var wsConnected = false;
        var wsReconnectTimer = null;

        var mediaSource = null;
        var sourceBuffer = null;
        var mseQueue = [];
        var mseReady = false;
        var negotiatedCodec = '';
        var trimScheduled = false;
        var firstAppendDone = false;

        var diagSentChunks = 0;
        var diagSentBytes = 0;
        var diagRecvChunks = 0;
        var diagRecvBytes = 0;
        var diagMSEAppends = 0;
        var diagMSEErrors = 0;
        var diagLastLogTime = 0;
        var MSE_CRITICAL_THRESHOLD = 5;
        var mseCriticalTriggered = false;

        // Remote video fit modes: 0=fit, 1=1:1, 2=1:2, 3=2:1
        var remoteFitMode = parseInt(localStorage.getItem('vc_fitMode')) || 0;
        var remoteFitModes = ['', 'fit-1to1', 'fit-half', 'fit-2x'];
        var remoteFitLabels = ['Fit', '1:1', '1:2', '2:1'];
        var remoteNativeW = 0;
        var remoteNativeH = 0;

        function updateFitBtnLabel() {
            var w = remoteNativeW, h = remoteNativeH;
            var label = remoteFitLabels[remoteFitMode];
            if (w > 0 && h > 0) {
                var r = applyMpx(w, h, btnStates.mpx);
                label += ' ' + r.w + '×' + r.h;
            }
            fitBtn.textContent = label;
        }
        function applyRemoteFitMode() {
            remoteVideo.classList.remove('fit-1to1', 'fit-half', 'fit-2x');
            remoteVideo.style.width = '';
            remoteVideo.style.height = '';
            if (remoteFitMode === 0 || remoteNativeW === 0) {
                updateFitBtnLabel();
                return;
            }
            if (remoteFitModes[remoteFitMode]) {
                remoteVideo.classList.add(remoteFitModes[remoteFitMode]);
            }
            if (remoteFitMode === 1) {
                remoteVideo.style.width = remoteNativeW + 'px';
                remoteVideo.style.height = remoteNativeH + 'px';
            } else if (remoteFitMode === 2) {
                remoteVideo.style.width = Math.round(remoteNativeW / 2) + 'px';
                remoteVideo.style.height = Math.round(remoteNativeH / 2) + 'px';
            }
            updateFitBtnLabel();
        }
        remoteVideo.addEventListener('loadedmetadata', function() {
            remoteNativeW = remoteVideo.videoWidth || 0;
            remoteNativeH = remoteVideo.videoHeight || 0;
            if (remoteNativeW > 0 && remoteNativeH > 0) {
                localStorage.setItem('vc_peerW', remoteNativeW);
                localStorage.setItem('vc_peerH', remoteNativeH);
            }
            applyRemoteFitMode();
        });
        fitBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            remoteFitMode = (remoteFitMode + 1) % remoteFitModes.length;
            applyRemoteFitMode();
            saveCallState();
        });

        // PiP — только сверху
        var pipCorners = ['pip-tl', 'pip-tr'];
        var pipCorner = btnStates.pipCorner || 0;
        var pipContainer = document.getElementById('pipContainer');
        // Применяем сохранённую позицию PiP
        pipCorners.forEach(function(c) { pipContainer.classList.remove(c); });
        pipContainer.classList.add(pipCorners[pipCorner]);

        function updateControlsPosition() {
            var panel = document.getElementById('controlsPanel');
            // pip слева → контролы справа, pip справа → контролы слева
            var pos = pipCorners[pipCorner] === 'pip-tl' ? 'pos-right' : 'pos-left';
            panel.classList.remove('pos-right', 'pos-left');
            panel.classList.add(pos);
        }
        pipContainer.addEventListener('click', function(e) {
            if (e.target.closest('.pip-controls')) return;
            pipCorner = (pipCorner + 1) % pipCorners.length;
            btnStates.pipCorner = pipCorner;
            pipCorners.forEach(function(c) { pipContainer.classList.remove(c); });
            pipContainer.classList.add(pipCorners[pipCorner]);
            updateControlsPosition();
        });
        updateControlsPosition();
        applyButtonStates();

        // Fullscreen
        function enterFullscreen() {
            var el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }
        function exitFullscreen() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        fullscreenBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (document.fullscreenElement || document.webkitFullscreenElement) exitFullscreen();
            else enterFullscreen();
        });
        function syncFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) fullscreenBtn.classList.remove('off');
            else fullscreenBtn.classList.add('off');
        }
        document.addEventListener('fullscreenchange', syncFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', syncFullscreenBtn);

        // Кнопки управления
        remoteMuteBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.remoteAudioOn = !btnStates.remoteAudioOn;
            remoteVideo.muted = !btnStates.remoteAudioOn;
            remoteMuteBtn.classList.toggle('off', !btnStates.remoteAudioOn);
            saveCallState();
        });
        remoteScreenBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.remoteVideoOn = !btnStates.remoteVideoOn;
            remoteVideo.style.visibility = btnStates.remoteVideoOn ? 'visible' : 'hidden';
            remoteScreenBtn.classList.toggle('off', !btnStates.remoteVideoOn);
            saveCallState();
        });
        vp8Btn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.vp8Enabled = !btnStates.vp8Enabled;
            vp8Btn.classList.toggle('off', !btnStates.vp8Enabled);
            saveCallState();
        });
        h264Btn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.h264Enabled = !btnStates.h264Enabled;
            h264Btn.classList.toggle('off', !btnStates.h264Enabled);
            saveCallState();
        });
        opusBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.opusEnabled = !btnStates.opusEnabled;
            opusBtn.classList.toggle('off', !btnStates.opusEnabled);
            saveCallState();
        });
        aacBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.aacEnabled = !btnStates.aacEnabled;
            aacBtn.classList.toggle('off', !btnStates.aacEnabled);
            saveCallState();
        });
        ecBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.ecEnabled = !btnStates.ecEnabled;
            if (localStream) {
                var tracks = localStream.getAudioTracks();
                if (tracks.length > 0) {
                    try { tracks[0].applyConstraints({ advanced: [{ echoCancellation: btnStates.ecEnabled }] }); } catch(e) {}
                }
            }
            ecBtn.classList.toggle('off', !btnStates.ecEnabled);
            saveCallState();
        });
        nsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.nsEnabled = !btnStates.nsEnabled;
            if (localStream) {
                var tracks = localStream.getAudioTracks();
                if (tracks.length > 0) {
                    try { tracks[0].applyConstraints({ advanced: [{ noiseSuppression: btnStates.nsEnabled }] }); } catch(e) {}
                }
            }
            nsBtn.classList.toggle('off', !btnStates.nsEnabled);
            saveCallState();
        });
        agcBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            btnStates.agcEnabled = !btnStates.agcEnabled;
            if (localStream) {
                var tracks = localStream.getAudioTracks();
                if (tracks.length > 0) {
                    try { tracks[0].applyConstraints({ advanced: [{ autoGainControl: btnStates.agcEnabled }] }); } catch(e) {}
                }
            }
            agcBtn.classList.toggle('off', !btnStates.agcEnabled);
            saveCallState();
        });

        hangupBtn.addEventListener('click', function() { hangup(); });

        if (!roomID) {
            showError('No room ID specified. URL: /videocall.html?room=ROOM_ID');
        } else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('Camera/mic access requires HTTPS or localhost (127.0.0.1). Current: ' + location.host);
        } else {
            init();
        }

        // ============= Диагностика =============
        function diagLog(msg) {
            try {
                fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: '🔧 ' + msg, sender: _chatUserId })
                });
            } catch (e) {}
        }

        function diagStats() {
            if (!isActive) return;
            var bufInfo = 'none';
            try {
                if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                    var s = remoteVideo.buffered.start(0);
                    var e = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                    bufInfo = (e - s).toFixed(1) + 's [' + s.toFixed(1) + '-' + e.toFixed(1) + ']';
                }
            } catch (e) {}
            var ct = remoteVideo.currentTime.toFixed(1);
            var paused = remoteVideo.paused ? ' PAUSED' : '';
            var waiting = remoteVideo.readyState < 3 ? ' WAITING' : '';
            diagLog('STAT sent:' + (diagSentBytes / 1024).toFixed(0) + 'KB' +
                ' recv:' + (diagRecvBytes / 1024).toFixed(0) + 'KB' +
                ' appends:' + diagMSEAppends + ' errs:' + diagMSEErrors +
                ' buf:' + bufInfo + ' ct:' + ct + paused + waiting);
        }
        setInterval(function() { diagStats(); }, 30000);

        // ============= Экстренный seek =============
        setInterval(function() {
            if (!isActive || !mseReady) return;
            try {
                if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                    var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                    var bufStart = remoteVideo.buffered.start(0);
                    var ct = remoteVideo.currentTime;
                    var behind = bufEnd - ct;
                    if (behind > 3) {
                        var target = bufEnd - 1;
                        diagLog('SEEK ct=' + ct.toFixed(1) + ' -> ' + target.toFixed(1) + ' behind=' + behind.toFixed(1) + 's EMERGENCY');
                        remoteVideo.currentTime = target;
                        if (remoteVideo.paused) remoteVideo.play().catch(function(){});
                    }
                    if (ct < bufStart - 0.5) {
                        remoteVideo.currentTime = bufStart + 0.1;
                        if (remoteVideo.paused) remoteVideo.play().catch(function(){});
                    }
                }
            } catch (e) {}
        }, 2000);

        // ============= Кодеки — строим из зелёных кнопок =============
        function buildCodecListFromButtons() {
            var list = [];
            if (btnStates.h264Enabled) {
                if (btnStates.aacEnabled) {
                    list.push('video/mp4;codecs="avc1.42E01E,mp4a.40.2"'); // H.264 Baseline + AAC
                }
                if (btnStates.opusEnabled) {
                    list.push('video/mp4;codecs="avc1.42E01E,opus"'); // H.264 Baseline + Opus
                }
                if (!btnStates.aacEnabled && !btnStates.opusEnabled) {
                    list.push('video/mp4');
                }
            }
            if (btnStates.vp8Enabled) {
                if (btnStates.opusEnabled) {
                    list.push('video/webm;codecs="vp8,opus"');
                } else {
                    list.push('video/webm');
                }
            }
            if (list.length === 0) list.push('video/webm');
            return list;
        }

        function isCodecSupported(mimeType) {
            if (!MediaSource.isTypeSupported(mimeType)) return false;
            if (typeof MediaRecorder === 'undefined') return true;
            if (MediaRecorder.isTypeSupported(mimeType)) return true;
            var container = mimeType.split(';')[0];
            if (container !== mimeType && MediaRecorder.isTypeSupported(container)) return true;
            return false;
        }

        function detectSupportedCodecs() {
            var candidates = buildCodecListFromButtons();
            var supported = [];
            var seen = {};
            for (var i = 0; i < candidates.length; i++) {
                var c = candidates[i];
                if (isCodecSupported(c) && !seen[c]) {
                    seen[c] = true;
                    supported.push(c);
                }
                var container = c.split(';')[0];
                if (container !== c && !seen[container] && isCodecSupported(container)) {
                    seen[container] = true;
                    supported.push(container);
                }
            }
            if (supported.length === 0) supported.push('video/webm');
            return supported;
        }

        function detectCodec() {
            var candidates = buildCodecListFromButtons();
            for (var i = 0; i < candidates.length; i++) {
                if (isCodecSupported(candidates[i])) return candidates[i];
            }
            return 'video/webm';
        }

        function codecDisplayName(codec) {
            if (!codec) return 'Unknown';
            var video = '', audio = '';
            if (codec.indexOf('avc1.42E01E') !== -1) video = 'H.264 Baseline';
            else if (codec.indexOf('avc1.4D401E') !== -1) video = 'H.264 Main';
            else if (codec.indexOf('avc1.64001F') !== -1) video = 'H.264 High';
            else if (codec.indexOf('vp8') !== -1) video = 'VP8';
            else if (codec.indexOf('mp4') !== -1) video = 'MP4';
            else if (codec.indexOf('webm') !== -1) video = 'WebM';
            if (codec.indexOf('opus') !== -1) audio = 'Opus';
            else if (codec.indexOf('mp4a.40.2') !== -1) audio = 'AAC';
            var name = video || codec;
            if (audio) name += ' + ' + audio;
            return name;
        }

        // ============= Инициализация =============
        async function init() {
            try {
                var savedPeerW = parseInt(localStorage.getItem('vc_peerW')) || 0;
                var savedPeerH = parseInt(localStorage.getItem('vc_peerH')) || 0;
                var W = Math.min(Math.floor(window.innerWidth * 0.8), 1280);
                var H = Math.min(Math.floor(W * 3 / 4), 720);
                if (savedPeerW > 0 && savedPeerH > 0) {
                    W = Math.min(W, savedPeerW);
                    H = Math.min(H, savedPeerH);
                    diagLog('MEM peer=' + savedPeerW + 'x' + savedPeerH + ' fit=' + remoteFitLabels[remoteFitMode]);
                }

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: W }, height: { ideal: H }, facingMode: 'user' },
                    audio: {
                        echoCancellation: btnStates.ecEnabled,
                        noiseSuppression: btnStates.nsEnabled,
                        autoGainControl: btnStates.agcEnabled
                    }
                });
                localVideo.srcObject = localStream;

                // Запрос к пиру: ТОЛЬКО MP кнопки, Fit НЕ влияет
                var mpxResult = applyMpx(W, H, btnStates.mpx);
                var dw = mpxResult.w;
                var dh = mpxResult.h;
                var myCodecs = detectSupportedCodecs();
                diagLog('CODECS supported: ' + myCodecs.map(codecDisplayName).join(' | '));

                var createResult = await tryCreateRoom(myCodecs, W, H, dw, dh);
                isCreator = createResult.created;
                diagLog('INIT peer=' + (isCreator ? 'host' : 'guest') + ' cam=' + W + 'x' + H);

                if (isCreator) {
                    myPeerID = 'host';
                    remotePeerID = 'guest';
                    waitingOverlay.classList.remove('hidden');
                    waitingText.textContent = 'Waiting for peer to join...';
                    var joined = await waitForPeer();
                    if (!joined) { showError('Peer did not join within 30 seconds'); return; }
                    if (joined.codec) {
                        negotiatedCodec = joined.codec;
                        diagLog('CODEC negotiated=' + codecDisplayName(negotiatedCodec));
                    }
                    if (joined.desiredW && joined.desiredH) {
                        diagLog('PEER wants ' + joined.desiredW + 'x' + joined.desiredH + ' from me');
                        await applyDesiredResolution(joined.desiredW, joined.desiredH);
                    } else if (joined.width && joined.height) {
                        await applyMinResolution(W, H, joined.width, joined.height);
                    }
                    waitingOverlay.classList.add('hidden');
                } else {
                    myPeerID = 'guest';
                    remotePeerID = 'host';
                    var joinResult = await joinRoom(myCodecs, W, H, dw, dh);
                    if (joinResult && joinResult.codec) {
                        negotiatedCodec = joinResult.codec;
                        diagLog('CODEC negotiated=' + codecDisplayName(negotiatedCodec));
                    }
                    if (joinResult && joinResult.desiredW && joinResult.desiredH) {
                        diagLog('PEER wants ' + joinResult.desiredW + 'x' + joinResult.desiredH + ' from me');
                        await applyDesiredResolution(joinResult.desiredW, joinResult.desiredH);
                    } else if (joinResult && joinResult.width && joinResult.height) {
                        await applyMinResolution(W, H, joinResult.width, joinResult.height);
                    }
                }
                startCall();
            } catch (err) {
                console.error('Init error:', err);
                if (err.name === 'NotAllowedError') showError('Camera and microphone access denied.');
                else if (err.name === 'NotFoundError') showError('No camera or microphone found.');
                else showError('Error: ' + err.message);
            }
        }

        // ============= API =============
        async function tryCreateRoom(codecs, width, height, desiredW, desiredH) {
            try {
                var resp = await fetch('/api/call/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room: roomID, codecs: codecs, width: width, height: height,
                        desiredW: desiredW || 0, desiredH: desiredH || 0
                    })
                });
                if (!resp.ok) return { created: false };
                var data = await resp.json();
                return { created: data.status === 'created' };
            } catch (e) { return { created: false }; }
        }

        async function waitForPeer() {
            try {
                var resp = await fetch('/api/call/wait?room=' + encodeURIComponent(roomID));
                if (!resp.ok) return false;
                var data = await resp.json();
                if (data.status === 'joined') return data;
                return false;
            } catch (e) { return false; }
        }

        async function joinRoom(codecs, width, height, desiredW, desiredH) {
            try {
                var resp = await fetch('/api/call/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room: roomID, codecs: codecs, width: width, height: height,
                        desiredW: desiredW || 0, desiredH: desiredH || 0
                    })
                });
                if (!resp.ok) return null;
                return await resp.json();
            } catch (e) { return null; }
        }

        async function sendChunk(buffer) {
            diagSentChunks++;
            diagSentBytes += buffer.byteLength;
            if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
                try { ws.send(buffer); } catch (e) {}
            }
        }

        async function checkPeerAlive() {
            try {
                var resp = await fetch('/api/call/alive?room=' + encodeURIComponent(roomID) +
                    '&peer=' + encodeURIComponent(remotePeerID));
                if (!resp.ok) return false;
                var data = await resp.json();
                return data.alive === true;
            } catch (e) { return false; }
        }

        async function endCall() {
            try { await fetch('/api/call/room?room=' + encodeURIComponent(roomID), { method: 'DELETE' }); } catch (e) {}
        }

        // ============= Разрешение =============
        async function applyDesiredResolution(dw, dh) {
            if (dw <= 0 || dh <= 0) return;
            var videoTracks = localStream.getVideoTracks();
            if (videoTracks.length === 0) return;
            try {
                await videoTracks[0].applyConstraints({ width: { ideal: dw }, height: { ideal: dh } });
                var s = videoTracks[0].getSettings();
                diagLog('RES applied peer desire ' + s.width + 'x' + s.height);
            } catch (e) { diagLog('RES desire failed: ' + e.message); }
        }

        var RES_TOLERANCE = 32;
        async function applyMinResolution(myW, myH, peerW, peerH) {
            var newW = Math.min(myW, peerW);
            var newH = Math.min(myH, peerH);
            if (myW - newW <= RES_TOLERANCE && myH - newH <= RES_TOLERANCE) return;
            if (newW < myW || newH < myH) {
                var vt = localStream.getVideoTracks();
                if (vt.length > 0) {
                    try {
                        await vt[0].applyConstraints({ width: { ideal: newW }, height: { ideal: newH } });
                        var s = vt[0].getSettings();
                        diagLog('RES applied ' + s.width + 'x' + s.height);
                    } catch (e) { diagLog('RES apply failed: ' + e.message); }
                }
            }
        }

        // ============= WebSocket =============
        function connectWS() {
            if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
            if (!isActive) return;
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsURL = proto + '//' + location.host + '/api/call/ws?room=' + encodeURIComponent(roomID) + '&peer=' + encodeURIComponent(myPeerID);
            diagLog('WS connecting...');
            try { ws = new WebSocket(wsURL); ws.binaryType = 'arraybuffer'; }
            catch (e) { diagLog('WS create error: ' + e.message); return; }
            ws.onopen = function() { wsConnected = true; diagLog('WS connected'); };
            ws.onmessage = function(event) {
                if (event.data instanceof ArrayBuffer) handleIncomingChunk(event.data);
            };
            ws.onclose = function(event) {
                wsConnected = false;
                diagLog('WS closed code=' + event.code);
                if (isActive) { wsReconnectTimer = setTimeout(function() { connectWS(); }, WS_RECONNECT_MS); }
            };
            ws.onerror = function() {};
        }

        function handleIncomingChunk(data) {
            diagRecvChunks++;
            diagRecvBytes += data.byteLength;
            lastReceivedIndex++;
            if (mseCriticalTriggered) return;
            mseQueue.push(data);
            if (mseReady) processMSEQueue();
        }

        function disconnectWS() {
            if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
            if (ws) {
                ws.onclose = null; ws.onerror = null; ws.onmessage = null;
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) ws.close();
                ws = null;
            }
            wsConnected = false;
        }

        // ============= Звонок =============
        function startCall() {
            isActive = true;
            setupMSE();
            setupMediaRecorder();
            connectWS();
            startAliveCheck();
        }

        // ============= MSE =============
        function setupMSE() {
            var codec = negotiatedCodec || detectCodec();
            mediaSource = new MediaSource();
            remoteVideo.src = URL.createObjectURL(mediaSource);
            mediaSource.addEventListener('sourceopen', function() {
                try {
                    sourceBuffer = mediaSource.addSourceBuffer(codec);
                    sourceBuffer.mode = 'sequence';
                    sourceBuffer.addEventListener('updateend', function() { onMSEUpdateEnd(); });
                    sourceBuffer.addEventListener('error', function() {
                        diagMSEErrors++;
                        diagLog('MSE ERROR sb error #' + diagMSEErrors);
                        checkMSECritical();
                    });
                    mseReady = true;
                    if (mseQueue.length > 0) processMSEQueue();
                } catch (e) { showError('MSE codec not supported: ' + codec); }
            });
        }

        function onMSEUpdateEnd() {
            if (firstAppendDone) {
                try {
                    if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                        var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                        var behind = bufEnd - remoteVideo.currentTime;
                        if (behind > 2.0) {
                            var target = bufEnd - 0.5;
                            remoteVideo.currentTime = target;
                            diagLog('PLAY catchup ct=' + target.toFixed(1) + ' behind=' + behind.toFixed(1) + 's');
                        }
                    }
                } catch(e) {}
            }
            if (!trimScheduled) {
                trimScheduled = true;
                setTimeout(function() { trimBuffer(); trimScheduled = false; }, 500);
            }
            processMSEQueue();
        }

        function processMSEQueue() {
            if (!mseReady || !sourceBuffer || sourceBuffer.updating) return;
            if (mseQueue.length === 0) return;
            var chunkData = mseQueue.shift();
            try {
                sourceBuffer.appendBuffer(new Uint8Array(chunkData));
                diagMSEAppends++;
                if (!firstAppendDone) {
                    firstAppendDone = true;
                    remoteVideo.play().catch(function(e) { diagLog('PLAY failed: ' + e.message); });
                    diagLog('PLAY starting...');
                }
            } catch (e) {
                diagMSEErrors++;
                diagLog('MSE ERR append ' + chunkData.byteLength + 'B: ' + e.message);
                checkMSECritical();
                if (!mseCriticalTriggered) processMSEQueue();
            }
        }

        function trimBuffer() {
            if (!sourceBuffer || sourceBuffer.updating) return;
            if (!remoteVideo.buffered || remoteVideo.buffered.length === 0) return;
            try {
                var buffered = remoteVideo.buffered;
                var bufferEnd = buffered.end(buffered.length - 1);
                var bufferStart = buffered.start(0);
                var bufferDuration = bufferEnd - bufferStart;
                if (bufferDuration > MAX_BUFFER_SECONDS) {
                    var removeEnd = bufferEnd - MAX_BUFFER_SECONDS;
                    if (removeEnd > bufferStart + 0.5) {
                        if (remoteVideo.currentTime < removeEnd) remoteVideo.currentTime = removeEnd + 0.1;
                        sourceBuffer.remove(bufferStart, removeEnd);
                    }
                }
            } catch (e) {}
        }

        function checkMSECritical() {
            if (mseCriticalTriggered) return;
            if (diagMSEErrors >= MSE_CRITICAL_THRESHOLD) {
                mseCriticalTriggered = true;
                diagLog('MSE CRITICAL — hiding remote video');
                mseQueue = [];
                if (btnStates.remoteVideoOn) remoteScreenBtn.click();
            }
        }

        // ============= MediaRecorder =============
        function setupMediaRecorder() {
            var videoTrack = localStream.getVideoTracks()[0];
            var settings = videoTrack ? videoTrack.getSettings() : {};
            var w = settings.width || 640;
            var h = settings.height || 480;

            var codec = negotiatedCodec || detectCodec();
            diagLog('REC codec=' + codecDisplayName(codec) + ' res=' + w + 'x' + h);

            try {
                mediaRecorder = new MediaRecorder(localStream, { mimeType: codec });
            } catch (e) {
                diagLog('REC with codec failed: ' + e.message + ', trying without');
                try { mediaRecorder = new MediaRecorder(localStream, {}); }
                catch (e2) { showError('MediaRecorder not supported: ' + e2.message); return; }
            }
            mediaRecorder.ondataavailable = function(e) {
                if (e.data && e.data.size > 0 && isActive) {
                    e.data.arrayBuffer().then(function(buffer) { sendChunk(buffer); });
                }
            };
            var recErrorCount = 0;
            mediaRecorder.onerror = function(e) {
                recErrorCount++;
                diagLog('REC error #' + recErrorCount + ': ' + (e.error ? e.error.message : 'unknown'));
                if (recErrorCount >= 3 && videoEnabled) camBtn.click();
            };
            mediaRecorder.start(CHUNK_INTERVAL_MS);
        }

        // ============= Проверка активности =============
        function startAliveCheck() {
            aliveInterval = setInterval(function() {
                if (!isActive) return;
                checkPeerAlive().then(function(alive) { if (!alive && isActive) hangup(); });
            }, ALIVE_CHECK_MS);
        }

        // ============= PiP кнопки =============
        micBtn.addEventListener('click', function() {
            if (!localStream) return;
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks().forEach(function(t) { t.enabled = audioEnabled; });
            micBtn.classList.toggle('off', !audioEnabled);
            updatePipControlsVisibility();
        });
        camBtn.addEventListener('click', function() {
            if (!localStream) return;
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks().forEach(function(t) { t.enabled = videoEnabled; });
            camBtn.classList.toggle('off', !videoEnabled);
            updatePipControlsVisibility();
        });
        function updatePipControlsVisibility() {
            var pc = document.getElementById('pipControls');
            if (micBtn.classList.contains('off') || camBtn.classList.contains('off')) pc.classList.add('has-off');
            else pc.classList.remove('has-off');
        }

        // ============= Сохранение состояния =============
        function saveCallState() {
            if (remoteNativeW > 0 && remoteNativeH > 0) {
                localStorage.setItem('vc_peerW', remoteNativeW);
                localStorage.setItem('vc_peerH', remoteNativeH);
            }
            localStorage.setItem('vc_fitMode', remoteFitMode);
            localStorage.setItem('vc_btnStates', JSON.stringify(btnStates));
        }

        function hangup() {
            isActive = false;
            saveCallState();
            disconnectWS();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (aliveInterval) { clearInterval(aliveInterval); aliveInterval = null; }
            if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
            mseReady = false;
            mseQueue = [];
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch (e) {}
            }
            endCall();
            setTimeout(function() { window.close(); }, 1500);
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        window.addEventListener('beforeunload', function() {
            isActive = false;
            saveCallState();
            disconnectWS();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
            endCall();
        });
    </script>
</body>
</html>
