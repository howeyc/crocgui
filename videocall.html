<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .videos {
            flex: 1;
            display: flex;
            position: relative;
            padding: 8px;
            gap: 8px;
            min-height: 0;
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .remote-controls {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
        }
        @media (hover: hover) {
            .video-container:hover > .remote-controls,
            .remote-controls.has-off {
                opacity: 1;
            }
        }
        @media (hover: none), (max-width: 600px) {
            .remote-controls {
                opacity: 1;
            }
        }
        .ctrl-btn.speaker { background: #4ecca3; }
        .ctrl-btn.speaker.off { background: #e94560; }
        .ctrl-btn.fullscreen { background: #4ecca3; }
        .ctrl-btn.fullscreen.off { background: #e94560; }
        .ctrl-btn.screen { background: #4ecca3; }
        .ctrl-btn.screen.off { background: #e94560; }
        .audio-controls {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 4px;
            z-index: 15;
        }
        .audio-controls.show {
            display: flex;
            opacity: 0;
            transition: opacity 0.3s;
        }
        @media (hover: hover) {
            .video-container:hover > .audio-controls.show,
            .audio-controls.show.has-off {
                opacity: 1;
            }
        }
        @media (hover: none), (max-width: 600px) {
            .audio-controls.show {
                opacity: 1;
            }
        }
        .ctrl-btn.ec { background: #4ecca3; }
        .ctrl-btn.ec.off { background: #e94560; }
        .ctrl-btn.ns { background: #4ecca3; }
        .ctrl-btn.ns.off { background: #e94560; }
        .ctrl-btn.agc { background: #4ecca3; }
        .ctrl-btn.agc.off { background: #e94560; }
        .pip-container {
            position: absolute;
            width: 240px;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 20;
            cursor: pointer;
            transition: top 0.3s ease, bottom 0.3s ease, left 0.3s ease, right 0.3s ease;
        }
        .pip-container.pip-br { bottom: 12px; right: 12px; top: auto; left: auto; }
        .pip-container.pip-bl { bottom: 12px; left: 12px; top: auto; right: auto; }
        .pip-container.pip-tl { top: 12px; left: 12px; bottom: auto; right: auto; }
        .pip-container.pip-tr { top: 12px; right: 12px; bottom: auto; left: auto; }
        .pip-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .waiting-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .waiting-overlay.hidden { display: none; }
        .waiting-spinner {
            width: 48px; height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-text { color: #aaa; font-size: 1em; }
        .pip-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 4px;
            background: rgba(0,0,0,0.5);
            z-index: 25;
            opacity: 0;
            transition: opacity 0.3s;
        }
        @media (hover: hover) {
            .pip-container:hover .pip-controls,
            .pip-controls.has-off {
                opacity: 1;
            }
        }
        @media (hover: none), (max-width: 600px) {
            .pip-controls {
                opacity: 1;
            }
        }
        .ctrl-btn {
            height: 28px;
            width: 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.75em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
        }
        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.mic { background: #4ecca3; }
        .ctrl-btn.mic.off { background: #e94560; }
        .ctrl-btn.cam { background: #4ecca3; }
        .ctrl-btn.cam.off { background: #e94560; }
        .ctrl-btn.hangup { background: #4ecca3; }
        .ctrl-btn.hangup:hover { background: #3db892; }
        .error-banner {
            background: #e94560;
            color: white;
            padding: 12px;
            text-align: center;
            display: none;
        }
        .error-banner.show { display: block; }
        @media (max-height: 500px) {
            .pip-container { width: 160px; height: 120px; }
            .ctrl-btn { height: 22px; width: 22px; font-size: 0.6em; }
        }
        @media (max-width: 600px) {
            .pip-container { width: 30%; height: auto; aspect-ratio: 4/3; min-width: 80px; }
            .ctrl-btn { height: 36px; width: 36px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="error-banner" id="errorBanner"></div>
    <div class="videos">
        <div class="video-container main-video">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="remote-controls" id="remoteControls">
                <button class="ctrl-btn speaker" id="remoteMuteBtn" title="Remote Audio">🔈</button>
                <button class="ctrl-btn fullscreen off" id="fullscreenBtn" title="Fullscreen">⬚</button>
                <button class="ctrl-btn screen" id="remoteScreenBtn" title="Remote Video">💻</button>
            </div>
            <div class="audio-controls" id="audioControls">
                <button class="ctrl-btn ec" id="ecBtn" title="Echo Cancellation">EC</button>
                <button class="ctrl-btn ns" id="nsBtn" title="Noise Suppression">NS</button>
                <button class="ctrl-btn agc" id="agcBtn" title="Auto Gain Control">AGC</button>
            </div>
            <div class="waiting-overlay hidden" id="waitingOverlay">
                <div class="waiting-spinner"></div>
                <div class="waiting-text" id="waitingText">Waiting for peer...</div>
            </div>
            <div class="pip-container pip-tl" id="pipContainer">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="pip-controls" id="pipControls">
                    <button class="ctrl-btn mic" id="micBtn" title="Mic">🎤</button>
                    <button class="ctrl-btn hangup" id="hangupBtn" title="Close">❌</button>
                    <button class="ctrl-btn cam" id="camBtn" title="Cam">📷</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============= Конфигурация =============
        var CHUNK_INTERVAL_MS = 100;   // Интервал отправки чанков MediaRecorder (мс)
        var MAX_BUFFER_SECONDS = 30;   // Максимальный буфер MSE (большой = нет агрессивного trim)
        var ALIVE_CHECK_MS = 3000;     // Интервал проверки активности пира
        var WS_RECONNECT_MS = 2000;    // Интервал переподключения WebSocket

        // ============= Элементы UI =============
        var localVideo = document.getElementById('localVideo');
        var remoteVideo = document.getElementById('remoteVideo');
        var waitingOverlay = document.getElementById('waitingOverlay');
        var waitingText = document.getElementById('waitingText');
        var errorBanner = document.getElementById('errorBanner');
        var micBtn = document.getElementById('micBtn');
        var camBtn = document.getElementById('camBtn');
        var hangupBtn = document.getElementById('hangupBtn');
        var remoteMuteBtn = document.getElementById('remoteMuteBtn');
        var remoteScreenBtn = document.getElementById('remoteScreenBtn');
        var fullscreenBtn = document.getElementById('fullscreenBtn');
        var ecBtn = document.getElementById('ecBtn');
        var nsBtn = document.getElementById('nsBtn');
        var agcBtn = document.getElementById('agcBtn');

        var _chatUserId = localStorage.getItem('chatUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatUserId', _chatUserId);

        // ============= Состояние =============
        var params = new URLSearchParams(window.location.search);
        var roomID = params.get('room') || '';
        var isActive = false;
        var localStream = null;
        var mediaRecorder = null;
        var aliveInterval = null;
        var isCreator = false;
        var audioEnabled = true;
        var videoEnabled = true;

        var myPeerID = 'host';
        var remotePeerID = 'guest';
        var lastReceivedIndex = -1;

        // WebSocket состояние
        var ws = null;
        var wsConnected = false;
        var wsReconnectTimer = null;

        // MSE состояние
        var mediaSource = null;
        var sourceBuffer = null;
        var mseQueue = [];
        var mseReady = false;
        var negotiatedCodec = '';
        var trimScheduled = false;
        var firstAppendDone = false;

        // Диагностика
        var diagSentChunks = 0;
        var diagSentBytes = 0;
        var diagRecvChunks = 0;
        var diagRecvBytes = 0;
        var diagMSEAppends = 0;
        var diagMSEErrors = 0;
        var diagLastLogTime = 0;

        var remoteAudioOn = true;
        // Показываем EC/NS/AGC т.к. 🔊 включён
        document.getElementById('audioControls').classList.add('show');
        var remoteVideoOn = true;
        var ecEnabled = true;
        var nsEnabled = true;
        var agcEnabled = true;

        // PiP
        var pipCorners = ['pip-br', 'pip-bl', 'pip-tl', 'pip-tr'];
        var pipCorner = 2;
        var pipContainer = document.getElementById('pipContainer');
        pipContainer.addEventListener('click', function(e) {
            if (e.target.closest('.pip-controls')) return;
            pipCorner = (pipCorner + 1) % pipCorners.length;
            pipCorners.forEach(function(c) { pipContainer.classList.remove(c); });
            pipContainer.classList.add(pipCorners[pipCorner]);
        });

        // Fullscreen
        function enterFullscreen() {
            var el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }
        function exitFullscreen() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        fullscreenBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (document.fullscreenElement || document.webkitFullscreenElement) exitFullscreen();
            else enterFullscreen();
        });
        function syncFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) fullscreenBtn.classList.remove('off');
            else fullscreenBtn.classList.add('off');
        }
        document.addEventListener('fullscreenchange', syncFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', syncFullscreenBtn);

        // Remote controls
        remoteMuteBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            remoteAudioOn = !remoteAudioOn;
            remoteVideo.muted = !remoteAudioOn;
            remoteMuteBtn.classList.toggle('off', !remoteAudioOn);
            remoteMuteBtn.textContent = '🔈';
            document.getElementById('audioControls').classList.toggle('show', remoteAudioOn);
            updateRemoteControlsVisibility();
        });
        remoteScreenBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            remoteVideoOn = !remoteVideoOn;
            remoteVideo.style.visibility = remoteVideoOn ? 'visible' : 'hidden';
            remoteScreenBtn.classList.toggle('off', !remoteVideoOn);
            remoteScreenBtn.textContent = '💻';
            updateRemoteControlsVisibility();
        });
        function updateRemoteControlsVisibility() {
            var rc = document.getElementById('remoteControls');
            if (remoteMuteBtn.classList.contains('off') || remoteScreenBtn.classList.contains('off')) rc.classList.add('has-off');
            else rc.classList.remove('has-off');
            var ac = document.getElementById('audioControls');
            if (ecBtn.classList.contains('off') || nsBtn.classList.contains('off') || agcBtn.classList.contains('off')) ac.classList.add('has-off');
            else ac.classList.remove('has-off');
        }

        // Audio constraints toggles (EC/NS/AGC)
        function toggleAudioConstraint(prop, btn, enabled) {
            if (!localStream) return enabled;
            var tracks = localStream.getAudioTracks();
            if (tracks.length === 0) return enabled;
            var newVal = !enabled;
            try {
                var constraints = {};
                constraints[prop] = newVal;
                tracks[0].applyConstraints({ advanced: [constraints] });
                btn.classList.toggle('off', !newVal);
                updateRemoteControlsVisibility();
                return newVal;
            } catch (e) {
                diagLog(prop + ' toggle failed: ' + e.message);
                return enabled;
            }
        }
        ecBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            ecEnabled = toggleAudioConstraint('echoCancellation', ecBtn, ecEnabled);
        });
        nsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            nsEnabled = toggleAudioConstraint('noiseSuppression', nsBtn, nsEnabled);
        });
        agcBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            agcEnabled = toggleAudioConstraint('autoGainControl', agcBtn, agcEnabled);
        });

        if (!roomID) {
            showError('No room ID specified. URL: /videocall.html?room=ROOM_ID');
        } else {
            init();
        }

        // ============= Диагностика =============
        function diagLog(msg) {
            try {
                fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: '🔧 ' + msg, sender: _chatUserId })
                });
            } catch (e) {}
        }

        function diagStats() {
            if (!isActive) return;
            var bufInfo = 'none';
            try {
                if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                    var s = remoteVideo.buffered.start(0);
                    var e = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                    bufInfo = (e - s).toFixed(1) + 's [' + s.toFixed(1) + '-' + e.toFixed(1) + ']';
                }
            } catch (e) {}
            var sbState = sourceBuffer ? (sourceBuffer.updating ? 'updating' : 'ready') : 'null';
            var ct = remoteVideo.currentTime.toFixed(1);
            var rate = remoteVideo.playbackRate.toFixed(2);
            var paused = remoteVideo.paused ? ' PAUSED' : '';
            var waiting = remoteVideo.readyState < 3 ? ' WAITING' : '';
            var transport = wsConnected ? 'WS' : 'reconnecting';
            diagLog('STAT sent:' + (diagSentBytes / 1024).toFixed(0) + 'KB' +
                ' recv:' + (diagRecvBytes / 1024).toFixed(0) + 'KB' +
                ' appends:' + diagMSEAppends + ' errs:' + diagMSEErrors +
                ' buf:' + bufInfo + ' ct:' + ct + ' [' + transport + ']' + paused + waiting);
        }
        setInterval(function() { diagStats(); }, 30000);

        // ============= Экстренный seek (только при >8с отставания) =============
        setInterval(function() {
            if (!isActive || !mseReady) return;
            try {
                if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                    var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                    var bufStart = remoteVideo.buffered.start(0);
                    var ct = remoteVideo.currentTime;
                    var behind = bufEnd - ct;

                    // Экстренный seek: только если отставание > 8 секунд
                    if (behind > 8) {
                        var target = bufEnd - 1;
                        diagLog('SEEK ct=' + ct.toFixed(1) + ' -> ' + target.toFixed(1) + ' behind=' + behind.toFixed(1) + 's EMERGENCY');
                        remoteVideo.currentTime = target;
                        if (remoteVideo.paused) remoteVideo.play().catch(function(){});
                    }

                    // Если currentTime вне буфера — прыгнуть
                    if (ct < bufStart - 0.5) {
                        remoteVideo.currentTime = bufStart + 0.1;
                        if (remoteVideo.paused) remoteVideo.play().catch(function(){});
                    }
                }
            } catch (e) {}
        }, 2000);

        // ============= Кодеки =============
        var ALL_CODECS = [
            // H.264 — аппаратное кодирование (приоритет, WebM контейнер)
            'video/webm;codecs="h264,opus"',               // Chrome/Edge/Android: H.264 HW + Opus
            // VP8/VP9 — программное кодирование (fallback)
            'video/webm;codecs="vp8,opus"',
            'video/webm;codecs="vp9,opus"',
            'video/webm'
        ];

        function detectSupportedCodecs() {
            var supported = [];
            for (var i = 0; i < ALL_CODECS.length; i++) {
                var c = ALL_CODECS[i];
                if (MediaSource.isTypeSupported(c) &&
                    (typeof MediaRecorder === 'undefined' || MediaRecorder.isTypeSupported(c))) {
                    supported.push(c);
                }
            }
            if (supported.length === 0) supported.push('video/webm;codecs="vp8,opus"');
            return supported;
        }

        function detectCodec() {
            var codecs = ALL_CODECS.slice();
            for (var i = 0; i < codecs.length; i++) {
                if (MediaSource.isTypeSupported(codecs[i]) &&
                    (typeof MediaRecorder === 'undefined' || MediaRecorder.isTypeSupported(codecs[i]))) {
                    return codecs[i];
                }
            }
            return 'video/webm;codecs="vp8,opus"';
        }

        // ============= Инициализация =============
        async function init() {
            try {
                var W = Math.min(Math.floor(window.innerWidth * 0.8), 1280);
                var H = Math.min(Math.floor(W * 3 / 4), 720);

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: W }, height: { ideal: H }, facingMode: 'user' },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                localVideo.srcObject = localStream;

                var myCodecs = detectSupportedCodecs();
                diagLog('CODECS supported: ' + myCodecs.join(' | '));

                var createResult = await tryCreateRoom(myCodecs, W, H);
                isCreator = createResult.created;

                diagLog('INIT peer=' + (isCreator ? 'host' : 'guest') + ' cam=' + W + 'x' + H);

                if (isCreator) {
                    myPeerID = 'host';
                    remotePeerID = 'guest';
                    waitingOverlay.classList.remove('hidden');
                    waitingText.textContent = 'Waiting for peer to join...';
                    var joined = await waitForPeer();
                    if (!joined) {
                        showError('Peer did not join within 30 seconds');
                        return;
                    }
                    if (joined.codec) {
                        negotiatedCodec = joined.codec;
                        diagLog('CODEC negotiated=' + negotiatedCodec);
                    }
                    if (joined.width && joined.height) {
                        await applyMinResolution(W, H, joined.width, joined.height);
                    }
                    waitingOverlay.classList.add('hidden');
                } else {
                    myPeerID = 'guest';
                    remotePeerID = 'host';
                    var joinResult = await joinRoom(myCodecs, W, H);
                    if (joinResult && joinResult.codec) {
                        negotiatedCodec = joinResult.codec;
                        diagLog('CODEC negotiated=' + negotiatedCodec);
                    }
                    if (joinResult && joinResult.width && joinResult.height) {
                        await applyMinResolution(W, H, joinResult.width, joinResult.height);
                    }
                }

                startCall();
            } catch (err) {
                console.error('Init error:', err);
                if (err.name === 'NotAllowedError') showError('Camera and microphone access denied.');
                else if (err.name === 'NotFoundError') showError('No camera or microphone found.');
                else showError('Error: ' + err.message);
            }
        }

        // ============= API =============
        async function tryCreateRoom(codecs, width, height) {
            try {
                var resp = await fetch('/api/call/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID, codecs: codecs, width: width, height: height })
                });
                if (!resp.ok) return { created: false };
                var data = await resp.json();
                return { created: data.status === 'created' };
            } catch (e) {
                return { created: false };
            }
        }

        async function waitForPeer() {
            try {
                var resp = await fetch('/api/call/wait?room=' + encodeURIComponent(roomID));
                if (!resp.ok) return false;
                var data = await resp.json();
                if (data.status === 'joined') return data;
                return false;
            } catch (e) {
                return false;
            }
        }

        async function joinRoom(codecs, width, height) {
            try {
                var resp = await fetch('/api/call/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID, codecs: codecs, width: width, height: height })
                });
                if (!resp.ok) return null;
                return await resp.json();
            } catch (e) {
                return null;
            }
        }

        // Отправка чанка через WebSocket
        async function sendChunk(buffer) {
            diagSentChunks++;
            diagSentBytes += buffer.byteLength;

            if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(buffer);
                } catch (e) {
                    console.warn('WS send error:', e);
                }
            }
        }

        async function checkPeerAlive() {
            try {
                var resp = await fetch('/api/call/alive?room=' + encodeURIComponent(roomID) +
                    '&peer=' + encodeURIComponent(remotePeerID));
                if (!resp.ok) return false;
                var data = await resp.json();
                return data.alive === true;
            } catch (e) {
                return false;
            }
        }

        async function endCall() {
            try {
                await fetch('/api/call/room?room=' + encodeURIComponent(roomID), { method: 'DELETE' });
            } catch (e) {}
        }

        // ============= Адаптивное разрешение =============
        async function applyMinResolution(myW, myH, peerW, peerH) {
            var newW = Math.min(myW, peerW);
            var newH = Math.min(myH, peerH);
            diagLog('RES min(' + myW + 'x' + myH + ', ' + peerW + 'x' + peerH + ') = ' + newW + 'x' + newH);
            if (newW < myW || newH < myH) {
                var videoTracks = localStream.getVideoTracks();
                if (videoTracks.length > 0) {
                    try {
                        await videoTracks[0].applyConstraints({ width: { ideal: newW }, height: { ideal: newH } });
                        var settings = videoTracks[0].getSettings();
                        diagLog('RES applied ' + settings.width + 'x' + settings.height);
                    } catch (e) {
                        diagLog('RES apply failed: ' + e.message);
                    }
                }
            }
        }

        // ============= WebSocket Transport =============
        function connectWS() {
            if (wsReconnectTimer) {
                clearTimeout(wsReconnectTimer);
                wsReconnectTimer = null;
            }
            if (!isActive) return;

            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsURL = proto + '//' + location.host + '/api/call/ws?room=' + encodeURIComponent(roomID) + '&peer=' + encodeURIComponent(myPeerID);

            diagLog('WS connecting...');
            try {
                ws = new WebSocket(wsURL);
                ws.binaryType = 'arraybuffer';
            } catch (e) {
                diagLog('WS create error: ' + e.message);
                return;
            }

            ws.onopen = function() {
                wsConnected = true;
                diagLog('WS connected');
            };

            ws.onmessage = function(event) {
                if (event.data instanceof ArrayBuffer) {
                    handleIncomingChunk(event.data);
                }
            };

            ws.onclose = function(event) {
                wsConnected = false;
                diagLog('WS closed code=' + event.code);
                if (isActive) {
                    // Переподключение через 2 секунды
                    wsReconnectTimer = setTimeout(function() {
                        connectWS();
                    }, WS_RECONNECT_MS);
                }
            };

            ws.onerror = function(err) {
                console.warn('WS error');
                // onclose будет вызван после onerror
            };
        }

        function handleIncomingChunk(data) {
            diagRecvChunks++;
            diagRecvBytes += data.byteLength;
            lastReceivedIndex++;
            mseQueue.push(data);
            if (mseReady) {
                processMSEQueue();
            }
        }

        function disconnectWS() {
            if (wsReconnectTimer) {
                clearTimeout(wsReconnectTimer);
                wsReconnectTimer = null;
            }
            if (ws) {
                ws.onclose = null;
                ws.onerror = null;
                ws.onmessage = null;
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                    ws.close();
                }
                ws = null;
            }
            wsConnected = false;
        }

        // ============= Звонок =============
        function startCall() {
            isActive = true;
            setupMSE();
            setupMediaRecorder();
            connectWS();
            startAliveCheck();
        }

        // ============= MSE =============
        function setupMSE() {
            var codec = negotiatedCodec || detectCodec();
            mediaSource = new MediaSource();
            remoteVideo.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener('sourceopen', function() {
                try {
                    sourceBuffer = mediaSource.addSourceBuffer(codec);
                    sourceBuffer.mode = 'sequence';

                    sourceBuffer.addEventListener('updateend', function() {
                        onMSEUpdateEnd();
                    });
                    sourceBuffer.addEventListener('error', function(e) {
                        diagMSEErrors++;
                        diagLog('MSE ERROR sb error');
                    });

                    mseReady = true;
                    if (mseQueue.length > 0) processMSEQueue();
                } catch (e) {
                    showError('MSE codec not supported: ' + codec);
                }
            });
        }

        function onMSEUpdateEnd() {
            if (!trimScheduled) {
                trimScheduled = true;
                setTimeout(function() {
                    trimBuffer();
                    trimScheduled = false;
                }, 500); // чаще чем было (1000)
            }
            processMSEQueue();
        }

        function processMSEQueue() {
            if (!mseReady || !sourceBuffer || sourceBuffer.updating) return;
            if (mseQueue.length === 0) return;

            var chunkData = mseQueue.shift();
            try {
                sourceBuffer.appendBuffer(new Uint8Array(chunkData));
                diagMSEAppends++;

                if (!firstAppendDone) {
                    firstAppendDone = true;
                    remoteVideo.play().then(function() {
                        // На первом play — прыгнуть к live edge
                        try {
                            if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                                var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                                var target = Math.max(bufEnd - 0.3, remoteVideo.buffered.start(0) + 0.1);
                                if (target > remoteVideo.currentTime + 0.5) {
                                    remoteVideo.currentTime = target;
                                }
                            }
                        } catch(e) {}
                        diagLog('PLAY started ct=' + remoteVideo.currentTime.toFixed(1));
                    }).catch(function(e) {
                        diagLog('PLAY failed: ' + e.message);
                    });
                }
            } catch (e) {
                diagMSEErrors++;
                diagLog('MSE ERR append ' + chunkData.byteLength + 'B: ' + e.message);
                processMSEQueue();
            }
        }

        function trimBuffer() {
            if (!sourceBuffer || sourceBuffer.updating) return;
            if (!remoteVideo.buffered || remoteVideo.buffered.length === 0) return;
            try {
                var buffered = remoteVideo.buffered;
                var bufferEnd = buffered.end(buffered.length - 1);
                var bufferStart = buffered.start(0);
                var bufferDuration = bufferEnd - bufferStart;

                if (bufferDuration > MAX_BUFFER_SECONDS) {
                    var removeEnd = bufferEnd - MAX_BUFFER_SECONDS;
                    if (removeEnd > bufferStart + 0.5) {
                        if (remoteVideo.currentTime < removeEnd) {
                            remoteVideo.currentTime = removeEnd + 0.1;
                        }
                        sourceBuffer.remove(bufferStart, removeEnd);
                    }
                }
            } catch (e) {}
        }

        // ============= MediaRecorder =============
        function setupMediaRecorder() {
            var codec = negotiatedCodec || detectCodec();
            try {
                mediaRecorder = new MediaRecorder(localStream, {
                    mimeType: codec,
                    videoBitsPerSecond: 300000
                });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(localStream, {
                        videoBitsPerSecond: 300000
                    });
                } catch (e2) {
                    showError('MediaRecorder not supported: ' + e2.message);
                    return;
                }
            }

            mediaRecorder.ondataavailable = function(e) {
                if (e.data && e.data.size > 0 && isActive) {
                    e.data.arrayBuffer().then(function(buffer) {
                        sendChunk(buffer);
                    });
                }
            };
            mediaRecorder.onerror = function(e) {
                console.error('MediaRecorder error:', e.error);
            };
            mediaRecorder.start(CHUNK_INTERVAL_MS);
        }

        // ============= Проверка активности пира =============
        function startAliveCheck() {
            aliveInterval = setInterval(function() {
                if (!isActive) return;
                checkPeerAlive().then(function(alive) {
                    if (!alive && isActive) {
                        hangup();
                    }
                });
            }, ALIVE_CHECK_MS);
        }

        // ============= Управление =============
        micBtn.addEventListener('click', function() {
            if (!localStream) return;
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks().forEach(function(t) { t.enabled = audioEnabled; });
            micBtn.classList.toggle('off', !audioEnabled);
            micBtn.textContent = '🎤';
            updateControlsVisibility();
        });

        camBtn.addEventListener('click', function() {
            if (!localStream) return;
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks().forEach(function(t) { t.enabled = videoEnabled; });
            camBtn.classList.toggle('off', !videoEnabled);
            camBtn.textContent = videoEnabled ? '📷' : '📷';
            updateControlsVisibility();
        });

        hangupBtn.addEventListener('click', function() { hangup(); });

        function updateControlsVisibility() {
            var pc = document.getElementById('pipControls');
            if (micBtn.classList.contains('off') || camBtn.classList.contains('off')) pc.classList.add('has-off');
            else pc.classList.remove('has-off');
        }

        function hangup() {
            isActive = false;

            disconnectWS();

            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (aliveInterval) { clearInterval(aliveInterval); aliveInterval = null; }
            if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });

            mseReady = false;
            mseQueue = [];
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch (e) {}
            }

            endCall();
            setTimeout(function() { window.close(); }, 1500);
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        window.addEventListener('beforeunload', function() {
            isActive = false;
            disconnectWS();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
            endCall();
        });
    </script>
</body>
</html>
