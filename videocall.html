                if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                    var s = remoteVideo.buffered.start(0);
                    var e = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                    bufInfo = (e - s).toFixed(1) + 's [' + s.toFixed(1) + '-' + e.toFixed(1) + ']';
                }
            } catch (e) {}
            var ct = remoteVideo.currentTime.toFixed(1);
            var paused = remoteVideo.paused ? ' PAUSED' : '';
            var waiting = remoteVideo.readyState < 3 ? ' WAITING' : '';
            diagLog('STAT sent:' + (diagSentBytes / 1024).toFixed(0) + 'KB' +
                ' recv:' + (diagRecvBytes / 1024).toFixed(0) + 'KB/' + diagMSEAppends +
                ' errs:' + diagMSEErrors +
                ' buf:' + bufInfo + ' ' + ct + paused + waiting +
                ' [' + BUST.toFixed(3) + '~' + SLOMO.toFixed(3) + ']' +
                ' ' + currentBehind.toFixed(3));
        }
        setInterval(function() { diagStats(); }, 30000);

        // ============= Экстренный seek + линейный rate контроль =============
        function doRateControl() {
            if (!isActive || !mseReady || _tabWasHidden) return;
            try {
                if (remoteVideo.buffered && remoteVideo.buffered.length > 0) {
                    var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
                    var bufStart = remoteVideo.buffered.start(0);
                    var ct = remoteVideo.currentTime;
                    var rawBehind = bufEnd - ct;
                    var behind = Math.max(BEHIND_MIN, rawBehind);
                    currentBehind = behind;
                    var now = Date.now();
                    var isStalled = remoteVideo.readyState < 3;

                    // EWMA от rawBehind — пропускаем stall, отрицательные (нет данных) и скрытую вкладку
                    if (!isStalled && rawBehind > 0 && !_tabWasHidden) {
                        if (behindEwma === 0) {
                            behindEwma = rawBehind;
                            deviationEwma = 0;
                        } else {
                            behindEwma = behindEwma + BEHIND_EWMA_ALPHA * (rawBehind - behindEwma);
                            var dev = Math.abs(rawBehind - behindEwma);
                            deviationEwma = deviationEwma + DEVIATION_EWMA_ALPHA * (dev - deviationEwma);
                        }
                    }

                    // Адаптивный BUST/SLOMO через EWMA behind/deviation
                    if (adaptiveBust) {
                        if (behindEwma > 0 && !isStalled) {
                            var zoneHalf = Math.max(K_EWMA_ZONES * deviationEwma, MIN_ZONE_HALF);
                            SLOMO = Math.max(BEHIND_MIN / (RATE_MIN * RATE_MIN), behindEwma - zoneHalf);
                            BUST = behindEwma + zoneHalf;
                            EMERGENCY_BEHIND += EMERGENCY_ALPHA * (BUST * 2 - EMERGENCY_BEHIND);
                        }
                        // else: используем предыдущие/начальные значения SLOMO/BUST
                    } else {
                        BUST = manualBUST;
                        SLOMO = manualSLOMO;
                        EMERGENCY_BEHIND += EMERGENCY_ALPHA * (BUST * 2 - EMERGENCY_BEHIND);
                    }

                    // Периодический лог статистики гистерезиса (EWMA behind/deviation для оценки)
                    if (now - _lastHystLogTime == HYST_LOG_INTERVAL_MS) {
                        diagLog('HYST raw=' + rawBehind.toFixed(3) +
                            ' behind=' + behind.toFixed(3) +
                            ' ewmaB=' + behindEwma.toFixed(3) +
                            ' ewmaD=' + deviationEwma.toFixed(3) +
                            ' rate=' + remoteVideo.playbackRate.toFixed(2) +
                            ' SLOMO=' + SLOMO.toFixed(3) +
                            ' BUST=' + BUST.toFixed(3) +
                            ' EMER=' + EMERGENCY_BEHIND.toFixed(3) +
                            ' stall=' + (isStalled ? 1 : 0));
                        _lastHystLogTime = now;
                    }

                    // 3. Трёхзонный playbackRate: торможение / 1.0 / разгон
                    if (firstAppendDone) {
                        var newRate;
                        if (behind <= SLOMO) {
                            // Зона торможения: экспоненциальный контроллер (√), мягче при малом behind
                            newRate = Math.max(RATE_MIN, Math.sqrt(behind / SLOMO));
                        } else if (behind <= BUST) {
                            // Зона стабильная: мягкий догон от 1.0 (у SLOMO) до 1.0+SOFT_CATCHUP (у BUST)
                            newRate = 1.0 + SOFT_CATCHUP * (behind - SLOMO) / (BUST - SLOMO);
                        } else {
                            // Зона разгона: экспоненциальный контроллер, max RATE_MAX
                            // √(excess/BUST) даёт 3× больше ускорения при малом превышении BUST
                            var excess = (behind - BUST) / BUST;
                            newRate = Math.min(RATE_MAX, 1.0 + Math.sqrt(excess) * (RATE_MAX - 1.0));
                        }
                        remoteVideo.playbackRate = newRate;
                    }
                    // Общая точка seek: середина гистерезиса (SLOMO+BUST)/2
                    var midHyst = (SLOMO + BUST) / 2;
                    var safeTarget = bufEnd - midHyst;
                    if (safeTarget <= bufStart) safeTarget = bufEnd - BEHIND_MIN;  // fallback при малом буфере

                    // 1. Stall seek: каждый тик сикаем на предполагаемое время
                    if (SS && isStalled) {
                        if (stallStartWallTime === 0) {
                            stallStartWallTime = now;
                            stallStartCt = ct;
                        }
                        var elapsed = (now - stallStartWallTime) / 1000;
                        var expected = stallStartCt + elapsed;
                        if (expected > ct && expected <= safeTarget) {
                            remoteVideo.currentTime = expected;
                            remoteVideo.play().catch(function(){});
                            if (now - lastStallLogTime > 1000) {
                                diagLog('ADAPTIVE STALL seek ct=' + ct.toFixed(1) + ' -> ' + expected.toFixed(1) + ' behind=' + behind.toFixed(1) + 's chunk=' + lastChunkSize);
                                lastStallLogTime = now;
                            }
                        }
                    } else {
                        stallStartWallTime = 0;
                        stallStartCt = 0;
                    }
                    // 4. currentTime вышел за начало буфера
                    if (ct < bufStart - BUF_START_THRESHOLD ) {
                        if (safeTarget > bufStart) {
                            diagLog('ADAPTIVE BUF-START seek ct=' + ct.toFixed(1) + ' -> ' + safeTarget.toFixed(1) +
                                ' buf=[' + bufStart.toFixed(1) + '-' + bufEnd.toFixed(1) + ']');
                            remoteVideo.currentTime = safeTarget;
                            remoteVideo.playbackRate = 1.0;
                            if (remoteVideo.paused) remoteVideo.play().catch(function(){});
                        }
                    } else
                    // 2. Emergency seek при большом отставании (страховка от неконтролируемого роста лага)
                    // Работает и при stall — иначе stall + behind > EMERGENCY = дедлок
                    if (behind > EMERGENCY_BEHIND) {
                        diagLog('ADAPTIVE EMERGENCY seek ct=' + ct.toFixed(1) + ' -> ' + safeTarget.toFixed(1) +
                            ' behind=' + behind.toFixed(1) + 's' +
                            ' stall=' + (isStalled ? 1 : 0));
                        remoteVideo.currentTime = safeTarget;
                        remoteVideo.playbackRate = 1.0;
                        if (remoteVideo.paused) remoteVideo.play().catch(function(){});
                    }
                }
            } catch (e) {}
        }

        // ============= Обновление метки задержки (раз в секунду) =============
        setInterval(function() {
            if (currentBehind > 0) {
                var _lt = currentBehind >= 1 ? currentBehind.toFixed(2) : currentBehind.toFixed(1);
                if (currentBehind < 1 && _lt.charAt(0) === '0') _lt = _lt.substring(1);
                latencyLabel.textContent = _lt;
            } else {
                latencyLabel.textContent = '';
            }
            if (document.body.classList.contains('show-debug')) applyDebugSettings();
        }, 1000);

        // ============= Кодеки — строим из зелёных кнопок =============

        function buildCodecListFromButtons() {
            var list = [];
            if (S.h264) {
                var vc = AVC_CODEC_MAP[S.avcProfile] || AVC_CODEC_MAP['avc'];
                if (S.aac) {
                    list.push('video/mp4;codecs="' + vc + ',mp4a.40.2"');
                }
                if (S.opus) {
                    list.push('video/mp4;codecs="' + vc + ',opus"');
                }
                if (!S.aac && !S.opus) {
                    list.push('video/mp4');
                }
            }
            if (S.vp8) {
                var vpCodec = S.vpxProfile === 'vp9' ? 'vp9' : 'vp8';
                if (S.opus) {
                    list.push('video/webm;codecs="' + vpCodec + ',opus"');
                } else {
                    list.push('video/webm;codecs="' + vpCodec + '"');
                }
            }
            // Audio-only codecs
            if (S.opus) list.push('audio/webm;codecs="opus"');
            if (S.aac) list.push('audio/mp4;codecs="mp4a.40.2"');
            if (list.length === 0) list.push('video/webm');
            return list;
        }

        function isCodecSupported(mimeType) {
            if (!MediaSource.isTypeSupported(mimeType)) return false;
            if (typeof MediaRecorder === 'undefined') return true;
            if (MediaRecorder.isTypeSupported(mimeType)) return true;
            var container = mimeType.split(';')[0];
            if (container !== mimeType && MediaRecorder.isTypeSupported(container)) return true;
            return false;
        }

        function detectSupportedCodecs() {
            var candidates = buildCodecListFromButtons();
            var supported = [];
            var seen = {};
            for (var i = 0; i < candidates.length; i++) {
                var c = candidates[i];
                if (isCodecSupported(c) && !seen[c]) {
                    seen[c] = true;
                    supported.push(c);
                }
                var container = c.split(';')[0];
                if (container !== c && !seen[container] && isCodecSupported(container)) {
                    seen[container] = true;
                    supported.push(container);
                }
            }
            if (supported.length === 0) supported.push('video/webm');
            return supported;
        }

        // Все кодеки которые MediaRecorder может записывать (для отправки пиру)
        function detectAllRecordCodecs() {
            var allCandidates = [
                'video/webm;codecs="vp8,opus"',
                'video/webm;codecs="vp8"',
                'video/webm;codecs="vp9,opus"',
                'video/webm;codecs="vp9"',
                'video/mp4;codecs="avc1.42E01E,opus"',
                'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
                'video/mp4;codecs="avc1.4D401E,opus"',
                'video/mp4;codecs="avc1.4D401E,mp4a.40.2"',
                'video/mp4;codecs="avc1.64001F,opus"',
                'video/mp4;codecs="avc1.64001F,mp4a.40.2"',
                'video/mp4;codecs="hev1.1.6.L93.B0,opus"',
                'video/mp4;codecs="hev1.1.6.L93.B0,mp4a.40.2"',
                'audio/webm;codecs="opus"',
                'audio/mp4;codecs="mp4a.40.2"',
            ];
            var supported = [];
            var seen = {};
            for (var i = 0; i < allCandidates.length; i++) {
                var c = allCandidates[i];
                if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(c) && !seen[c]) {
                    seen[c] = true;
                    supported.push(c);
                }
            }
            if (supported.length === 0) supported.push('video/webm');
            return supported;
        }

        function detectCodec() {
            var candidates = buildCodecListFromButtons();
            for (var i = 0; i < candidates.length; i++) {
                if (isCodecSupported(candidates[i])) return candidates[i];
            }
            return 'video/webm';
        }

        function codecDisplayName(codec) {
            if (!codec) return 'Unknown';
            var cl = codec.toLowerCase();
            var video = '', audio = '';
            // AVC профили — matching по префиксу (MediaRecorder нормализует avc1.42E01E → avc1.42001e)
            if (cl.indexOf('avc1.42') !== -1) video = 'Avc';
            else if (cl.indexOf('avc1.4d') !== -1) video = 'AVc';
            else if (cl.indexOf('avc1.64') !== -1) video = 'AVC';
            else if (cl.indexOf('hev1') !== -1 || cl.indexOf('hvc1') !== -1) video = 'HEVC';
            else if (cl.indexOf('vp9') !== -1) video = 'VP9';
            else if (cl.indexOf('vp8') !== -1) video = 'VP8';
            if (cl.indexOf('opus') !== -1) audio = 'Opus';
            else if (cl.indexOf('mp4a.40.2') !== -1) audio = 'AAC';
            if (!video && cl.indexOf('audio/') === 0) return audio || codec;
            if (!video && cl.indexOf('mp4') !== -1) video = 'MP4';
            if (!video && cl.indexOf('webm') !== -1) video = 'WebM';
            var name = video || codec;
            if (audio) name += ' + ' + audio;
            return name;
        }


        // ============= Инициализация =============
        async function init() {
            try {
                var W = 320, H = 240; // default для diagLog

                // Создаём пустой стрим — tracks будут добавлены по мере успеха
                localStream = new MediaStream();
                var phase2Done = false; // Флаг: acquireCamera уже делает Фазу 2

                // На десктопе: перечисляем устройства и восстанавливаем последний deviceId
                // до первого getUserMedia, чтобы buildCameraConstraints() / buildAudioConstraints() использовали его
                if (isDesktop && S.video) {
                    await restoreDeviceId();
                }
                if (S.audio) {
                    await restoreAudioDeviceId();
                }

                // --- Комбинированный запрос камеры + микрофона ---
                if (S.video && S.audio) {
                    var initR = applyMpx(FALLBACK_ASPECT_W, FALLBACK_ASPECT_H, S.mpx);
                    W = initR.w;
                    H = initR.h;
                    // Один вызов вместо двух — быстрее на Linux (один cold-start медиа-стека)
                    try {
                        var combinedStream = await navigator.mediaDevices.getUserMedia({
                            video: buildCameraConstraints(),
                            audio: buildAudioConstraints()
                        });
                        combinedStream.getVideoTracks().forEach(function(t) { localStream.addTrack(t); });
                        combinedStream.getAudioTracks().forEach(function(t) { localStream.addTrack(t); });
                        diagLog('CAM+MIC acquired (combined)');
                    } catch(e) {
                        diagLog('Combined acquire failed: ' + e.name + ' ' + e.message + ', trying separate');
                        // Fallback: раздельные вызовы (ideal из MPX_GROUPS)
                        try {
                            var videoStream = await navigator.mediaDevices.getUserMedia({
                                video: buildCameraConstraints(),
                                audio: false
                            });
                            videoStream.getVideoTracks().forEach(function(t) { localStream.addTrack(t); });
                            diagLog('CAM acquired (fallback ideal)');
                        } catch(ve2) {
                            diagLog('CAM not available: ' + ve2.name + ' ' + ve2.message);
                            S.video = false;
                        }
                        try {
                            var audioStream = await navigator.mediaDevices.getUserMedia({
                                video: false,
                                audio: buildAudioConstraints()
                            });
                            audioStream.getAudioTracks().forEach(function(t) { localStream.addTrack(t); });
                            diagLog('MIC acquired (fallback)');
                        } catch(ae) {
                            diagLog('MIC not available: ' + ae.name + ' ' + ae.message);
                            S.audio = false;
                        }
                    }
                } else if (S.video) {
                    // Только камера — используем acquireCamera (включает Фазу 2)
                    try {
                        await acquireCamera('CAM');
                        var vs = localStream.getVideoTracks()[0].getSettings();
                        W = vs.width || W;
                        H = vs.height || H;
                        phase2Done = true;
                    } catch(e) {
                        diagLog('CAM not available: ' + e.name + ' ' + e.message);
                        S.video = false;
                    }
                } else if (S.audio) {
                    // Только микрофон
                    try {
                        var audioStream = await navigator.mediaDevices.getUserMedia({
                            video: false,
                            audio: buildAudioConstraints()
                        });
                        audioStream.getAudioTracks().forEach(function(t) { localStream.addTrack(t); });
                        diagLog('MIC acquired');
                    } catch(e) {
                        diagLog('MIC not available: ' + e.name + ' ' + e.message);
                        S.audio = false;
                    }
                }

                localVideo.srcObject = localStream;
                updatePipSize();

                // Предупреждение если нет ни камеры ни микрофона — но звонок продолжается (можно шарить экран)
                if (!S.video && !S.audio) {
                    diagLog('INIT no camera and no microphone, continuing (screen share available)');
                }

                // Фаза 2: уточняем разрешение по нативному аспекту камеры + mpx
                // Пропускаем если уже сделано через acquireCamera()
                if (!phase2Done && localStream.getVideoTracks().length > 0) {
                    var refined = await refineCameraResolution('CAM init');
                    if (refined) { W = refined.w; H = refined.h; }
                }

                // Если камера/микрофон выключены — освободить соответствующие треки из localStream
                if (!S.video) {
                    localStream.getVideoTracks().forEach(function(t) { t.stop(); localStream.removeTrack(t); });
                    diagLog('CAM released (init with video off)');
                }
                if (!S.audio) {
                    localStream.getAudioTracks().forEach(function(t) { t.stop(); localStream.removeTrack(t); });
                    diagLog('MIC released (init with audio off)');
                }

                // Определяем текущее видеоустройство (для переключения камер на десктопе)
                if (S.video) {
                    await detectCurrentDevice();
                }
                // Определяем текущее аудиоустройство (для переключения микрофонов)
                if (S.audio) {
                    await detectCurrentAudioDevice();
                }

                applySettings(); saveSettings();

                // Слушаем подключение/отключение устройств для обновления индексов на кнопках
                navigator.mediaDevices.addEventListener('devicechange', async function() {
                    diagLog('[Devices] devicechange event');
                    await enumerateVideoDevices();
                    await enumerateAudioDevices();
                    if (S.video && localStream && localStream.getVideoTracks().length > 0) {
                        await detectCurrentDevice();
                    }
                    if (S.audio && localStream && localStream.getAudioTracks().length > 0) {
                        await detectCurrentAudioDevice();
                    }
                    applySettings();
                });

                var myCodecs = detectSupportedCodecs();
                diagLog('CODECS supported: ' + myCodecs.map(codecDisplayName).join(' | '));

                var createResult = await tryCreateRoom();
                isCreator = createResult.created;

                isActive = true; // Разрешаем hangup во время ожидания пира
                if (isCreator) {
                    myPeerID = 'host';
                    remotePeerID = 'guest';
                } else {
                    myPeerID = 'guest';
                    remotePeerID = 'host';
                }
                diagLog('INIT peer=' + myPeerID + ' cam=' + W + 'x' + H + ' video=' + S.video + ' audio=' + S.audio);
                _diagUserId = myPeerID + '_' + getBrowserTag();
                await startCall();
            } catch (err) {
                isActive = false;
                console.error('Init error:', err);
                showError('Error: ' + err.message);
            }
        }

        // ============= API =============
        async function tryCreateRoom() {
            try {
                var resp = await fetch('/api/call/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID })
                });
                if (!resp.ok) return { created: false };
                var data = await resp.json();
                return { created: data.status === 'created' };
            } catch (e) { return { created: false }; }
        }

        async function sendChunk(data) {
            diagSentChunks++;
            diagSentBytes += data.size || data.byteLength;
            if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
                try { ws.send(data); } catch (e) {}
            }
        }

        async function endCall() {
            try { await fetch('/api/call/room?room=' + encodeURIComponent(roomID), { method: 'DELETE' }); } catch (e) {}
        }

        // ============= Разрешение =============
        async function applyDesiredResolution(dw, dh) {
            if (dw <= 0 || dh <= 0) return;
            var clamped = clampToCameraMax({ w: dw, h: dh });
            dw = clamped.w; dh = clamped.h;
            var videoTracks = localStream.getVideoTracks();
            if (videoTracks.length === 0) return;
            // Камера: пробуем exact для точного разрешения
            // Шаринг: exact искажает display track, пропускаем — сразу ideal
            if (!isScreenSharing || screenAudioOnly) {
                try {
                    await videoTracks[0].applyConstraints(addFrameRateConstraint({
                        width: { exact: dw },
                        height: { exact: dh }
                    }));
                    var s = videoTracks[0].getSettings();
                    diagLog('RES applied peer desire exact ' + s.width + 'x' + s.height);
                    updateResLabels();
                    sendMyRes();
                    return;
                } catch(e) {
                    diagLog('RES exact ' + dw + 'x' + dh + ' failed: ' + e.message + ', trying ideal');
                }
            }
            // Fallback камеры или шаринг: ideal (aspectRatio только для камеры)
            try {
                var constraints = addFrameRateConstraint({ width: { ideal: dw }, height: { ideal: dh } });
                // aspectRatio помогает мобильным камерам понять нужную ориентацию
                // Для шаринга НЕ добавляем — display track сохраняет нативный аспект экрана
                if ((!isScreenSharing || screenAudioOnly) && dw > 0 && dh > 0) {
                    constraints.aspectRatio = { ideal: dw / dh };
                }
                await videoTracks[0].applyConstraints(constraints);
                var s = videoTracks[0].getSettings();
                diagLog('RES applied peer desire ideal ' + s.width + 'x' + s.height);
                updateResLabels();
                sendMyRes();
            } catch (e) { diagLog('RES desire failed: ' + e.message); }
        }

        // Отправляет пиру реальный FPS своей камеры (cmd:myRes)
        // width/height пиру уже известны из cmd:settings и remoteVideo
        function sendMyRes() {
            if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (!localStream) return;
            var vt = localStream.getVideoTracks()[0];
            if (!vt) return;
            var s = vt.getSettings();
            if (s.frameRate > 0) {
                try { ws.send(JSON.stringify({ cmd: 'myRes', frameRate: s.frameRate })); } catch(e) {}
            }
        }

        // ============= Camera capabilities + findBestResolution =============
        // Возвращает { minW, maxW, stepW, minH, maxH, stepH } или null
        function getCameraCapabilities() {
            var vt = localStream ? localStream.getVideoTracks()[0] : null;
            if (!vt) return null;
            // Попытка getCapabilities() (Chrome, Edge, Android WebView)
            if (typeof vt.getCapabilities === 'function') {
                try {
                    var caps = vt.getCapabilities();
                    if (caps && caps.width && caps.height &&
                        typeof caps.width.min === 'number' && typeof caps.width.max === 'number' &&
                        typeof caps.height.min === 'number' && typeof caps.height.max === 'number') {
                        var maxFPS = 0;
                        if (caps.frameRate && typeof caps.frameRate.max === 'number') {
                            maxFPS = caps.frameRate.max;
                        }
                        return {
                            minW: caps.width.min, maxW: caps.width.max, stepW: caps.width.step || 1,
                            minH: caps.height.min, maxH: caps.height.max, stepH: caps.height.step || 1,
                            maxFPS: maxFPS
                        };
                    }
                } catch(e) {}
            }
            return null;
        }

        // Обновляет cameraNativeMaxW/H из getCameraCapabilities()
        // Также обновляет MPX_GROUPS[0.7] — максимальное разрешение камеры (для toggle-to-max)
        function updateCameraNativeMax() {
            var caps = getCameraCapabilities();
            if (caps && caps.maxW > 0 && caps.maxH > 0) {
                cameraNativeMaxW = caps.maxW;
                cameraNativeMaxH = caps.maxH;
                if (caps.maxFPS > 0) cameraNativeMaxFPS = caps.maxFPS;
                diagLog('CAM native max: ' + cameraNativeMaxW + 'x' + cameraNativeMaxH + '@' + cameraNativeMaxFPS + 'fps');
                // Динамическая группа 0.7 — максимальное разрешение камеры (оба ключа для ideal fallback)
                MPX_GROUPS[0.7] = { '4:3': [{ w: cameraNativeMaxW, h: cameraNativeMaxH }], '16:9': [{ w: cameraNativeMaxW, h: cameraNativeMaxH }] };
            }
        }

        // Ограничивает разрешение {w, h} до нативного максимума камеры
        // Если cameraNativeMaxW=0 (не зондировалось) — не ограничивает
        // При превышении по любой оси — просто выставляет максимальные значения камеры
        function clampToCameraMax(res) {
            if (cameraNativeMaxW <= 0 || cameraNativeMaxH <= 0) return res;
            if (res.w > cameraNativeMaxW || res.h > cameraNativeMaxH) {
                return { w: cameraNativeMaxW, h: cameraNativeMaxH };
            }
            return res;
        }

        // ============= Поиск разрешения через exact из MPX_GROUPS =============
        // Порядок: сначала 4:3 от меньшей площади, затем 16:9 от меньшей площади
        // aspectRatio exact заставляет браузер отклонять неподходящий аспект
        // Возвращает { w, h } первого успешного exact или null
        async function tryExactResolutions(mpx) {
            var group = MPX_GROUPS[mpx];
            diagLog('EXACT trying mpx=' + mpx + ' group=' + !!group);
            if (!group) return null;
            var vt = localStream ? localStream.getVideoTracks()[0] : null;
            if (!vt) return null;
            var aspects = getAspectPriority();
            for (var a = 0; a < aspects.length; a++) {
                var resolutions = group[aspects[a]];
                if (!resolutions) continue;
                for (var i = 0; i < resolutions.length; i++) {
                    var r = resolutions[i];
                    try {
                        await vt.applyConstraints(addFrameRateConstraint({
                            width: { exact: r.w },
                            height: { exact: r.h }
                        }));
                        diagLog('EXACT mpx=' + mpx + ' ' + aspects[a] + ' ' + r.w + 'x' + r.h + ' OK');
                        return { w: r.w, h: r.h };
                    } catch(e) {
                        diagLog('EXACT mpx=' + mpx + ' ' + aspects[a] + ' ' + r.w + 'x' + r.h + ' fail: ' + e.message);
                    }
                }
            }
            return null;
        }

        // ============= Уточнение разрешения камеры (Фаза 2) =============
        // Определяет нативный аспект камеры, пересчитывает разрешение по mpx,
        // применяет applyConstraints. Возвращает { w, h } или null.
        // Используется как из acquireCamera(), так и из init().
        async function refineCameraResolution(logPrefix) {
            logPrefix = logPrefix || 'CAM';
            var vt = localStream ? localStream.getVideoTracks()[0] : null;
            if (!vt) return null;
            var camCaps = getCameraCapabilities();
            updateCameraNativeMax();
            var vs = vt.getSettings();
            diagLog(logPrefix + ' phase1 settings: ' + vs.width + 'x' + vs.height + ' fps=' + (vs.frameRate || 'n/a'));
            // Определяем нативный аспект камеры: приоритет — cameraNativeMax (истинный максимум),
            // затем camCaps, затем settings (могут быть занижены Phase 1), затем fallback 16:9
            var aspect = FALLBACK_ASPECT_W / FALLBACK_ASPECT_H;
            if (cameraNativeMaxW > 0 && cameraNativeMaxH > 0) {
                aspect = cameraNativeMaxW / cameraNativeMaxH;
                diagLog(logPrefix + ' aspect from nativeMax: ' + aspect.toFixed(2) + ' (' + cameraNativeMaxW + 'x' + cameraNativeMaxH + ')');
            } else if (camCaps && camCaps.maxW > 0 && camCaps.maxH > 0) {
                aspect = camCaps.maxW / camCaps.maxH;
                diagLog(logPrefix + ' caps: ' + camCaps.minW + '-' + camCaps.maxW + 'x' + camCaps.minH + '-' + camCaps.maxH + ' step=' + camCaps.stepW + 'x' + camCaps.stepH + ' aspect=' + aspect.toFixed(2));
            } else if (vs.width && vs.height) {
                aspect = vs.width / vs.height;
                diagLog(logPrefix + ' aspect from settings: ' + aspect.toFixed(2) + ' (' + vs.width + 'x' + vs.height + ')');
            } else {
                diagLog(logPrefix + ' caps: NOT AVAILABLE, using fallback aspect=' + aspect.toFixed(2));
            }
            // Сначала пробуем exact из MPX_GROUPS (приоритет 4:3, затем 16:9)
            var exactResult = await tryExactResolutions(S.mpx);
            if (exactResult) {
                vs = vt.getSettings();
                diagLog(logPrefix + ' phase2 exact=' + exactResult.w + 'x' + exactResult.h + ' actual=' + vs.width + 'x' + vs.height);
                if (typeof vt.getCapabilities === 'function') {
                    try {
                        var fullCaps = vt.getCapabilities();
                        diagLog(logPrefix + ' full capabilities: ' + JSON.stringify(fullCaps));
                    } catch(e) { diagLog(logPrefix + ' getCapabilities error: ' + e.message); }
                }
                return { w: exactResult.w, h: exactResult.h };
            }
            // Fallback: ideal из первого элемента MPX_GROUPS, затем applyMpx
            diagLog(logPrefix + ' phase2 exact failed, falling back to ideal');
            var idealW, idealH;
            var first = getFirstResolution(S.mpx);
            if (first) {
                idealW = first.w; idealH = first.h;
            }
            if (!idealW) {
                var refined = clampToCameraMax(applyMpx(aspect, 1, S.mpx));
                idealW = refined.w; idealH = refined.h;
            }
            try {
                await vt.applyConstraints(addFrameRateConstraint({ width: { ideal: idealW }, height: { ideal: idealH } }));
                vs = vt.getSettings();
                diagLog(logPrefix + ' phase2 ideal=' + idealW + 'x' + idealH + ' actual=' + vs.width + 'x' + vs.height);
            } catch(e) { diagLog(logPrefix + ' phase2 apply failed: ' + e.message); }
            if (typeof vt.getCapabilities === 'function') {
                try {
                    var fullCaps = vt.getCapabilities();
                    diagLog(logPrefix + ' full capabilities: ' + JSON.stringify(fullCaps));
                } catch(e) { diagLog(logPrefix + ' getCapabilities error: ' + e.message); }
            }
            return { w: idealW, h: idealH };
        }

        // ============= Двухфазное получение камеры =============
        // Фаза 1: getUserMedia с fallback-аспектом 4:3 + mpx
        // Фаза 2: уточнение через refineCameraResolution()
        // Останавливает старые video tracks, получает новые, добавляет в localStream
        // Бросает исключение при ошибке (caller ловит и ставит S.video=false)
        async function acquireCamera(logPrefix) {
            logPrefix = logPrefix || 'CAM';
            // Сохраняем старые video tracks (не останавливаем пока не получим новый стрим)
            var oldTracks = localStream.getVideoTracks().slice();
            // Фаза 1: getUserMedia с ideal из MPX_GROUPS
            var newStream = await navigator.mediaDevices.getUserMedia({
                video: buildCameraConstraints(),
                audio: false
            });
            // Успех — теперь безопасно заменяем старые треки
            oldTracks.forEach(function(t) { t.stop(); localStream.removeTrack(t); });
            newStream.getVideoTracks().forEach(function(t) { localStream.addTrack(t); });
            localVideo.srcObject = localStream;
            updatePipSize();
            // Фаза 2: уточняем разрешение (нужно только для ideal fallback)
            await refineCameraResolution(logPrefix);
        }

        // Камера: первое разрешение из MPX_GROUPS[mpx] (4:3 → 16:9)
        // Шаринг: applyMpx с аспектом display track (пропорциональное масштабирование)
        function findBestResolution(mpx, dispW, dispH) {
            // Шаринг: mpx>=0.7 → полное разрешение (как камера), иначе — пропорциональное масштабование через applyMpx
            if (isScreenSharing && !screenAudioOnly) {
                var vt = localStream ? localStream.getVideoTracks()[0] : null;
                if (vt) {
                    var s = vt.getSettings();
                    if (s.width > 0 && s.height > 0) {
                        if (mpx >= 0.7) {
                            // mpx=0.7 = максимум — полное разрешение без масштабирования
                            diagLog('FIND_BEST mpx=' + mpx + ' screen full=' + s.width + 'x' + s.height);
                            return { w: s.width, h: s.height };
                        }
                        var r = clampToCameraMax(applyMpx(s.width, s.height, mpx));
                        diagLog('FIND_BEST mpx=' + mpx + ' screen applyMpx(' + s.width + 'x' + s.height + ')=' + r.w + 'x' + r.h);
                        return r;
                    }
                }
            }
            // Камера: из MPX_GROUPS по приоритету аспекта
            var first = getFirstResolution(mpx);
            if (first) {
                diagLog('FIND_BEST mpx=' + mpx + ' ' + first.w + 'x' + first.h);
                return first;
            }
            return null;
        }

        // ============= Negotiate codec на клиенте =============
        function negotiateCodecClient(myRecordCodecs, peerPlayCodecs) {
            for (var i = 0; i < myRecordCodecs.length; i++) {
                for (var j = 0; j < peerPlayCodecs.length; j++) {
                    if (myRecordCodecs[i] === peerPlayCodecs[j]) return myRecordCodecs[i];
                }
            }
            return '';
        }

        // ============= Обработка настроек пира =============
        async function handlePeerSettings(msg, initial) {
            var prev = peerSettings;
            peerSettings = msg;
            if (msg.role === remotePeerID) { try { localStorage.setItem('vc_peerSettings', JSON.stringify(msg)); } catch(e) {} }
            if (!isActive || !localStream) return;

            // === PRIVACY: управление Mic/Cam на основе кодеков пира ===
            var peerNoAudio = msg.opus === false && msg.aac === false;
            var peerNoVideo = msg.vp8 === false && msg.h264 === false;

            // Пир отключил все аудио кодеки → выключаем свой Mic (если ещё включён)
            if (peerNoAudio && S.audio) {
                diagLog('PRIVACY: peer disabled all audio codecs, turning off my Mic');
                S.audio = false;
                audioDisabledByPrivacy = true;
                localStream.getAudioTracks().forEach(function(t) { t.stop(); localStream.removeTrack(t); });
                applySettings(); saveSettings();
                if (!S.audio && !S.video && !screenAudioOnly) {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop(); recorderStarted = false;
                    }
                } else if (recorderStarted) {
                    restartMediaRecorder('settings');
                }
            }
            // Пир отключил все аудио кодеки → выключаем Screen Audio (если ещё включён)
            if (peerNoAudio && S.screenAudio) {
                diagLog('PRIVACY: peer disabled all audio codecs, turning off Screen Audio');
                S.screenAudio = false;
                screenAudioDisabledByPrivacy = true;
                applySettings(); saveSettings();
            }
            // Пир включил хотя бы один аудио кодек обратно → включаем Mic (если был выключен пиром, а не автором)
            if (!peerNoAudio && audioDisabledByPrivacy && !S.audio) {
                diagLog('PRIVACY: peer re-enabled audio codecs, turning my Mic back on');
                audioDisabledByPrivacy = false;
                S.audio = true;
                try {
                    var newAudioStream = await navigator.mediaDevices.getUserMedia({
                        video: false,
                        audio: buildAudioConstraints()
                    });
                    newAudioStream.getAudioTracks().forEach(function(t) { localStream.addTrack(t); });
                    diagLog('MIC re-acquired (privacy restore)');
                } catch(e) {
                    diagLog('MIC re-acquire failed (privacy restore): ' + e.message);
                    S.audio = false;
                }
                applySettings(); saveSettings(); sendSettings();
                if (recorderStarted || S.audio) {
                    restartMediaRecorder('settings');
                }
            }
            // Пир включил аудио кодеки обратно → включаем Screen Audio (если был выключен пиром, а не автором)
            if (!peerNoAudio && screenAudioDisabledByPrivacy && !S.screenAudio) {
                diagLog('PRIVACY: peer re-enabled audio codecs, turning Screen Audio back on');
                screenAudioDisabledByPrivacy = false;
                S.screenAudio = true;
                applySettings(); saveSettings();
            }

            // Пир отключил все видео кодеки → выключаем свою Cam (если ещё включена)
            if (peerNoVideo && S.video) {
                diagLog('PRIVACY: peer disabled all video codecs, turning off my Cam');
                S.video = false;
                videoDisabledByPrivacy = true;
                localStream.getVideoTracks().forEach(function(t) { t.stop(); localStream.removeTrack(t); });
                applySettings(); saveSettings();
                if (!S.audio && !S.video && !screenAudioOnly) {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop(); recorderStarted = false;
                    }
                } else if (recorderStarted) {
                    restartMediaRecorder('settings');
                }
            }
            // Пир включил хотя бы один видео кодек обратно → включаем Cam (если была выключена пиром, а не автором)
            if (!peerNoVideo && videoDisabledByPrivacy && !S.video) {
                diagLog('PRIVACY: peer re-enabled video codecs, turning my Cam back on');
                videoDisabledByPrivacy = false;
                S.video = true;
                try {
                    await acquireCamera('CAM privacy');
                    diagLog('CAM re-acquired (privacy restore)');
                } catch(e) {
                    diagLog('CAM re-acquire failed (privacy restore): ' + e.message);
                    S.video = false;
                }
                applySettings(); saveSettings(); sendSettings();
                if (recorderStarted || S.video) {
                    restartMediaRecorder('settings');
                }
                updateResLabels();
            }

            // Извлекаем размеры MSE-окна пира для аспект-соотношения
            var newPeerDisplayW = 0, newPeerDisplayH = 0;
            if (msg.displayW > 0) newPeerDisplayW = Math.round(msg.displayW);
            if (msg.displayH > 0) newPeerDisplayH = Math.round(msg.displayH);

            var displayChanged = false;
            if (newPeerDisplayW > 0 && newPeerDisplayH > 0) {
                if (peerDisplayW !== newPeerDisplayW || peerDisplayH !== newPeerDisplayH) {
                    displayChanged = true;
                    diagLog('PEER display changed: ' + peerDisplayW + 'x' + peerDisplayH + ' → ' + newPeerDisplayW + 'x' + newPeerDisplayH);
                }
                peerDisplayW = newPeerDisplayW;
                peerDisplayH = newPeerDisplayH;
            }

            // Negotiate codec если у пира есть recordCodecs/playCodecs
            if (msg.recordCodecs && msg.playCodecs) {
                var myPlayCodecs = detectSupportedCodecs();
                var myRecordCodecs = detectAllRecordCodecs();
                var newRecordCodec = negotiateCodecClient(myRecordCodecs, msg.playCodecs);
                var newIncomingCodec = negotiateCodecClient(msg.recordCodecs, myPlayCodecs);
                if (newRecordCodec) {
                    recordCodec = newRecordCodec;
                    diagLog('NEGOTIATE record=' + codecDisplayName(recordCodec));
                }
                if (newIncomingCodec) {
                    incomingCodec = newIncomingCodec;
                    diagLog('NEGOTIATE incoming=' + codecDisplayName(incomingCodec));
                }
                if (recordCodec) negotiatedCodec = recordCodec;
            }

            // Пир хочет определённое разрешение от меня (через mpx)
            // Миграция старых значений mpx от пира (или из vc_peerSettings)
            if (Math.abs(msg.mpx - 0.05) < 0.01) msg.mpx = 0.06;
            else if (Math.abs(msg.mpx - 0.1) < 0.01) msg.mpx = 0.2;
            else if (Math.abs(msg.mpx - 0.5) < 0.01) msg.mpx = 0.6;
            if (msg.mpx > 0) {
                var best = findBestResolution(msg.mpx, peerDisplayW, peerDisplayH);
                if (best && best.w > 0 && best.h > 0) {
                    diagLog('PEER wants ' + msg.mpx + 'mpx → best=' + best.w + 'x' + best.h + ' (display=' + peerDisplayW + 'x' + peerDisplayH + ')');
                    applyDesiredResolution(best.w, best.h);
                }
            }

            // При начальном получении настроек — не трогаем рекордер, startCall сам запустит
            if (initial) return;

            // Дальнейшие изменения — рестарт рекордера при необходимости
            var peerWantsMyAudio = msg.wantAudio !== false;
            var peerWantsMyVideo = msg.wantVideo !== false;
            var canSend = (S.audio && peerWantsMyAudio) || (S.video && peerWantsMyVideo) || (screenAudioOnly && peerWantsMyAudio);
            // Обновляем метку разрешения пира
            updateResLabels();

            // Обновляем incomingCodec из настроек пира (fallback — основной источник кодека — инит-сегмент)
            if (msg.recordCodecs && msg.playCodecs) {
                var myPlay = detectSupportedCodecs();
                var newInc = negotiateCodecClient(msg.recordCodecs, myPlay);
                if (newInc && newInc !== incomingCodec) {
                    diagLog('incoming codec updated: ' + codecDisplayName(incomingCodec) + ' → ' + codecDisplayName(newInc));
                    incomingCodec = newInc;
                }
            }

            // Обновляем incomingCodec при изменении состояния видео пира (камера вкл/выкл)
            if (prev) {
                var prevPeerVideo = prev.video !== false;
                var curPeerVideo = msg.video !== false;
                if (prevPeerVideo !== curPeerVideo) {
                    diagLog('peer video changed: ' + prevPeerVideo + ' → ' + curPeerVideo);
                    if (!curPeerVideo) {
                        // Камера пира выключена — будет audio-only поток
                        var audioCodecs = ['audio/webm;codecs="opus"', 'audio/mp4;codecs="mp4a.40.2"', 'audio/webm'];
                        for (var ai = 0; ai < audioCodecs.length; ai++) {
                            if (MediaSource.isTypeSupported(audioCodecs[ai])) {
                                incomingCodec = audioCodecs[ai];
                                break;
                            }
                        }
                        diagLog('incoming codec set to audio-only: ' + codecDisplayName(incomingCodec));
                    } else {
                        // Камера пира включена — пересчитываем через negotiation
                        if (msg.recordCodecs) {
                            var myPlay = detectSupportedCodecs();
                            var newInc = negotiateCodecClient(msg.recordCodecs, myPlay);
                            if (newInc) incomingCodec = newInc;
                        }
                        diagLog('incoming codec set to video: ' + codecDisplayName(incomingCodec));
                    }
                }
            }

            // Проверяем изменились ли настройки кнопок рядов 2-3 (кроме EC/NS/AGC)
            var settingsChanged = false;
            if (prev) {
                if (
                    prev.vp8 !== msg.vp8 ||
                    prev.h264 !== msg.h264 ||
                    prev.vpxProfile !== msg.vpxProfile ||
                    prev.avcProfile !== msg.avcProfile ||
                    prev.opus !== msg.opus ||
                    prev.aac !== msg.aac ||
                    Math.abs((prev.mpx || 0) - (msg.mpx || 0)) > 0.001) {
                    settingsChanged = true;
                }
            }

            // Проверяем был ли рекордер остановлен
            var wasStopped = !recorderStarted || !mediaRecorder || mediaRecorder.state === 'inactive';

            if (!canSend && !isRecording) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    diagLog('REC stop: peer doesnt need my streams and not recording');
                    mediaRecorder.stop();
                    recorderStarted = false;
                }
            } else if (settingsChanged || wasStopped) {
                diagLog('REC restart: settings=' + settingsChanged + ' stopped=' + wasStopped);
                restartMediaRecorder(settingsChanged ? 'settings' : 'stopped');
            }
        }

        function restartMediaRecorder(reason) {
            if (recorderRestartTimer) { clearTimeout(recorderRestartTimer); recorderRestartTimer = null; }
            recorderRestartTimer = setTimeout(function() {
                recorderRestartTimer = null;
                if (!isActive) return;
                // Если рекордер уже записывает и причина только wasStopped — пропускаем
                // (рекордер уже перезапустился через onstop auto-restart)
                if (reason !== 'settings' && mediaRecorder && mediaRecorder.state === 'recording') {
                    diagLog('REC restart skipped: already recording, reason=' + reason);
                    return;
                }
                // onstop закроет файл после последнего ondataavailable
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                } else {
                    setupMediaRecorder();
                }
            }, RECORDER_RESTART_DEBOUNCE_MS);
        }

        // ============= WebSocket =============
        function connectWS() {
            if (!isActive) return;
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsURL = proto + '//' + location.host + '/api/call/ws?room=' + encodeURIComponent(roomID) + '&peer=' + encodeURIComponent(myPeerID);
            diagLog('WS connecting...');
            try { ws = new WebSocket(wsURL); ws.binaryType = 'arraybuffer'; }
            catch (e) { diagLog('WS create error: ' + e.message); return; }
            ws.onopen = function() {
                wsConnected = true;
                diagLog('WS connected role=' + (isCreator ? 'host' : 'guest'));
                if (isCreator) {
                    echo = true; // хост в эхо-режиме пока не придут settings от гостя
                    // Host: загружаем сохранённые peer settings для немедленного старта рекордера
                    var savedPeerSettings = null;
                    try { savedPeerSettings = JSON.parse(localStorage.getItem('vc_peerSettings')); } catch(e) {}
                    if (savedPeerSettings) {
                        diagLog('PEER settings restored from localStorage');
                        handlePeerSettings(savedPeerSettings, false);
                    } else {
                        // Fallback: используем свои настройки как peer settings (эхо-режим / первый запуск)
                        var fallbackSettings = JSON.parse(JSON.stringify(S));
                        fallbackSettings.cmd = 'settings';
                        fallbackSettings.role = remotePeerID;
                        fallbackSettings.recordCodecs = detectAllRecordCodecs();
                        fallbackSettings.playCodecs = detectSupportedCodecs();
                        try { localStorage.setItem('vc_peerSettings', JSON.stringify(fallbackSettings)); } catch(e) {}
                        diagLog('PEER settings fallback from own S');
                        handlePeerSettings(fallbackSettings, false);
                    }
                    // Запускаем рекордер без sendSettings — хост не инициирует обмен
                } else {
                    // Guest: отправляем свои настройки хосту, он ответит своими
                    sendSettings();
                }
            };
            ws.onmessage = function(event) {
                if (event.data instanceof ArrayBuffer) {
                    handleIncomingChunk(event.data);
                } else if (typeof event.data === 'string') {
                    if (event.data === 'peer_left') {
                        diagLog('PEER left via WS');
                        hangup();
                    } else {
                        // JSON settings от пира
                        try {
                            var msg = JSON.parse(event.data);
                            if (msg.cmd === 'settings') {
                                diagLog('PEER settings: role=' + msg.role + ' a=' + msg.audio + ' v=' + msg.video + ' wa=' + msg.wantAudio + ' wv=' + msg.wantVideo);
                                if (echo && msg.role === 'guest') {
                                    echo = false;
                                    sendSettings(); // отвечаем однократно
                                    restartMediaRecorder('settings'); // рестарт → свежий initCodec гостю
                                }
                                handlePeerSettings(msg, false);
                            } else if (msg.cmd === 'initCodec') {
                                // Единственная точка управления MSE: создание и пересоздание
                                diagLog('RECV initCodec=' + (msg.codec || 'null') + ' mseRestarting=' + mseRestarting + ' mediaSource=' + !!mediaSource + ' readyState=' + (mediaSource ? mediaSource.readyState : 'none') + ' currentMseCodec=' + codecDisplayName(currentMseCodec));
                                if (msg.codec) {
                                    diagLog('PEER initCodec=' + codecDisplayName(msg.codec));
                                    incomingCodec = msg.codec;
                                    peerRecorderCodec = msg.codec;
                                    updateResLabels();
                                    if (mseRestarting) {
                                        // MSE перезапускается — incomingCodec обновлён, будет использован при sourceopen
                                        diagLog('MSE RESTARTING — initCodec will be used on sourceopen');
                                    } else if (!mediaSource || mediaSource.readyState === 'closed') {
                                        // MSE ещё не создан — создаём с фактическим кодеком от пира
                                        diagLog('MSE CREATING from initCodec=' + codecDisplayName(msg.codec));
                                        setupMSE();
                                    } else {
                                        // Кодек тот же или изменился — пересоздаём MSE,
                                        // т.к. init-сегмент от нового рекордера имеет другие таймстампы
                                        diagLog('MSE RESTART (initCodec, codec=' + codecDisplayName(msg.codec) + ' same=' + (msg.codec === currentMseCodec) + ')');
                                        restartMSE();
                                        setupMSE();
                                    }
                                } else {
                                    diagLog('RECV initCodec: codec is empty — no action');
                                }
                                // Запись remote video: initCodec подтверждает что сервер начал запись
                                if (isPeerRecording && peerRecBtn.classList.contains('pending')) {
                                    peerRecBtn.classList.remove('pending');
                                    peerRecBtn.classList.add('recording');
                                    peerRecBtn.textContent = '🔴';
                                    diagLog('PEER REC started — server writing chunks');
                                }
                            } else if (msg.cmd === 'restartRecorder') {
                                // Пир просит перезапустить наш рекордер
                                diagLog('PEER requested recorder restart');
                                restartMediaRecorder('settings');
                            } else if (msg.cmd === 'myRes') {
                                // Пир сообщает реальный FPS своей камеры (для remoteResLabel)
                                if (msg.frameRate > 0) {
                                    peerRes.frameRate = msg.frameRate;
                                    updateResLabels();
                                }
                            }
                        } catch(e) {}
                    }
                }
            };
            ws.onclose = function(event) {
                wsConnected = false;
                diagLog('WS closed code=' + event.code);
                if (isActive) hangup();
            };
            ws.onerror = function() {};
        }

        function mseQueueLength() { return mseQueue.length - mseQueueReadIdx; }
        function mseQueueCompact() {
            if (mseQueueReadIdx > MAX_MSE_QUEUE) {
                mseQueue = mseQueue.slice(mseQueueReadIdx);
                mseQueueReadIdx = 0;
            }
        }

        function handleIncomingChunk(data) {
            diagRecvChunks++;
            diagRecvBytes += data.byteLength;
            if (mseCriticalTriggered) return;


            // Просто помещаем в очередь — MSE управляется только через cmd:initCodec
            mseQueue.push(data);
            if (mseQueueLength() > MAX_MSE_QUEUE) {
                diagLog('MSE queue overflow (' + mseQueueLength() + '), dropping oldest');
                mseQueueReadIdx = mseQueue.length - Math.floor(MAX_MSE_QUEUE / 2);
                mseQueueCompact();
            }
            if (mseReady) {
                processMSEQueue();
            } else if (diagRecvChunks <= 3) {
                diagLog('MSE NOT READY: chunk queued but mseReady=false mseRestarting=' + mseRestarting + ' mediaSource=' + !!mediaSource + ' sourceBuffer=' + !!sourceBuffer + ' queue=' + mseQueueLength());
            }
            doRateControl();
        }

        function disconnectWS() {
            if (ws) {
                ws.onclose = null; ws.onerror = null; ws.onmessage = null;
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) ws.close();
                ws = null;
            }
            wsConnected = false;
        }

        // ============= Звонок =============
        async function startCall() {
            isActive = true;
            connectWS();
        }

        // ============= MSE =============
        function setupMSE() {
            var codec = incomingCodec || negotiatedCodec || detectCodec();
            diagLog('MSE setup codec=' + codecDisplayName(codec) + ' muted=' + remoteVideo.muted + ' wantAudio=' + S.wantAudio);
            // Очищаем очередь — устаревшие чанки без init-сегмента вызовут MSE error
            mseQueue = []; mseQueueReadIdx = 0;
            mseRestarting = true; // сбросится в sourceopen
            try { if (remoteVideo.src && remoteVideo.src.startsWith('blob:')) URL.revokeObjectURL(remoteVideo.src); } catch(e) {}
            mediaSource = new MediaSource();
            remoteVideo.src = URL.createObjectURL(mediaSource);
            mediaSource.addEventListener('sourceopen', function() {
                diagLog('MSE sourceopen codec=' + codecDisplayName(codec) + ' readyState=' + mediaSource.readyState);
                try {
                    sourceBuffer = mediaSource.addSourceBuffer(codec);
                    sourceBuffer.mode = 'segments';
                    sourceBuffer.addEventListener('updateend', function() { onMSEUpdateEnd(); });
                    sourceBuffer.addEventListener('error', function() {
                        diagMSEErrors++;
                        mseErrorTimestamps.push(Date.now());
                        diagLog('MSE sourceBuffer error (total=' + diagMSEErrors + ')');
                        checkMSECritical();
                    });
                    mseReady = true;
                    mseRestarting = false;
                    mseCriticalTriggered = false;
                    currentMseCodec = codec;
                    diagLog('MSE READY codec=' + codecDisplayName(codec) + ' queue=' + mseQueueLength());
                    if (mseQueueLength() > 0) processMSEQueue();
                } catch (e) {
                    diagLog('MSE sourceopen FAILED: ' + e.message);
                    // Runtime fallback — занести профиль в blacklist, переключить на следующий
                    var _cl = (codec || '').toLowerCase();
                    if (_cl.indexOf('vp8') !== -1 || _cl.indexOf('vp9') !== -1) {
                        failedProfiles.add(S.vpxProfile);
                        diagLog('MSE blacklist: ' + S.vpxProfile + ' (total=' + failedProfiles.size + ')');
                        var _avail = getAvailableVpxProfiles();
                        if (_avail.length > 0) {
                            S.vpxProfile = _avail[0];
                        }
                        diagLog('MSE fallback: VPX → ' + S.vpxProfile);
                    } else {
                        failedProfiles.add(S.avcProfile);
                        diagLog('MSE blacklist: ' + S.avcProfile + ' (total=' + failedProfiles.size + ')');
                        var _avail = getAvailableAvcProfiles();
                        if (_avail.length > 0) {
                            S.avcProfile = _avail[0];
                        }
                        diagLog('MSE fallback: AVC → ' + S.avcProfile);
                    }
                    S.vp8 = false; S.h264 = false;
                    // Закрыть сломанный MediaSource — чтобы следующий initCodec создал свежий
                    mseRestarting = false;
                    try { if (mediaSource && mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch(_e) {}
                    try { if (remoteVideo.src) { URL.revokeObjectURL(remoteVideo.src); remoteVideo.removeAttribute('src'); } } catch(_e) {}
                    mediaSource = null; sourceBuffer = null;
                    applySettings(); saveSettings(); sendSettings();
                }
            });
        }


        function onMSEUpdateEnd() {
            processMSEQueue();
        }

        // ============= Buffer trim (превентивно + по QuotaExceededError) =============
        var TRIM_KEEP_BEHIND = 10;                // держим 10с позади currentTime
        var TRIM_INTERVAL_MS = 10000;             // периодический trim каждые 10 сек
        var lastTrimTime = 0;
        // var trimStartTime = 0;                   // для замера длительности remove()

        function emergencyTrim() {
            if (!sourceBuffer || sourceBuffer.updating) return;
            if (!remoteVideo.buffered || remoteVideo.buffered.length === 0) return;

            var bufStart = remoteVideo.buffered.start(0);
            var bufEnd = remoteVideo.buffered.end(remoteVideo.buffered.length - 1);
            var ct = remoteVideo.currentTime;
            var removeEnd = ct - TRIM_KEEP_BEHIND;

            // Обрезаем только если буфер превышает MAX_BUFFER_SEC
            if (bufEnd - bufStart > MAX_BUFFER_SEC && removeEnd > bufStart) {
                try {
                    sourceBuffer.remove(bufStart, removeEnd);
                } catch(e) {
                    // trimStartTime = 0;
                    diagLog('BUF TRIM error: ' + e.message);
                }
            }
        }

        function processMSEQueue() {
            if (!isActive) return;
            if (!mseReady || !sourceBuffer || sourceBuffer.updating) return;
            // Периодическая обрезка буфера — до взятия чанка из очереди
            var now = Date.now();
            if (now - lastTrimTime >= TRIM_INTERVAL_MS) {
                lastTrimTime = now;
                emergencyTrim();
                if (sourceBuffer.updating) return; // remove() запущен — чанк останется в очереди
            }
            if (mseQueueLength() === 0) return;
            var chunkData = mseQueue[mseQueueReadIdx++];
            mseQueueCompact();
            try {
                sourceBuffer.appendBuffer(new Uint8Array(chunkData));
                diagMSEAppends++;
                if (!firstAppendDone) {
                    firstAppendDone = true;
                    diagLog('PLAY first append muted=' + remoteVideo.muted + ' volume=' + remoteVideo.volume + ' codec=' + codecDisplayName(incomingCodec));
                    remoteVideo.play().then(function() {
                        diagLog('PLAY OK paused=' + remoteVideo.paused);
                    }).catch(function(e) { diagLog('PLAY failed: ' + e.message); });
                }
            } catch (e) {
                diagMSEErrors++;
                mseErrorTimestamps.push(Date.now());
                if (e.name === 'QuotaExceededError') {
                    // Буфер переполнен — агрессивная очистка и повтор
                    diagLog('MSE QuotaExceededError — emergency trim + retry');
                    // Возвращаем чанк в очередь для повторной попытки после updateend от remove
                    if (mseQueueReadIdx > 0) mseQueueReadIdx--;
                    emergencyTrim();
                    return;
                }
                if (e.message && e.message.indexOf('removed from the parent') !== -1) {
                    diagLog('MSE ERR sourceBuffer removed — hanging up');
                    if (!mseCriticalTriggered) {
                        mseCriticalTriggered = true;
                        mseQueue = []; mseQueueReadIdx = 0;
                        hangup();
                    }
                    return;
                }
                checkMSECritical();
                if (mseReady && !mseCriticalTriggered) processMSEQueue();
            }
        }


        function checkMSECritical() {
            if (mseCriticalTriggered) return;
            if (!mseReady) return; // MSE перезапускается — ошибки ожидаемы, не считаем
            var now = Date.now();
            while (mseErrorTimestamps.length > 0 && now - mseErrorTimestamps[0] > MSE_CRITICAL_WINDOW_MS) {
                mseErrorTimestamps.shift();
            }
            if (mseErrorTimestamps.length >= MSE_CRITICAL_THRESHOLD) {
                mseCriticalTriggered = true;
                mseQueue = []; mseQueueReadIdx = 0;
                diagLog('MSE CRITICAL (' + mseErrorTimestamps.length + ' errors in ' + (MSE_CRITICAL_WINDOW_MS / 1000) + 's) — hanging up');
                hangup();
            }
        }

        function restartMSE() {
            if (mseRestarting) return;
            mseRestarting = true;
            diagLog('MSE RESTART (teardown — codec change)');

            // Сброс адаптивных параметров
            try { remoteVideo.playbackRate = 1.0; } catch(e) {}
            _lastHystLogTime = 0;

            // Очистка старого MSE
            mseReady = false;
            firstAppendDone = false;
            mseCriticalTriggered = false;
            mseErrorTimestamps = [];
            mseQueue = []; mseQueueReadIdx = 0; // очищаем — старые чанки от предыдущего кодека вызовут ошибку
            currentMseCodec = '';

            // Полная очистка буфера перед пересозданием MSE
            if (sourceBuffer && mediaSource && mediaSource.readyState === 'open') {
                try { sourceBuffer.abort(); } catch(e) {}  // прервать текущий appendBuffer
                try { sourceBuffer.remove(0, Infinity); } catch(e) {
                    diagLog('MSE RESTART full clear error: ' + e.message);
                }
            }

            if (mediaSource && mediaSource.readyState === 'open') {
                try {
                    if (sourceBuffer && !sourceBuffer.updating) mediaSource.endOfStream();
                } catch(e) {}
            }
            try { URL.revokeObjectURL(remoteVideo.src); } catch(e) {}
            remoteVideo.removeAttribute('src');
            remoteVideo.load();
            sourceBuffer = null;
            mediaSource = null;
        }

        // ============= MediaRecorder =============
        function setupMediaRecorder() {
            if (!localStream) return;
            var activeTracks = localStream.getTracks().filter(function(t) { return t.readyState === 'live'; });
            if (activeTracks.length === 0) { diagLog('REC skipped — no live tracks'); return; }
            var videoTrack = localStream.getVideoTracks()[0];
            var settings = videoTrack ? videoTrack.getSettings() : {};
            var w = settings.width || 320;
            var h = settings.height || 240;

            // При выключенном видео — выбираем audio-only кодек с учётом кнопок Opus/AAC
            var codec;
            if (!S.video && (S.audio || screenAudioOnly)) {
                var audioCodecs = [];
                if (peerSettings && peerSettings.opus) audioCodecs.push('audio/webm;codecs="opus"');
                if (peerSettings && peerSettings.aac) audioCodecs.push('audio/mp4;codecs="mp4a.40.2"');
                if (!audioCodecs.length) audioCodecs.push('audio/webm;codecs="opus"', 'audio/mp4;codecs="mp4a.40.2"');
                audioCodecs.push('audio/webm'); // fallback
                codec = audioCodecs[0];
                for (var i = 0; i < audioCodecs.length; i++) {
                    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(audioCodecs[i])) {
                        codec = audioCodecs[i];
                        break;
                    }
                }
                diagLog('REC audio-only codec=' + codecDisplayName(codec));
            } else {
                // Если recordCodec/negotiatedCodec audio-only но есть видео-треки — используем detectCodec()
                var hasVideoTrack = !!videoTrack;
                var candidate = recordCodec || negotiatedCodec;
                if (candidate && candidate.indexOf('audio/') === 0 && hasVideoTrack) {
                    codec = detectCodec();
                    diagLog('REC codec override: ' + codecDisplayName(candidate) + ' is audio-only but video track present, using ' + codecDisplayName(codec));
                } else {
                    codec = candidate || detectCodec();
                }
                diagLog('REC codec=' + codecDisplayName(codec) + ' res=' + w + 'x' + h);
            }
            updateResLabels();

            try {
                mediaRecorder = new MediaRecorder(localStream, { mimeType: codec, videoKeyFrameIntervalCount: getKeyFrameInterval() });
            } catch (e) {
                diagLog('REC with codec failed: ' + e.message + ', trying without');
                try { mediaRecorder = new MediaRecorder(localStream, {}); }
                catch (e2) { showError('MediaRecorder not supported: ' + e2.message); return; }
            }
            mediaRecorder.ondataavailable = function(e) {
                if (!e.data || e.data.size === 0 || !isActive) return;
                sendChunk(e.data);
                // Чанки записываются на сервер через WS — не нужно писать локально
            };
            var recErrorCount = 0;
            mediaRecorder.onerror = function(e) {
                recErrorCount++;
                diagLog('REC error #' + recErrorCount + ': ' + (e.error ? e.error.message : 'unknown'));
                if (recErrorCount >= 3 && S.video) camBtn.click();
            };
            mediaRecorder.onstart = function() {
                // Отменяем отложенный рестарт — рекордер уже работает
                if (recorderRestartTimer) { clearTimeout(recorderRestartTimer); recorderRestartTimer = null; }
                var recMime = mediaRecorder.mimeType;
                recMimeType = recMime;
                recStartPending = false;  // рекордер перезапустился — следующие чанки пишем в файл
                recorderStarted = true;   // отмечаем что рекордер работает
                // Определяем реальное количество каналов микрофона и обновляем иконку
                if (S.audio && localStream) {
                    var at = localStream.getAudioTracks()[0];
                    if (at) {
                        var as = at.getSettings();
                        var ch = as.channelCount || 1;
                        var micEmoji = ch >= 2 ? '🎙️' : '🎤';
                        if (audioDevices.length > 1 && currentAudioDeviceIndex >= 0) {
                            micBtn.textContent = micEmoji + (currentAudioDeviceIndex + 1);
                        } else {
                            micBtn.textContent = micEmoji;
                        }
                        diagLog('MIC channels=' + ch + ' emoji=' + micEmoji);
                    }
                }
                if (isRecording) {
                    recBtn.classList.remove('pending');
                    recBtn.classList.add('recording');
                    recBtn.textContent = '🔴';
                }
                diagLog('REC started mime=' + recMime);
                if (recMime && wsConnected && ws && ws.readyState === WebSocket.OPEN) {
                    // Если активна запись — сначала startRecording (создаст файл на сервере),
                    // потом initCodec (снимет pending — сервер начнёт писать чанки)
                    if (isRecording) {
                        try {
                            ws.send(JSON.stringify({ cmd: 'startRecording', recordPeerID: myPeerID, codec: recMime }));
                            diagLog('SEND startRecording peerID=' + myPeerID + ' codec=' + recMime);
                        } catch(e) {
                            diagLog('SEND startRecording FAILED: ' + e.message);
                        }
                    }
                    try {
                        ws.send(JSON.stringify({ cmd: 'initCodec', codec: recMime }));
                        diagLog('SEND initCodec=' + recMime);
                    } catch(e) {
                        diagLog('SEND initCodec FAILED: ' + e.message);
                    }
                } else {
                    diagLog('SEND initCodec SKIPPED: recMime=' + !!recMime + ' wsConnected=' + wsConnected + ' ws=' + !!ws + ' readyState=' + (ws ? ws.readyState : 'no ws'));
                }
                sendSettings();
                sendMyRes();
            };
            mediaRecorder.onstop = async function() {
                diagLog('REC onstop called, isRecording=' + isRecording + ' recStartPending=' + recStartPending);
                // Перезапуск рекордера если звонок активен
                if (isActive && (recorderStarted || recStartPending)) {
                    setTimeout(function() {
                        if (isActive) setupMediaRecorder();
                    }, 200);
                }
                recorderStarted = false;
            };
            mediaRecorder.start(CHUNK_INTERVAL_MS);
        }

        // ============= Сохранение состояния =============
        function saveCallState() {
            try {
                if (remoteNativeW > 0 && remoteNativeH > 0) {
                    localStorage.setItem('vc_peerW', remoteNativeW);
                    localStorage.setItem('vc_peerH', remoteNativeH);
                }
                localStorage.setItem('vc_fitMode', remoteFitMode + (remoteMirrored ? 4 : 0));
                saveSettings();
            } catch(e) {}
        }

        function cleanupCall() {
            isActive = false;
            mseReady = false;
            mseQueue = []; mseQueueReadIdx = 0;
            mseCriticalTriggered = false;
            mseRestarting = false;
            currentMseCodec = '';
            // Очистка таймеров
            if (controlsTimer) { clearTimeout(controlsTimer); controlsTimer = null; }
            if (resizeDebounceTimer) { clearTimeout(resizeDebounceTimer); resizeDebounceTimer = null; }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            // Сброс состояния записи — сервер закроет файлы при disconnect
            recStartPending = false;
            if (isRecording) {
                isRecording = false;
                S.isRecording = false;
                recBtn.classList.remove('recording');
            }
            if (isPeerRecording) {
                isPeerRecording = false;
                S.isPeerRecording = false;
                peerRecBtn.classList.remove('recording', 'pending');
                peerRecBtn.textContent = '⏺';
            }
            if (isScreenSharing) {
                isScreenSharing = false;
                S.isScreenSharing = false;
                screenAudioOnly = false;
                displayVideoTrackRef = null;
            }
            if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch (e) {}
            }
        }

        function hangup() {
            if (!isActive) return;
            cleanupCall();
            saveCallState();
            saveAdaptiveSettings();
            disconnectWS();
            endCall();
            setTimeout(function() { window.close(); }, 1500);
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        window.addEventListener('beforeunload', function() {
            cleanupCall();
            saveCallState();
            saveAdaptiveSettings();
            disconnectWS();
            endCall();
        });
    </script>
</body>
</html>
