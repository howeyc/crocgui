<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .videos {
            flex: 1;
            display: flex;
            position: relative;
            padding: 8px;
            gap: 8px;
            min-height: 0;
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .remote-tap-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #ccc;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
        }
        .remote-tap-hint.show { opacity: 1; }
        /* PiP: маленькое локальное видео в углу */
        .pip-container {
            position: absolute;
            width: 240px;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 20;
            cursor: pointer;
            transition: top 0.3s ease, bottom 0.3s ease, left 0.3s ease, right 0.3s ease;
        }
        .pip-container.pip-br { bottom: 12px; right: 12px; top: auto; left: auto; }
        .pip-container.pip-bl { bottom: 12px; left: 12px; top: auto; right: auto; }
        .pip-container.pip-tl { top: 12px; left: 12px; bottom: auto; right: auto; }
        .pip-container.pip-tr { top: 12px; right: 12px; bottom: auto; left: auto; }
        .pip-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .waiting-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .waiting-overlay.hidden { display: none; }
        .waiting-spinner {
            width: 48px; height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-text { color: #aaa; font-size: 1em; }

        .pip-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 4px;
            background: rgba(0,0,0,0.5);
            z-index: 25;
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* Десктоп: показываем кнопки только при hover */
        @media (hover: hover) {
            .pip-container:hover .pip-controls,
            .pip-controls.has-off {
                opacity: 1;
            }
        }
        /* Мобильная: кнопки всегда видны */
        @media (hover: none), (max-width: 600px) {
            .pip-controls {
                opacity: 1;
            }
        }
        .ctrl-btn {
            height: 28px;
            width: 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 0.75em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
        }
        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.mic { background: #4ecca3; }
        .ctrl-btn.mic.off { background: #e94560; }
        .ctrl-btn.cam { background: #4ecca3; }
        .ctrl-btn.cam.off { background: #e94560; }
        .ctrl-btn.hangup { background: #4ecca3; }
        .ctrl-btn.hangup:hover { background: #3db892; }

        .error-banner {
            background: #e94560;
            color: white;
            padding: 12px;
            text-align: center;
            display: none;
        }
        .error-banner.show { display: block; }

        @media (max-height: 500px) {
            .pip-container {
                width: 160px;
                height: 120px;
            }
            .ctrl-btn {
                height: 22px;
                width: 22px;
                font-size: 0.6em;
            }
        }

        @media (max-width: 600px) {
            .videos {
                padding-bottom: 48px;
            }
            .pip-container {
                width: 30%;
                height: auto;
                aspect-ratio: 4/3;
                min-width: 80px;
            }
            .pip-container.pip-br { bottom: 56px; right: 8px; top: auto; left: auto; }
            .pip-container.pip-bl { bottom: 56px; left: 8px; top: auto; right: auto; }
            .pip-container.pip-tl { top: 8px; left: 8px; bottom: auto; right: auto; }
            .pip-container.pip-tr { top: 8px; right: 8px; bottom: auto; left: auto; }
            .ctrl-btn {
                height: 24px;
                width: 24px;
                font-size: 0.65em;
            }
        }
    </style>
</head>
<body>
    <div class="error-banner" id="errorBanner"></div>

    <div class="videos">
        <div class="video-container main-video">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="remote-tap-hint" id="remoteTapHint"></div>
            <div class="waiting-overlay hidden" id="waitingOverlay">
                <div class="waiting-spinner"></div>
                <div class="waiting-text" id="waitingText">Waiting for peer...</div>
            </div>
            <!-- PiP: локальное видео QVGA в углу (тап — смена угла) -->
            <div class="pip-container pip-br" id="pipContainer">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="pip-controls" id="pipControls">
                    <button class="ctrl-btn mic" id="micBtn" title="Mic">🎤</button>
                    <button class="ctrl-btn hangup" id="hangupBtn" title="Close">❌</button>
                    <button class="ctrl-btn cam" id="camBtn" title="Cam">📷</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        // ============= Конфигурация =============
        var CHUNK_INTERVAL_MS = 100;   // Интервал отправки чанков (мс)
        var POLL_INTERVAL_MS = 50;     // Интервал опроса сервера (мс)
        var MAX_BUFFER_SECONDS = 10;   // Максимальный буфер MSE в секундах
        var ALIVE_CHECK_MS = 3000;     // Интервал проверки активности пира
        var PEER_TIMEOUT_SEC = 5;      // Таймаут отсутствия GET от пира

        // Стандартные разрешения для тапа на remoteVideo (по убыванию)
        var STD_RESOLUTIONS = [
            { w: 1280, h: 720 },
            { w: 854,  h: 480 },
            { w: 640,  h: 480 },
            { w: 640,  h: 360 },
            { w: 426,  h: 240 },
            { w: 320,  h: 240 },
            { w: 160,  h: 120 },
            { w: 0,    h: 0 },      // Скрытие видео
        ];

        // ============= Элементы UI =============
        var localVideo = document.getElementById('localVideo');
        var remoteVideo = document.getElementById('remoteVideo');
        var waitingOverlay = document.getElementById('waitingOverlay');
        var waitingText = document.getElementById('waitingText');
        var errorBanner = document.getElementById('errorBanner');
        var micBtn = document.getElementById('micBtn');
        var camBtn = document.getElementById('camBtn');
        var hangupBtn = document.getElementById('hangupBtn');
        var remoteTapHint = document.getElementById('remoteTapHint');

        // ============= Состояние =============
        var params = new URLSearchParams(window.location.search);
        var roomID = params.get('room') || '';
        var isActive = false;
        var localStream = null;
        var mediaRecorder = null;
        var pollInterval = null;
        var aliveInterval = null;
        var isCreator = false;
        var audioEnabled = true;
        var videoEnabled = true;

        // Фиксированные peer ID: host (создатель) / guest (присоединившийся)
        var myPeerID = 'host';
        var remotePeerID = 'guest';
        var lastReceivedIndex = -1;

        // MSE состояние
        var mediaSource = null;
        var sourceBuffer = null;
        var mseQueue = [];           // Очередь чанков для appendBuffer
        var mseReady = false;        // MediaSource готов к приёму данных
        var mseCodec = '';           // Выбранный кодек
        var trimScheduled = false;   // Throttle для trimBuffer

        // Индекс текущего разрешения remote (начинаем с W*0.8)
        var currentResIdx = -1;

        // PiP: переключение углов по тапу
        var pipCorners = ['pip-br', 'pip-bl', 'pip-tl', 'pip-tr'];
        var pipCorner = 0;
        var pipContainer = document.getElementById('pipContainer');
        pipContainer.addEventListener('click', function(e) {
            if (e.target.closest('.pip-controls')) return;
            pipCorner = (pipCorner + 1) % pipCorners.length;
            pipCorners.forEach(function(c) { pipContainer.classList.remove(c); });
            pipContainer.classList.add(pipCorners[pipCorner]);
        });

        // Тап на remoteVideo → уменьшение разрешения
        remoteVideo.addEventListener('click', function() {
            if (!localStream) return;

            // Находим текущий индекс или начинаем с 0
            if (currentResIdx < 0) {
                currentResIdx = 0;
            } else {
                currentResIdx++;
            }

            if (currentResIdx >= STD_RESOLUTIONS.length) {
                currentResIdx = STD_RESOLUTIONS.length - 1;
            }

            var res = STD_RESOLUTIONS[currentResIdx];

            if (res.w === 0) {
                // Скрываем видео (чёрный кадр)
                localStream.getVideoTracks().forEach(function(track) {
                    track.enabled = false;
                });
                videoEnabled = false;
                camBtn.classList.add('off');
                camBtn.textContent = '📷';
                updateControlsVisibility();
                showTapHint('Video off');
            } else {
                // Включаем видео если было выключено
                localStream.getVideoTracks().forEach(function(track) {
                    track.enabled = true;
                    videoEnabled = true;
                });
                camBtn.classList.remove('off');
                camBtn.textContent = '📷';

                // Применяем новое разрешение
                var track = localStream.getVideoTracks()[0];
                if (track && track.applyConstraints) {
                    track.applyConstraints({
                        width: { ideal: res.w },
                        height: { ideal: res.h }
                    }).catch(function(e) {
                        console.warn('applyConstraints error:', e);
                    });
                }
                showTapHint(res.w + 'x' + res.h);
                updateControlsVisibility();
            }
        });

        function showTapHint(text) {
            remoteTapHint.textContent = text;
            remoteTapHint.classList.add('show');
            setTimeout(function() { remoteTapHint.classList.remove('show'); }, 1500);
        }

        if (!roomID) {
            showError('No room ID specified. URL: /videocall.html?room=ROOM_ID');
        } else {
            init();
        }

        // ============= Инициализация =============
        async function init() {
            try {
                // Адаптивное разрешение: 80% ширины окна, max 1280x720
                var W = Math.min(Math.floor(window.innerWidth * 0.8), 1280);
                var H = Math.min(Math.floor(W * 3 / 4), 720);
                console.log('Camera resolution: ' + W + 'x' + H);

                // Получаем доступ к камере и микрофону
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: W }, height: { ideal: H }, facingMode: 'user' },
                    audio: true
                });

                // Находим ближайший STD_RESOLUTIONS для currentResIdx
                initResIdx(localStream);

                localVideo.srcObject = localStream;

                // Пробуем создать комнату
                var createResult = await tryCreateRoom();
                isCreator = createResult.created;

                if (isCreator) {
                    myPeerID = 'host';
                    remotePeerID = 'guest';
                    waitingOverlay.classList.remove('hidden');
                    waitingText.textContent = 'Waiting for peer to join...';
                    var joined = await waitForPeer();
                    if (!joined) {
                        showError('Peer did not join within 30 seconds');
                        return;
                    }
                    waitingOverlay.classList.add('hidden');
                } else {
                    myPeerID = 'guest';
                    remotePeerID = 'host';
                    await joinRoom();
                }

                startCall();
            } catch (err) {
                console.error('Init error:', err);
                if (err.name === 'NotAllowedError') {
                    showError('Camera and microphone access denied.');
                } else if (err.name === 'NotFoundError') {
                    showError('No camera or microphone found.');
                } else {
                    showError('Error: ' + err.message);
                }
            }
        }

        // Определяем начальный индекс в STD_RESOLUTIONS по реальному разрешению
        function initResIdx(stream) {
            var track = stream.getVideoTracks()[0];
            if (!track) return;
            var settings = track.getSettings();
            var rw = settings.width || 640;
            var rh = settings.height || 480;

            // Ищем ближайшее меньшее или равное в STD_RESOLUTIONS
            currentResIdx = 0;
            for (var i = 0; i < STD_RESOLUTIONS.length; i++) {
                if (STD_RESOLUTIONS[i].w >= rw) {
                    currentResIdx = i;
                }
            }
            console.log('Initial res idx: ' + currentResIdx + ' (' + rw + 'x' + rh + ')');
        }

        // ============= API =============
        async function tryCreateRoom() {
            try {
                var resp = await fetch('/api/call/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID })
                });
                if (!resp.ok) return { created: false };
                var data = await resp.json();
                return { created: data.status === 'created' };
            } catch (e) {
                return { created: false };
            }
        }

        async function waitForPeer() {
            try {
                var resp = await fetch('/api/call/wait?room=' + encodeURIComponent(roomID));
                if (!resp.ok) return false;
                var data = await resp.json();
                return data.status === 'joined';
            } catch (e) {
                return false;
            }
        }

        async function joinRoom() {
            try {
                var resp = await fetch('/api/call/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: roomID })
                });
                return resp.ok;
            } catch (e) {
                return false;
            }
        }

        async function sendChunk(buffer) {
            try {
                await fetch('/api/call/chunk?room=' + encodeURIComponent(roomID) + '&peer=' + myPeerID, {
                    method: 'POST',
                    body: buffer
                });
            } catch (e) {
                console.error('Send chunk error:', e);
            }
        }

        async function getChunks(afterIndex) {
            try {
                var resp = await fetch('/api/call/chunk?room=' + encodeURIComponent(roomID) +
                    '&peer=' + encodeURIComponent(remotePeerID) +
                    '&self=' + encodeURIComponent(myPeerID) +
                    '&after=' + afterIndex);
                if (!resp.ok) return [];
                var buf = await resp.arrayBuffer();
                return parseChunksBinary(buf);
            } catch (e) {
                return [];
            }
        }

        // Проверка активности пира
        async function checkPeerAlive() {
            try {
                var resp = await fetch('/api/call/alive?room=' + encodeURIComponent(roomID) +
                    '&peer=' + encodeURIComponent(remotePeerID));
                if (!resp.ok) return false;
                var data = await resp.json();
                return data.alive === true;
            } catch (e) {
                return false;
            }
        }

        // Парсинг бинарного формата: count|index|size|data|...
        function parseChunksBinary(buf) {
            var chunks = [];
            var view = new DataView(buf);
            var offset = 0;
            if (buf.byteLength < 4) return chunks;
            var count = view.getUint32(offset); offset += 4;
            for (var i = 0; i < count; i++) {
                if (offset + 8 > buf.byteLength) break;
                var index = view.getUint32(offset); offset += 4;
                var size = view.getUint32(offset); offset += 4;
                if (offset + size > buf.byteLength) break;
                var data = buf.slice(offset, offset + size);
                offset += size;
                chunks.push({ index: index, data: data });
            }
            return chunks;
        }

        async function endCall() {
            try {
                await fetch('/api/call/room?room=' + encodeURIComponent(roomID), { method: 'DELETE' });
            } catch (e) {}
        }

        // ============= Звонок =============
        function startCall() {
            isActive = true;

            // Настройка MSE для удалённого видео
            setupMSE();

            // Настройка записи и отправки
            setupMediaRecorder();

            // Запуск опроса сервера
            startPolling();

            // Запуск проверки активности пира
            startAliveCheck();
        }

        // ============= MSE: Media Source Extensions =============
        function setupMSE() {
            mseCodec = detectCodec();

            mediaSource = new MediaSource();
            remoteVideo.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener('sourceopen', function() {
                var actualCodec = mediaRecorder ? mediaRecorder.mimeType : mseCodec;
                console.log('MSE: sourceopen, codec:', actualCodec);

                try {
                    sourceBuffer = mediaSource.addSourceBuffer(actualCodec);
                    sourceBuffer.mode = 'sequence';

                    sourceBuffer.addEventListener('updateend', function() {
                        onMSEUpdateEnd();
                    });

                    sourceBuffer.addEventListener('error', function(e) {
                        console.error('MSE: SourceBuffer error:', e);
                    });

                    mseReady = true;

                    if (mseQueue.length > 0) {
                        console.log('MSE: Processing ' + mseQueue.length + ' queued chunks');
                        processMSEQueue();
                    }
                } catch (e) {
                    console.error('MSE: addSourceBuffer error:', e);
                    showError('MSE codec not supported: ' + mseCodec);
                }
            });
        }

        function onMSEUpdateEnd() {
            if (!trimScheduled) {
                trimScheduled = true;
                setTimeout(function() {
                    trimBuffer();
                    trimScheduled = false;
                }, 1000);
            }
            processMSEQueue();
        }

        function processMSEQueue() {
            if (!mseReady || !sourceBuffer || sourceBuffer.updating) return;
            if (mseQueue.length === 0) return;

            var chunkData = mseQueue.shift();

            try {
                var uint8 = new Uint8Array(chunkData);
                sourceBuffer.appendBuffer(uint8);
            } catch (e) {
                console.error('MSE: appendBuffer error:', e);
                processMSEQueue();
            }
        }

        function trimBuffer() {
            if (!sourceBuffer || sourceBuffer.updating) return;
            if (!remoteVideo.buffered || remoteVideo.buffered.length === 0) return;

            try {
                var buffered = remoteVideo.buffered;
                var bufferEnd = buffered.end(buffered.length - 1);
                var bufferStart = buffered.start(0);
                var bufferDuration = bufferEnd - bufferStart;

                if (bufferDuration > MAX_BUFFER_SECONDS) {
                    var removeEnd = bufferEnd - MAX_BUFFER_SECONDS;
                    if (removeEnd > bufferStart + 0.5) {
                        sourceBuffer.remove(bufferStart, removeEnd);
                    }
                }
            } catch (e) {}
        }

        function handleRemoteChunks(chunks) {
            if (!chunks || chunks.length === 0) return;

            for (var i = 0; i < chunks.length; i++) {
                var chunk = chunks[i];
                if (chunk.index > lastReceivedIndex) {
                    lastReceivedIndex = chunk.index;
                    mseQueue.push(chunk.data);
                }
            }

            if (mseReady) {
                processMSEQueue();
            }
        }

        // ============= Определение кодека =============
        function detectCodec() {
            var codecs = [
                'video/webm;codecs="vp8,opus"',
                'video/webm;codecs="vp9,opus"',
                'video/webm;codecs="vp8"',
                'video/webm;codecs="vp9"',
                'video/webm',
                'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
                'video/mp4'
            ];

            for (var i = 0; i < codecs.length; i++) {
                if (MediaSource.isTypeSupported(codecs[i]) &&
                    (typeof MediaRecorder === 'undefined' || MediaRecorder.isTypeSupported(codecs[i]))) {
                    console.log('Selected codec:', codecs[i]);
                    return codecs[i];
                }
            }
            return 'video/webm;codecs="vp8,opus"';
        }

        // ============= MediaRecorder =============
        function setupMediaRecorder() {
            try {
                mediaRecorder = new MediaRecorder(localStream, {
                    mimeType: mseCodec,
                    videoBitsPerSecond: 300000
                });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(localStream, {
                        videoBitsPerSecond: 300000
                    });
                } catch (e2) {
                    console.error('MediaRecorder error:', e2);
                    showError('MediaRecorder not supported: ' + e2.message);
                    return;
                }
            }

            console.log('MediaRecorder codec:', mediaRecorder.mimeType);

            mediaRecorder.ondataavailable = function(e) {
                if (e.data && e.data.size > 0 && isActive) {
                    e.data.arrayBuffer().then(function(buffer) {
                        sendChunk(buffer);
                    });
                }
            };

            mediaRecorder.onerror = function(e) {
                console.error('MediaRecorder error:', e.error);
            };

            mediaRecorder.start(CHUNK_INTERVAL_MS);
        }

        // ============= Опрос сервера =============
        function startPolling() {
            pollInterval = setInterval(function() {
                if (!isActive) return;
                getChunks(lastReceivedIndex).then(function(chunks) {
                    if (chunks && chunks.length > 0) {
                        handleRemoteChunks(chunks);
                    }
                });
            }, POLL_INTERVAL_MS);
        }

        // ============= Проверка активности пира =============
        function startAliveCheck() {
            aliveInterval = setInterval(function() {
                if (!isActive) return;
                checkPeerAlive().then(function(alive) {
                    if (!alive && isActive) {
                        console.log('Peer disconnected (no GET requests)');
                        hangup();
                    }
                });
            }, ALIVE_CHECK_MS);
        }

        // ============= Управление =============
        micBtn.addEventListener('click', function() {
            if (!localStream) return;
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks().forEach(function(track) {
                track.enabled = audioEnabled;
            });
            micBtn.classList.toggle('off', !audioEnabled);
            micBtn.textContent = '🎤';
            updateControlsVisibility();
        });

        camBtn.addEventListener('click', function() {
            if (!localStream) return;
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks().forEach(function(track) {
                track.enabled = videoEnabled;
            });
            camBtn.classList.toggle('off', !videoEnabled);
            camBtn.textContent = videoEnabled ? '📷' : '📷';
            updateControlsVisibility();
        });

        hangupBtn.addEventListener('click', function() {
            hangup();
        });

        function updateControlsVisibility() {
            var pipControls = document.getElementById('pipControls');
            if (micBtn.classList.contains('off') || camBtn.classList.contains('off')) {
                pipControls.classList.add('has-off');
            } else {
                pipControls.classList.remove('has-off');
            }
        }

        function hangup() {
            isActive = false;

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
            if (aliveInterval) {
                clearInterval(aliveInterval);
                aliveInterval = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(function(track) { track.stop(); });
            }

            // Закрываем MSE
            mseReady = false;
            mseQueue = [];
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch (e) {}
            }

            endCall();

            setTimeout(function() { window.close(); }, 1500);
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        window.addEventListener('beforeunload', function() {
            isActive = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (localStream) {
                localStream.getTracks().forEach(function(track) { track.stop(); });
            }
            endCall();
        });
    </script>
</body>
</html>
